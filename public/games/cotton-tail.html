<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cotton Tail</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1525;
            font-family: Georgia, serif;
            overflow: hidden;
        }
        #game-container {
            display: none;
            width: 100vw;
            height: 100vh;
        }

        /* ===== INTRO SCREEN — meadow backdrop, matched to the in-game
           COLORS palette (meadowBg #6B8E3D, mentor #B8763E, player #F5F0E8,
           trails #FFD700 / #87CEEB, flower colors, cheek pink #F4A7BB). ===== */
        #intro-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
            background: linear-gradient(to bottom, #fef9e7 0%, #fdf3d3 20%, #e9f0c4 40%, #cbe49f 58%, #9bc670 76%, #7da84f 100%);
        }

        /* --- meadow backdrop image, matched to the in-game background --- */
        .path-art {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .path-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* --- sky atmosphere --- */
        .sun-glow {
            position: absolute;
            top: 7%;
            right: 10%;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,232,163,0.85) 0%, rgba(255,250,230,0.45) 42%, rgba(255,250,230,0) 72%);
            filter: blur(1px);
            animation: sunPulse 6s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes sunPulse {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.07); }
        }
        .cloud {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            filter: blur(1px);
            pointer-events: none;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }
        .cloud-1 { top: 9%; left: -20%; width: 110px; height: 32px; opacity: 0.7; animation: driftCloud 42s linear infinite; }
        .cloud-1::before { width: 58px; height: 42px; top: -18px; left: 14px; }
        .cloud-1::after { width: 44px; height: 32px; top: -10px; left: 56px; }
        .cloud-2 { top: 17%; left: -35%; width: 80px; height: 24px; opacity: 0.5; animation: driftCloud 55s linear infinite; animation-delay: -18s; }
        .cloud-2::before { width: 42px; height: 30px; top: -13px; left: 10px; }
        .cloud-2::after { width: 32px; height: 22px; top: -7px; left: 40px; }
        @keyframes driftCloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(150vw); }
        }
        .hill {
            position: absolute;
            left: -10%;
            width: 120%;
            border-radius: 50%;
            pointer-events: none;
        }
        .hill-back { bottom: 24%; height: 130px; background: #8fae57; opacity: 0.5; }
        .hill-front { bottom: 19%; height: 95px; background: #7fa04c; opacity: 0.65; }

        /* --- existing pollen orbs & sparkle stars, unchanged --- */
        .float-orb {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            filter: blur(2px);
            animation: floatAnim ease-in-out infinite, twinkleAnim ease-in-out infinite;
        }
        @keyframes floatAnim {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        @keyframes twinkleAnim {
            0%, 100% { opacity: 0.55; }
            50% { opacity: 1; }
        }
        .sparkle-star {
            position: absolute;
            color: #fef3c7;
            opacity: 0;
            animation: sparkleTwinkle ease-in-out infinite;
            pointer-events: none;
            text-shadow: 0 0 6px rgba(255, 215, 0, 0.6);
        }
        @keyframes sparkleTwinkle {
            0%, 100% { opacity: 0; transform: scale(0.6) rotate(0deg); }
            50% { opacity: 0.9; transform: scale(1) rotate(15deg); }
        }

        /* --- meadow floor: grass tufts + little flowers, same shapes/colors
           as _makeGrassTuft / _makeFlower in the game code --- */
        .grass-band {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 34%;
            pointer-events: none;
        }
        .grass-tuft {
            position: absolute;
            bottom: 4%;
            width: 20px;
            height: 26px;
            transform-origin: bottom center;
            animation: tuftSway ease-in-out infinite;
        }
        .grass-tuft svg { width: 100%; height: 100%; display: block; }
        @keyframes tuftSway {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(4deg); }
        }
        .meadow-flower {
            position: absolute;
            width: 18px;
            height: 18px;
            transform-origin: center 70%;
            animation: flowerSway ease-in-out infinite;
        }
        .meadow-flower svg { width: 100%; height: 100%; display: block; }
        @keyframes flowerSway {
            0%, 100% { transform: rotate(-6deg); }
            50% { transform: rotate(6deg); }
        }

        /* --- the burrow doorway the rabbits disappear into, styled like
           the game's meadow portal (rim #5A4A32 / hole #1a1310) --- */
        .burrow {
            position: absolute;
            left: 79%;
            bottom: 6%;
            width: 92px;
            height: 46px;
            pointer-events: none;
        }
        .burrow-rim {
            position: absolute;
            left: 50%; bottom: 6px;
            width: 78px; height: 28px;
            transform: translateX(-50%);
            background: #5A4A32;
            border-radius: 50%;
            opacity: 0.85;
        }
        .burrow-hole {
            position: absolute;
            left: 50%; bottom: 9px;
            width: 54px; height: 18px;
            transform: translateX(-50%);
            background: #1a1310;
            border-radius: 50%;
            animation: burrowPulse 11s ease-in-out infinite;
        }
        @keyframes burrowPulse {
            0%, 65% { transform: translateX(-50%) scale(1); }
            71% { transform: translateX(-50%) scale(1.3); }
            77% { transform: translateX(-50%) scale(1.05); }
            100% { transform: translateX(-50%) scale(1); }
        }
        .burrow-flower {
            position: absolute;
            width: 12px;
            height: 12px;
        }

        /* --- little "poof" sparkle burst as the rabbits vanish into the
           burrow, timed to the same 11s loop as the run cycle --- */
        .poof-spark {
            position: absolute;
            left: 84%;
            bottom: 13%;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff9e8 0%, #ffe8a3 55%, rgba(255,232,163,0) 75%);
            opacity: 0;
            animation: poofBurst 11s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes poofBurst {
            0%, 64% { opacity: 0; transform: translate(0, 0) scale(0.3); }
            70% { opacity: 0.95; transform: translate(var(--dx), var(--dy)) scale(1); }
            82% { opacity: 0; transform: translate(calc(var(--dx) * 1.9), calc(var(--dy) * 1.9)) scale(0.3); }
            100% { opacity: 0; transform: translate(calc(var(--dx) * 1.9), calc(var(--dy) * 1.9)) scale(0.3); }
        }

        /* --- the two rabbits running through the meadow together, matching
           the Rabbit sprite's own shapes/colors and squash-stretch hop --- */
        .rabbit-wrap {
            position: absolute;
            left: 0;
            bottom: 16%;
            width: 58px;
            height: 72px;
            pointer-events: none;
            will-change: transform;
        }
        .rabbit-wrap svg {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 3px 2px rgba(0,0,0,0.18));
        }
        .mentor-wrap { animation: hopMentor 11s ease-in-out infinite; }
        .player-wrap { animation: hopPlayer 11s ease-in-out infinite; }

        .trail-wrap {
            position: absolute;
            left: 0;
            bottom: 16%;
            width: 1px;
            height: 1px;
            pointer-events: none;
        }
        .trail-dot {
            position: absolute;
            left: -4px;
            top: 30px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            animation: trailTwinkle 1.1s ease-in-out infinite;
        }
        .mentor-dot { background: radial-gradient(circle, #fff3c4 0%, #FFD700 55%, rgba(255,215,0,0) 75%); }
        .player-dot { background: radial-gradient(circle, #eaf6ff 0%, #87CEEB 55%, rgba(135,206,235,0) 75%); }
        @keyframes trailTwinkle {
            0%, 100% { opacity: 0.18; transform: scale(0.6); }
            50% { opacity: 0.65; transform: scale(1); }
        }

        /* mentor (brown rabbit) darts ahead, weaving side to side as if being chased */
        @keyframes hopMentor {
            0%   { transform: translate(-18vw, 0) scale(1, 1); opacity: 1; }
            6%   { transform: translate(-8vw, -22px) scale(0.88, 1.2); }
            12%  { transform: translate(1vw, 6px) scale(1.16, 0.86); }
            18%  { transform: translate(10vw, -20px) scale(0.88, 1.2); }
            24%  { transform: translate(19vw, 8px) scale(1.18, 0.84); }
            30%  { transform: translate(28vw, -19px) scale(0.88, 1.2); }
            36%  { transform: translate(37vw, 6px) scale(1.16, 0.86); }
            42%  { transform: translate(46vw, -21px) scale(0.86, 1.22); }
            48%  { transform: translate(55vw, 5px) scale(1.18, 0.84); }
            54%  { transform: translate(63vw, -17px) scale(0.9, 1.16); }
            60%  { transform: translate(72vw, 6px) scale(1.14, 0.88); }
            66%  { transform: translate(81vw, -18px) scale(0.9, 1.16); }
            72%  { transform: translate(90vw, 5px) scale(1.14, 0.88); }
            78%  { transform: translate(99vw, -16px) scale(0.9, 1.16); }
            84%  { transform: translate(108vw, 4px) scale(1, 1); opacity: 1; }
            84.01% { transform: translate(-18vw, 0) scale(1, 1); opacity: 1; }
            100% { transform: translate(-6vw, -18px) scale(0.9, 1.16); opacity: 1; }
        }
        @keyframes hopPlayer {
            0%   { transform: translate(-22vw, 14px) scale(1, 1); opacity: 1; }
            6%   { transform: translate(-12vw, 10px) scale(0.9, 1.18); }
            12%  { transform: translate(-3vw, -14px) scale(1.15, 0.87); }
            18%  { transform: translate(6vw, 12px) scale(0.9, 1.18); }
            24%  { transform: translate(15vw, -12px) scale(1.17, 0.85); }
            30%  { transform: translate(24vw, 11px) scale(0.9, 1.18); }
            36%  { transform: translate(33vw, -13px) scale(1.15, 0.87); }
            42%  { transform: translate(42vw, 10px) scale(0.88, 1.2); }
            48%  { transform: translate(51vw, -12px) scale(1.17, 0.85); }
            54%  { transform: translate(59vw, 9px) scale(0.92, 1.14); }
            60%  { transform: translate(68vw, -10px) scale(1.13, 0.89); }
            66%  { transform: translate(77vw, 10px) scale(0.92, 1.14); }
            72%  { transform: translate(86vw, -10px) scale(1.13, 0.89); }
            78%  { transform: translate(95vw, 10px) scale(0.92, 1.14); }
            84%  { transform: translate(104vw, -8px) scale(1, 1); opacity: 1; }
            84.01% { transform: translate(-22vw, 14px) scale(1, 1); opacity: 1; }
            100% { transform: translate(-10vw, -4px) scale(0.92, 1.14); opacity: 1; }
        }


        /* --- the storybook card, same wording, softened into a little
           parchment panel so it stays legible over the meadow scene --- */
        .intro-content {
            position: relative;
            z-index: 10;
            max-width: 500px;
            background: rgba(255, 253, 240, 0.6);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
            border: 1px solid rgba(120, 53, 15, 0.15);
            border-radius: 28px;
            padding: 40px 36px 32px;
            box-shadow: 0 24px 50px -18px rgba(90, 60, 20, 0.35), 0 0 0 1px rgba(255,255,255,0.3) inset;
            animation: cardIn 900ms ease-out both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .intro-content h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            color: #78350f;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }
        .intro-content .subtitle {
            font-size: 0.875rem;
            color: rgba(120, 53, 15, 0.7);
            font-style: italic;
            margin-bottom: 40px;
        }
        .intro-btn {
            padding: 12px 40px;
            background: #78350f;
            color: #fefce8;
            border: none;
            border-radius: 9999px;
            font-size: 1.125rem;
            font-family: Georgia, serif;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(120, 53, 15, 0.3);
        }
        .intro-btn:hover {
            background: #92400e;
            transform: scale(1.05);
        }
        .hint {
            margin-top: 32px;
            font-size: 0.75rem;
            color: rgba(120, 53, 15, 0.5);
        }
        @media (prefers-reduced-motion: reduce) {
            .rabbit-wrap, .trail-wrap, .cloud, .float-orb, .sparkle-star,
            .burrow-hole, .meadow-flower, .grass-tuft, .poof-spark, .sun-glow,
            .intro-content {
                animation: none !important;
            }
        }
    </style>
</head>

    <script>
        // CONSTANTS

        const COLORS = {

        // Player hop speed — one single source of truth, deliberately NOT keyed off

        const IMITATE_PHRASES = [

        const TRADE_PHRASES = [

            [{ dx: -50, dy: 0, t: 250 }, { dx: 0, dy: 50, t: 250 }, { dx: 40, dy: 0, t: 250 }],

        const TRADE_LONG_PHRASES = [

            [{ dx: 160, dy: 160, t: 450 }, { dx: -40, dy: 0, t: 140 }, { dx: -40, dy: 0, t: 140 }, { dx: 0, dy: -160,
                t: 450 }],
            [{ dx: 0, dy: -50, t: 140 }, { dx: 0, dy: -50, t: 140 }, { dx: 160, dy: 0, t: 450 }, { dx: 0, dy: 160,
                t: 450 }]
        ];
        const N = {
            Bb2: 116.54,
            G2: 98.00,
            C3: 130.81,
            F2: 87.31,
            D3: 146.83,
            Eb3: 155.56,
            A2: 110.00,
            B2: 123.47,
            F3: 174.61,
            G3: 196.00,
            E3: 164.81,
            Bb3: 233.08,
            A3: 220.00,
            C4: 261.63,
            Fs3: 185.00,
            Gb3: 185.00,
            Ab3: 207.65,
            Db4: 277.18,
            D4: 293.66,
        };
        // A section: 8 bars, 2 chords per bar (chord changes every 2 beats)
        const A_CHORDS = [
            { root: N.Bb2, fifth: N.F3, chord: [N.Bb2, N.D3, N.F3] },
            { root: N.G2, fifth: N.D3, chord: [N.G2, N.B2, N.D3, N.F3] },
            { root: N.C3, fifth: N.G3, chord: [N.C3, N.Eb3, N.G3, N.Bb3] },
            { root: N.F2, fifth: N.C3, chord: [N.F2, N.A2, N.C3, N.Eb3] },
            { root: N.D3, fifth: N.A3, chord: [N.D3, N.F3, N.A3, N.C4] },
            { root: N.G2, fifth: N.D3, chord: [N.G2, N.B2, N.D3, N.F3] },
            { root: N.C3, fifth: N.G3, chord: [N.C3, N.Eb3, N.G3, N.Bb3] },
            { root: N.F2, fifth: N.C3, chord: [N.F2, N.A2, N.C3, N.Eb3] },
            { root: N.Bb2, fifth: N.F3, chord: [N.Bb2, N.D3, N.F3, N.G3] },
            { root: N.Bb2, fifth: N.F3, chord: [N.Bb2, N.D3, N.F3, N.Ab3] },
            { root: N.Eb3, fifth: N.Bb3, chord: [N.Eb3, N.G3, N.Bb3, N.D4] },
            { root: N.Eb3, fifth: N.Bb3, chord: [N.Eb3, N.Gb3, N.Bb3, N.Db4] },
            { root: N.D3, fifth: N.A3, chord: [N.D3, N.F3, N.A3, N.C4] },
            { root: N.G2, fifth: N.D3, chord: [N.G2, N.B2, N.D3, N.F3] },
            { root: N.C3, fifth: N.G3, chord: [N.C3, N.Eb3, N.G3, N.Bb3] },
            { root: N.F2, fifth: N.C3, chord: [N.F2, N.A2, N.C3, N.Eb3] },
        ];
        // B section: D7 D7 | G7 G7 | C7 C7 | F7 F7 (each chord 4 beats = 8 beats per scale region)
        const B_CHORDS = [
            { root: N.D3, fifth: N.A3, chord: [N.D3, N.Fs3, N.A3] },
            { root: N.D3, fifth: N.A3, chord: [N.D3, N.Fs3, N.A3] },
            { root: N.G2, fifth: N.D3, chord: [N.G2, N.B2, N.D3] },
            { root: N.G2, fifth: N.D3, chord: [N.G2, N.B2, N.D3] },
            { root: N.C3, fifth: N.G3, chord: [N.C3, N.E3, N.G3] },
            { root: N.C3, fifth: N.G3, chord: [N.C3, N.E3, N.G3] },
            { root: N.F2, fifth: N.C3, chord: [N.F2, N.A2, N.C3] },
            { root: N.F2, fifth: N.C3, chord: [N.F2, N.A2, N.C3] },
        ];

        // AUDIO ENGINE
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.isPlaying = false;
                this.bpm = 130;
                this.beatCount = 0;
                this.section = 'A';
                this.chorus = 1;
                this.onBeat = null;
                this.sectionActive = false;
                this.onSectionEnd = null;
            }
            init() {
                if (this.ctx) return;
                this.ctx = new(window.AudioContext || window.webkitAudioContext)();
                this.master = this.ctx.createGain();
                this.master.gain.value = 0.22;
                const comp = this.ctx.createDynamicsCompressor();
                comp.threshold.value = -20;
                comp.knee.value = 24;
                comp.ratio.value = 2.4;
                comp.attack.value = 0.01;
                comp.release.value = 0.25;
                this.master.connect(comp);
                comp.connect(this.ctx.destination);
                this.reverb = this.ctx.createConvolver();
                this.reverb.buffer = this._makeReverbIR(2.4, 2.8);
                this.revSend = this.ctx.createGain();
                this.revSend.gain.value = 0.35;
                this.revReturn = this.ctx.createGain();
                this.revReturn.gain.value = 0.85;
                this.revSend.connect(this.reverb);
                this.reverb.connect(this.revReturn);
                this.revReturn.connect(comp);
            }
            start() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                this.isPlaying = true;
                this.beatCount = 0;
                this.nextBeatTime = this.ctx.currentTime + 0.05;
                this._schedule();
            }
            stop() {
                this.isPlaying = false;
                if (this._timer) { clearTimeout(this._timer);
                    this._timer = null; }
            }
            setSection(s) {
                this.section = s;
                this.beatCount = 0;
                this.sectionActive = true;
                if (this.ctx) {
                    const now = this.ctx.currentTime;
                    if (this.nextBeatTime < now + 0.02) { this.nextBeatTime = now + 0.02; }
                }
            }
            setChorus(c) { this.chorus = c; }
            _schedule() {
                if (!this.isPlaying) return;
                while (this.sectionActive && this.nextBeatTime < this.ctx.currentTime + 0.15) {
                    const chords = this.section === 'A' ? A_CHORDS : B_CHORDS;
                    const beatsPerChord = this.section === 'A' ? 2 : 4;
                    const totalBeats = chords.length * beatsPerChord;
                    if (this.beatCount >= totalBeats) {
                        this.sectionActive = false;
                        const cb = this.onSectionEnd;
                        if (cb) setTimeout(() => cb(), 0);
                        break;
                    }
                    this._playBeat(this.beatCount, this.nextBeatTime);
                    if (this.onBeat) {
                        const delay = Math.max(0, (this.nextBeatTime - this.ctx.currentTime) * 1000);
                        const beat = this.beatCount;
                        setTimeout(() => { if (this.onBeat) this.onBeat(beat); }, delay);
                    }
                    this.beatCount++;
                    this.nextBeatTime += 60 / this.bpm;
                }
                this._timer = setTimeout(() => this._schedule(), 10);
            }
            _playBeat(beatCount, time) {
                const chords = this.section === 'A' ? A_CHORDS : B_CHORDS;
                const beatsPerChord = this.section === 'A' ? 2 : 4;
                const idx = Math.floor(beatCount / beatsPerChord) % chords.length;
                const beatInChord = beatCount % beatsPerChord;
                const beatInBar = beatCount % 4;
                const chord = chords[idx];
                if (beatInChord === 0) {
                    this._playBassNote(chord.root, time, 0.16, 1.6);
                    this._playMusicBoxArp(chord.chord, time, 0.09, 0.045);
                }
                if (this.chorus >= 2 && this.section === 'B' && beatInBar === 2) this._playPluck(chord.fifth * 2, time, 0.04);
                if (this.chorus >= 2 && this.section === 'A' && beatInChord === 1) this._playPluck(chord.fifth * 2, time, 0.04);
                if (beatInBar === 0 && this.chorus >= 2) this._playSoftPad(chord.chord, time);
            }
            _playBassNote(freq, time, peak = 0.15, dur = 1.4) {
                const osc = this.ctx.createOscillator();
                const sub = this.ctx.createOscillator();
                const lp = this.ctx.createBiquadFilter();
                const g = this.ctx.createGain();
                osc.type = 'sine';
                sub.type = 'sine';
                osc.frequency.value = freq;
                sub.frequency.value = freq / 2;
                lp.type = 'lowpass';
                lp.frequency.value = 700;
                lp.Q.value = 0.5;
                g.gain.setValueAtTime(0, time);
                g.gain.linearRampToValueAtTime(peak, time + 0.04);
                g.gain.exponentialRampToValueAtTime(0.001, time + dur);
                const subMix = this.ctx.createGain();
                subMix.gain.value = 0.45;
                osc.connect(lp);
                sub.connect(subMix);
                subMix.connect(lp);
                lp.connect(g);
                g.connect(this.master);
                osc.start(time);
                sub.start(time);
                osc.stop(time + dur + 0.1);
                sub.stop(time + dur + 0.1);
            }
            _playMusicBoxArp(triad, time, peak = 0.05, spacing = 0.05) {
                triad.forEach((f, i) => { this._playPluck(f * 2, time + i * spacing, peak * (1 - i * 0.15)); });
                this._playPluck(triad[2] * 4, time + triad.length * spacing, peak * 0.55, 0.9);
            }
            _playPluck(freq, time, peak = 0.05, dur = 1.1) {
                const osc = this.ctx.createOscillator();
                const oct = this.ctx.createOscillator();
                const vib = this.ctx.createOscillator();
                const vibAmt = this.ctx.createGain();
                const lp = this.ctx.createBiquadFilter();
                const g = this.ctx.createGain();
                const octMix = this.ctx.createGain();
                osc.type = 'sine';
                oct.type = 'triangle';
                osc.frequency.value = freq;
                oct.frequency.value = freq * 2;
                octMix.gain.value = 0.28;
                vib.type = 'sine';
                vib.frequency.value = 4.5;
                vibAmt.gain.value = freq * 0.0025;
                vib.connect(vibAmt);
                vibAmt.connect(osc.frequency);
                lp.type = 'lowpass';
                lp.frequency.setValueAtTime(4200, time);
                lp.frequency.exponentialRampToValueAtTime(900, time + dur);
                g.gain.setValueAtTime(0, time);
                g.gain.linearRampToValueAtTime(peak, time + 0.012);
                g.gain.exponentialRampToValueAtTime(0.001, time + dur);
                osc.connect(lp);
                oct.connect(octMix);
                octMix.connect(lp);
                lp.connect(g);
                g.connect(this.master);
                g.connect(this.revSend);
                vib.start(time);
                osc.start(time);
                oct.start(time);
                vib.stop(time + dur + 0.1);
                osc.stop(time + dur + 0.1);
                oct.stop(time + dur + 0.1);
            }
            _playSoftPad(freqs, time) {
                freqs.forEach(freq => {
                    const a = this.ctx.createOscillator();
                    const lp = this.ctx.createBiquadFilter();
                    const g = this.ctx.createGain();
                    a.type = 'triangle';
                    a.frequency.value = freq;
                    lp.type = 'lowpass';
                    lp.frequency.setValueAtTime(700, time);
                    lp.frequency.linearRampToValueAtTime(1600, time + 1.5);
                    g.gain.setValueAtTime(0, time);
                    g.gain.linearRampToValueAtTime(0.024, time + 0.8);
                    g.gain.exponentialRampToValueAtTime(0.001, time + 2.6);
                    a.connect(lp);
                    lp.connect(g);
                    g.connect(this.master);
                    g.connect(this.revSend);
                    a.start(time);
                    a.stop(time + 2.8);
                });
            }
            _playSimpleTone(freq, time, peak, dur) {
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                g.gain.setValueAtTime(0, time);
                g.gain.linearRampToValueAtTime(peak, time + 0.005);
                g.gain.exponentialRampToValueAtTime(0.001, time + dur);
                osc.connect(g);
                g.connect(this.master);
                osc.start(time);
                osc.stop(time + dur + 0.05);
            }
            _playMotif(notes, spacing, peak, dur = 0.18) {
                const t = this.ctx.currentTime;
                notes.forEach((f, i) => { this._playSimpleTone(f, t + i * spacing, peak, dur); });
            }
            // Warm pitched hop chime — sine + soft triangle octave, quick attack, short decay.
            _playHopNote(freq, peak = 0.075, dur = 0.32) {
                const t = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const oct = this.ctx.createOscillator();
                const octMix = this.ctx.createGain();
                const lp = this.ctx.createBiquadFilter();
                const g = this.ctx.createGain();
                osc.type = 'sine';
                oct.type = 'triangle';
                osc.frequency.value = freq;
                oct.frequency.value = freq * 2;
                octMix.gain.value = 0.22;
                lp.type = 'lowpass';
                lp.frequency.setValueAtTime(4200, t);
                lp.frequency.exponentialRampToValueAtTime(1200, t + dur);
                g.gain.setValueAtTime(0, t);
                g.gain.linearRampToValueAtTime(peak, t + 0.008);
                g.gain.exponentialRampToValueAtTime(0.001, t + dur);
                osc.connect(lp);
                oct.connect(octMix);
                octMix.connect(lp);
                lp.connect(g);
                g.connect(this.master);
                g.connect(this.revSend);
                osc.start(t);
                oct.start(t);
                osc.stop(t + dur + 0.05);
                oct.stop(t + dur + 0.05);
            }
            // Mentor motif — A: F major pentatonic (F G A C D); B: F minor pentatonic (F Ab Bb C Eb)
            playMentorMotif() {
                if (!this.ctx) return;
                const scale = this.section === 'B' ?
                    [349.23, 415.30, 466.16, 523.25, 622.25] :
                    [349.23, 392.00, 440.00, 523.25, 587.33];
                this._playHopNote(scale[Math.floor(Math.random() * scale.length)], 0.18, 0.32);
            }
            // Player motif — A sections unchanged (alternate Bb maj pent / C min pent each bar).
            // B sections: follow the chord changes — progression is D7 (8 beats) → G7 (8 beats)
            // → C7 (8 beats) → F7 (8 beats). Hops pick random notes from the scale matching the
            // chord currently sounding:
            //   D7 → D blues scale      (D F G G# A C)
            //   G7 → G blues scale      (G Bb C C# D F)
            //   C7 → C mixolydian scale  (C D E F G A Bb C)
            //   F7 → F mixolydian scale   (F G A Bb C D Eb F)
            playPlayerMotif() {
                if (!this.ctx) return;
                let scale;
                if (this.section === 'B') {
                    const beatsPerChord = 4;
                    const chordIdx = Math.floor(this.beatCount / beatsPerChord) % B_CHORDS.length;
                    const region = Math.floor(chordIdx / 2); // 0=D, 1=G, 2=C, 3=F
                    const B_PLAYER_SCALES = [
                        [293.66, 349.23, 392.00, 415.30, 440.00, 523.25], // D blues
                        [392.00, 466.16, 523.25, 554.37, 587.33, 698.46], // G blues
                        [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 932.33, 1046.50], // C mixolydian
                        [349.23, 392.00, 440.00, 466.16, 523.25, 587.33, 622.25, 698.46], // F mixolydian
                    ];
                    scale = B_PLAYER_SCALES[region];
                } else {
                    const bar = Math.floor(this.beatCount / 4);
                    scale = (bar % 2 === 0) ?
                        [466.16, 523.25, 587.33, 698.46, 783.99] :
                        [523.25, 622.25, 698.46, 783.99, 932.33];
                }
                this._playHopNote(scale[Math.floor(Math.random() * scale.length)], 0.30, 0.34);
            }
            // Shared "grand chord" voice for both bookends — sine + triangle blend,
            // so the ending's arrival and the intro's hush are the same instrument,
            // just with a different sweep direction, sustain, and set of peaks.
            _playChordSwell(voicing, peaks, time, opts = {}) {
                const { filterFrom = 900, filterTo = 2400, filterTime = 1.5, attack = 0.6, decay = 5.5, stopAt = 6 } = opts;
                voicing.forEach((f, i) => {
                    const a = this.ctx.createOscillator();
                    const b = this.ctx.createOscillator();
                    const lp = this.ctx.createBiquadFilter();
                    const g = this.ctx.createGain();
                    a.type = 'sine';
                    b.type = 'triangle';
                    a.frequency.value = f;
                    b.frequency.value = f * 2;
                    lp.type = 'lowpass';
                    lp.frequency.setValueAtTime(filterFrom, time);
                    lp.frequency.linearRampToValueAtTime(filterTo, time + filterTime);
                    g.gain.setValueAtTime(0, time);
                    g.gain.linearRampToValueAtTime(peaks[i], time + attack);
                    g.gain.exponentialRampToValueAtTime(0.001, time + decay);
                    const bMix = this.ctx.createGain();
                    bMix.gain.value = 0.22;
                    a.connect(lp);
                    b.connect(bMix);
                    bMix.connect(lp);
                    lp.connect(g);
                    g.connect(this.master);
                    g.connect(this.revSend);
                    a.start(time);
                    b.start(time);
                    a.stop(time + stopAt);
                    b.stop(time + stopAt);
                });
            }
            // Final chord — Bb maj9, arrived at gently. Timing/dynamics are the exact
            // mirror of playIntroChime()'s reversed arpeggio below: same offsets,
            // peaks, and ring lengths, read back to front.
            playFinalChord() {
                if (!this.ctx) return;
                const t = this.ctx.currentTime;
                const arpeggio = [698.46, 587.33, 466.16, 440.00];
                const offsets = [0, 0.26, 0.49, 0.70];
                const peaks = [0.07, 0.062, 0.055, 0.05];
                const durs = [2.0, 1.85, 1.75, 1.7];
                arpeggio.forEach((f, i) => { this._playPluck(f, t + offsets[i], peaks[i], durs[i]); });
                const chordStart = t + offsets[offsets.length - 1] + 0.3;
                const voicing = [116.54, 174.61, 233.08, 349.23, 523.25];
                const voicingPeaks = [0.05, 0.035, 0.035, 0.035, 0.02];
                this._playChordSwell(voicing, voicingPeaks, chordStart);
            }
            // Opening chime — the ending arpeggio above, copied and reversed, built
            // from the exact same two voices (plucks + chord swell) so the two
            // bookends are true mirror images rather than separate-sounding cues.
            playIntroChime() {
                if (!this.ctx) return;
                const t = this.ctx.currentTime;
                // playFinalChord()'s arpeggio [698.46, 587.33, 466.16, 440.00], reversed.
                const arpeggio = [440.00, 466.16, 587.33, 698.46];
                // Timing eases open very slightly instead of a strict grid, and both
                // volume and ring grow a touch note to note — the mirror image, note
                // for note, of the ending's decelerating, decrescendo-ing close above.
                const offsets = [0, 0.21, 0.44, 0.70];
                const peaks = [0.05, 0.055, 0.062, 0.07];
                const durs = [1.7, 1.75, 1.85, 2.0];
                arpeggio.forEach((f, i) => { this._playPluck(f, t + offsets[i], peaks[i], durs[i]); });
                // A little twinkle above the last note — the same high-octave sparkle
                // that caps each music-box arpeggio during play (see _playMusicBoxArp).
                const lastOffset = offsets[offsets.length - 1];
                this._playPluck(arpeggio[arpeggio.length - 1] * 2, t + lastOffset + 0.16, 0.028, 1.7);
                // The same chord that arrives at the end of the game, blooming in here
                // as a hush instead — same notes, same voice, just softer and slower to
                // bloom, and settling from bright to warm instead of warm to bright.
                const voicing = [116.54, 174.61, 233.08, 349.23, 523.25];
                const voicingPeaks = [0.032, 0.022, 0.022, 0.022, 0.013];
                const padStart = t + lastOffset + 0.3;
                this._playChordSwell(voicing, voicingPeaks, padStart, {
                    filterFrom: 2400, filterTo: 900, filterTime: 1.8, attack: 0.9, decay: 3.4, stopAt: 3.8,
                });
            }
            _makeReverbIR(seconds = 2.4, decay = 2.8) {
                const rate = this.ctx.sampleRate;
                const len = Math.floor(rate * seconds);
                const ir = this.ctx.createBuffer(2, len, rate);
                for (let ch = 0; ch < 2; ch++) {
                    const data = ir.getChannelData(ch);
                    for (let i = 0; i < len; i++) { data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
                }
                return ir;
            }
        }

        // RABBIT
        class Rabbit {
            constructor(scene, x, y, config) {
                this.scene = scene;
                this.color = config.color;
                this.trailColor = config.trailColor;
                this.facing = 1;
                this.isHopping = false;
                this.hopCount = 0;
                this.x = x;
                this.y = y;
                this.container = scene.add.container(x, y);
                this.container.setDepth(10);
                this.container.setScale(1.35);
                this.glowContainer = scene.add.container(0, 0);
                this.container.add(this.glowContainer);
                const outline = scene.add.ellipse(0, 1, 28, 24, 0x1a1a1a, 0.35);
                outline.setDepth(-1);
                this.container.add(outline);
                const outline2 = scene.add.ellipse(0, -1, 24, 26, 0x1a1a1a, 0.25);
                outline2.setDepth(-1);
                this.container.add(outline2);
                this.shadow = scene.add.ellipse(0, 8, 24, 8, 0x000000, 0.2);
                this.container.add(this.shadow);
                this.body = scene.add.container(0, 0);
                this.container.add(this.body);
                this._drawBody();
                this._startAmbientTwinkle();
                this.breathe();
            }
            // A faint, ever-present sparkle that drifts near the rabbit — purely decorative,
            // gives a storybook "touched by magic" feel without affecting gameplay glows.
            _startAmbientTwinkle() {
                this.twinkleContainer = this.scene.add.container(0, 0);
                this.container.addAt(this.twinkleContainer, 1);
                this._spawnTwinkle();
            }
            _spawnTwinkle() {
                if (!this.twinkleContainer || !this.twinkleContainer.scene) return;
                const ox = (Math.random() - 0.5) * 30;
                const oy = -18 + (Math.random() - 0.5) * 26;
                const star = this.scene.add.circle(ox, oy, 1.4, COLORS.sparkle, 0.85);
                star.setBlendMode(Phaser.BlendModes.ADD);
                this.twinkleContainer.add(star);
                this.scene.tweens.add({
                    targets: star,
                    alpha: 0,
                    scale: 2,
                    y: oy - 8,
                    duration: 900 + Math.random() * 500,
                    ease: 'Sine.out',
                    onComplete: () => star.destroy(),
                });
                const nextDelay = 500 + Math.random() * 700;
                this.twinkleTimer = this.scene.time.delayedCall(nextDelay, () => this._spawnTwinkle());
            }
            _stopAmbientTwinkle() {
                if (this.twinkleTimer) { this.twinkleTimer.remove(false); this.twinkleTimer = null; }
                if (this.twinkleContainer) { this.twinkleContainer.destroy(); this.twinkleContainer = null; }
            }
            _drawBody() {
                const c = this.color;
                this.body.add([
                    this.scene.add.ellipse(-7, 5, 7, 7, 0xFFFFFF, 1),
                    this.scene.add.ellipse(-4, -16, 5, 14, c, 1),
                    this.scene.add.ellipse(4, -16, 5, 14, c, 1),
                    this.scene.add.ellipse(0, 4, 15, 13, c, 1),
                    this.scene.add.circle(0, -7, 9, c, 1),
                    this.scene.add.ellipse(-4, -16, 2, 8, 0xF4A7BB, 1),
                    this.scene.add.ellipse(4, -16, 2, 8, 0xF4A7BB, 1),
                    this.scene.add.circle(2.5, -8, 1.8, 0x333333, 1),
                    this.scene.add.circle(3, -8.5, 0.7, 0xFFFFFF, 1),
                ]);
            }
            breathe() {
                if (this.breatheTween) this.breatheTween.stop();
                this.body.setScale(this.facing, 1);
                this.body.y = 0;
                this.breatheTween = this.scene.tweens.add({
                    targets: this.body,
                    scaleY: 0.95,
                    scaleX: this.facing * 1.03,
                    duration: 1200,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.inOut',
                });
            }
            hopTo(targetX, targetY, duration = 400) {
                return new Promise(resolve => {
                    const dx = targetX - this.x;
                    if (Math.abs(dx) > 5) this.facing = dx > 0 ? 1 : -1;
                    if (this.breatheTween) { this.breatheTween.stop();
                        this.breatheTween = null; }
                    this.body.setScale(this.facing, 1);
                    this.body.y = 0;
                    this.isHopping = true;
                    this.scene.tweens.add({
                        targets: this.container,
                        x: targetX,
                        y: targetY,
                        duration,
                        ease: 'Quad.out',
                        onUpdate: () => {
                            this.x = this.container.x;
                            this.y = this.container.y;
                            if (this._trailWhileMoving && this.trailColor && Math.random() < 0.6) this.leaveTrail();
                        },
                    });
                    const f = this.facing;
                    this.scene.tweens.add({
                        targets: this.body,
                        y: -28,
                        scaleY: 1.2,
                        scaleX: f * 0.82,
                        duration: duration * 0.4,
                        ease: 'Cubic.out',
                        onComplete: () => {
                            this.scene.tweens.add({
                                targets: this.body,
                                y: 0,
                                scaleY: 0.82,
                                scaleX: f * 1.18,
                                duration: duration * 0.4,
                                ease: 'Cubic.in',
                                onComplete: () => {
                                    this.scene.tweens.add({
                                        targets: this.body,
                                        scaleY: 1,
                                        scaleX: f,
                                        duration: 50,
                                        onComplete: () => {
                                            this.body.y = 0;
                                            this.body.setScale(f, 1);
                                            this.isHopping = false;
                                            this.breathe();
                                            this._landingSparkle();
                                            resolve();
                                        },
                                    });
                                },
                            });
                        },
                    });
                });
            }
            setPosition(x, y) { this.x = x;
                this.y = y;
                this.container.setPosition(x, y); }
            setScale(s) { this.container.setScale(s); }
            // Tiny burst of sparkles when paws touch down — purely decorative flourish.
            _landingSparkle() {
                if (!this.scene || !this.scene.add) return;
                const count = 3 + Math.floor(Math.random() * 2);
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2 + Math.random() * 0.6;
                    const dist = 8 + Math.random() * 6;
                    const spark = this.scene.add.circle(this.x, this.y + 6, 1.6, COLORS.sparkleGold, 0.9);
                    spark.setBlendMode(Phaser.BlendModes.ADD);
                    spark.setDepth(9);
                    this.scene.tweens.add({
                        targets: spark,
                        x: this.x + Math.cos(angle) * dist,
                        y: this.y + 6 + Math.sin(angle) * dist - 4,
                        alpha: 0,
                        scale: 0.4,
                        duration: 380 + Math.random() * 160,
                        ease: 'Cubic.out',
                        onComplete: () => spark.destroy(),
                    });
                }
            }
            leaveTrail() {
                if (!this.trailColor) return;
                const trail = this.scene.add.circle(this.x, this.y + 2, 5, this.trailColor, 0.5);
                trail.setBlendMode(Phaser.BlendModes.ADD);
                trail.setDepth(5);
                this.scene.tweens.add({
                    targets: trail,
                    alpha: 0,
                    scale: 2.2,
                    duration: 1400,
                    ease: 'Cubic.out',
                    onComplete: () => trail.destroy(),
                });
            }
            setGlow(color) {
                this.clearGlow();
                const glow = this.scene.add.circle(0, 0, 20, color, 0.25);
                glow.setBlendMode(Phaser.BlendModes.ADD);
                this.glowContainer.add(glow);
                this.glowObj = glow;
                this.glowTween = this.scene.tweens.add({
                    targets: glow,
                    scale: 1.5,
                    alpha: 0.1,
                    duration: 700,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.inOut',
                });
            }
            setListeningGlow() {
                this.clearGlow();
                const glow = this.scene.add.circle(0, 0, 22, 0x87CEEB, 0.12);
                glow.setBlendMode(Phaser.BlendModes.ADD);
                this.glowContainer.add(glow);
                this.glowObj = glow;
                this.glowTween = this.scene.tweens.add({
                    targets: glow,
                    scale: 1.35,
                    alpha: 0.04,
                    duration: 1000,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.inOut',
                });
            }
            setUnderglow(color) {
                this.clearGlow();
                const glow = this.scene.add.ellipse(0, 10, 34, 12, color, 0.4);
                glow.setBlendMode(Phaser.BlendModes.ADD);
                this.glowContainer.add(glow);
                this.glowObj = glow;
                this.glowTween = this.scene.tweens.add({
                    targets: glow,
                    scaleX: 1.5,
                    scaleY: 1.6,
                    alpha: 0.15,
                    duration: 850,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.inOut',
                });
            }
            clearGlow() {
                if (this.glowObj) { this.glowObj.destroy();
                    this.glowObj = null; }
                if (this.glowTween) { this.glowTween.stop();
                    this.glowTween = null; }
            }
            showPrompt() {
                if (this.prompt) return;
                this.prompt = this.scene.add.text(0, -28, '?', {
                    fontFamily: 'Georgia, serif',
                    fontSize: '16px',
                    color: '#FFD700',
                    fontStyle: 'italic',
                }).setOrigin(0.5).setAlpha(0);
                this.container.add(this.prompt);
                this.scene.tweens.add({
                    targets: this.prompt,
                    alpha: 0.6,
                    y: -33,
                    duration: 500,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.inOut',
                });
            }
            hidePrompt() { if (this.prompt) { this.prompt.destroy();
                    this.prompt = null; } }
            destroy() {
                if (this.breatheTween) this.breatheTween.stop();
                this._stopAmbientTwinkle();
                this.clearGlow();
                this.hidePrompt();
                this.container.destroy();
            }
        }

        // MENTOR BRAIN — randomization helpers
        function shuffleArray(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function jitterWaypoints(points, magnitude = 45) {
            return points.map(p => ({
                x: Phaser.Math.Clamp(p.x + (Math.random() * 2 - 1) * magnitude, 80, GAME_WIDTH - 80),
                y: Phaser.Math.Clamp(p.y + (Math.random() * 2 - 1) * magnitude, 80, GAME_HEIGHT - 80),
            }));
        }

        function applySymmetry(phrase) {
            const transforms = [
                (x, y) => [x, y],
                (x, y) => [-x, y],
                (x, y) => [x, -y],
                (x, y) => [-x, -y],
                (x, y) => [y, x],
                (x, y) => [-y, x],
                (x, y) => [y, -x],
                (x, y) => [-y, -x],
            ];
            const xform = transforms[Math.floor(Math.random() * transforms.length)];
            return phrase.map(action => {
                if (action.pause) return { ...action };
                const [dx, dy] = xform(action.dx, action.dy);
                return { dx, dy, t: action.t };
            });
        }

        function jitterPhrase(phrase, magnitude = 0.3) {
            return phrase.map(action => {
                if (action.pause) return { ...action };
                const scaleX = 1 + (Math.random() * 2 - 1) * magnitude;
                const scaleY = 1 + (Math.random() * 2 - 1) * magnitude;
                return { dx: Math.round(action.dx * scaleX), dy: Math.round(action.dy * scaleY), t: action.t };
            });
        }

        function randomizePhrase(phrase, magnitude = 0.3) {
            return jitterPhrase(applySymmetry(phrase), magnitude);
        }

        function generateRandomLeaderPath(startX, startY, count, minDist = 180, maxDist = 350) {
            const path = [];
            let cx = startX;
            let cy = startY;
            for (let i = 0; i < count; i++) {
                const distance = minDist + Math.random() * (maxDist - minDist);
                const angle = Math.random() * Math.PI * 2;
                let nx = cx + Math.cos(angle) * distance;
                let ny = cy + Math.sin(angle) * distance;
                if (nx < 60 || nx > GAME_WIDTH - 60) nx = cx - Math.cos(angle) * distance;
                if (ny < 60 || ny > GAME_HEIGHT - 60) ny = cy - Math.sin(angle) * distance;
                cx = Phaser.Math.Clamp(nx, 60, GAME_WIDTH - 60);
                cy = Phaser.Math.Clamp(ny, 60, GAME_HEIGHT - 60);
                path.push({ x: cx, y: cy });
            }
            return path;
        }

        class MentorBrain {
            constructor(mentor, player, scene, audio) {
                this.mentor = mentor;
                this.player = player;
                this.scene = scene;
                this.audio = audio;
                this.state = 'idle';
                this.busy = false;
                this.onPhaseComplete = null;
            }
            cleanup() {
                this.scene.tweens.killTweensOf(this.mentor.container);
                this.scene.tweens.killTweensOf(this.mentor.body);
                this.scene.tweens.killTweensOf(this.player.container);
                this.scene.tweens.killTweensOf(this.player.body);
                this.mentor.body.y = 0;
                this.mentor.body.setScale(this.mentor.facing, 1);
                this.mentor.isHopping = false;
                this.mentor._trailWhileMoving = false;
                this.mentor.breathe();
                this.player.body.y = 0;
                this.player.body.setScale(this.player.facing, 1);
                this.player.isHopping = false;
                this.player._trailWhileMoving = false;
                this.player.breathe();
                this.mentor.clearGlow();
                this.mentor.hidePrompt();
                this.player.clearGlow();
                this.state = 'idle';
                this.busy = false;
                this._phaseEnded = true;
                if (this.scene.playerFrozen !== undefined) { this.scene.playerFrozen = false; }
                if (this._playerLeadsPauseTimer) { clearTimeout(this._playerLeadsPauseTimer);
                    this._playerLeadsPauseTimer = null; }
            }
            update(time, delta) {
                if (this.state === 'player-leads-waiting' || this.state === 'player-leads-copying') {
                    this.playerLeadsTimer += delta;
                    if (this.playerLeadsTimer >= this.playerLeadsDuration) {
                        this._phaseEnded = true;
                        this.cleanup();
                        this.onPhaseComplete?.();
                        return;
                    }
                }
                if ((this.state === 'demonstrating' || this.state === 'waiting') && this.mode === 'trade-long') {
                    this.tradeTimer += delta;
                    if (this.tradeTimer >= this.tradeDuration) {
                        this._phaseEnded = true;
                        this.cleanup();
                        this.onPhaseComplete?.();
                        return;
                    }
                }
                if (this.state === 'final') {
                    this.finalTimer += delta;
                    if (this.finalTimer >= this.finalDuration) {
                        this._phaseEnded = true;
                        this.player.clearGlow();
                        this.player._trailWhileMoving = false;
                        this.cleanup();
                        this.onPhaseComplete?.();
                        return;
                    }
                }
                if (this.busy) return;
                switch (this.state) {
                    case 'waiting':
                        this._updateWaiting();
                        break;
                    case 'following_player':
                        this._updateFollowingPlayer(time, delta);
                        break;
                    case 'final':
                        this._updateFinal(time, delta);
                        break;
                    case 'free-both':
                        this._updateFreeBoth(time, delta);
                        break;
                    case 'player-leads-waiting':
                        this._updatePlayerLeadsWaiting();
                        break;
                    case 'player-leads-copying':
                        this._updatePlayerLeadsCopying(time, delta);
                        break;
                    case 'mentor-chase':
                        this._updateMentorChase(time, delta);
                        break;
                }
            }
            startLeading(waypoints, hopDuration = 480) {
                this.cleanup();
                this.state = 'leading';
                this.waypoints = jitterWaypoints(waypoints);
                this.wpIndex = 0;
                this.hopDuration = hopDuration;
                this.mentor.setGlow(COLORS.mentorTrail);
                this.mentor._trailWhileMoving = true;
                this._hopToNextWaypoint();
            }
            _hopToNextWaypoint() {
                if (this.state !== 'leading') return;
                if (this.wpIndex >= this.waypoints.length) { this.state = 'idle';
                    this.onPhaseComplete?.(); return; }
                const wp = this.waypoints[this.wpIndex];
                this.busy = true;
                this.audio.playMentorMotif();
                this.mentor.leaveTrail();
                this.mentor.hopTo(wp.x, wp.y, this.hopDuration).then(() => {
                    this.busy = false;
                    this.wpIndex++;
                    this.scene.time.delayedCall(180, () => this._hopToNextWaypoint());
                });
            }

                if (!this._exitShrunk && this._exitShrinkBeat !== null &&
                    beatCount >= this._exitShrinkBeat && this.audioEngine.sectionActive) {
                    this._exitShrunk = true;
                    this._shrinkRabbitsIntoPortal(260);
                }
            }
            _showFloatingName(target, text, duration = 3000) {
                const txt = this.add.text(target.x, target.y - 42, text, {
                    fontFamily: 'Georgia, serif',
                    fontSize: '15px',
                    color: '#fef3c7',
                    align: 'center',
                    fontStyle: 'italic',
                    stroke: '#1a1525',
                    strokeThickness: 4,
                    shadow: { offsetX: 0, offsetY: 2, color: '#000000', blur: 4, fill: true },
                }).setOrigin(0.5).setAlpha(0).setDepth(100);
                this.tweens.add({ targets: txt, alpha: 0.95, duration: 600 });
                this.time.delayedCall(duration - 600, () => {
                    this.tweens.add({
                        targets: txt,
                        alpha: 0,
                        duration: 600,
                        onComplete: () => {
                            this.trackingTexts = this.trackingTexts.filter(t => t.obj !== txt);
                            txt.destroy();
                        },
                    });
                });
                this.trackingTexts.push({ obj: txt, target });
                return txt;
            }
            _endGame() {
                this.ended = true;
                this._clearPhaseVisuals();
                this.mentorBrain.cleanup();
                this.audioEngine.stop();
                this.audioEngine.playFinalChord();
                const message = '"None of us are completely independent"\n(Mingus, 2013, as cited in Annamma & Handy, 2019).\n\nYou find your voice by listening.';
                const TOP_BLOCK_Y = 130;
                const BOTTOM_BLOCK_Y = 480;
                const overlapsBlock = (blockY) => {
                    const halfHeight = 110;
                    const halfWidth = 320;
                    return [this.mentor, this.player].some(r =>
                        Math.abs(r.y - blockY) < halfHeight && Math.abs(r.x - GAME_WIDTH / 2) < halfWidth);
                };
                let blockY = TOP_BLOCK_Y;
                if (overlapsBlock(TOP_BLOCK_Y) && !overlapsBlock(BOTTOM_BLOCK_Y)) { blockY = BOTTOM_BLOCK_Y; }
                const txt = this.add.text(GAME_WIDTH / 2, blockY, message, {
                    fontFamily: 'Georgia, serif',
                    fontSize: '24px',
                    color: '#1a1525',
                    stroke: '#ffffff',
                    strokeThickness: 4,
                    align: 'center',
                    wordWrap: { width: 620 },
                    lineHeight: 1.6,
                }).setOrigin(0.5).setAlpha(0).setDepth(1000);
                this.tweens.add({ targets: txt, alpha: 1, duration: 2000 });
                const btn = this.add.text(GAME_WIDTH / 2, blockY + 120, 'listen again', {
                    fontFamily: 'Georgia, serif',
                    fontSize: '20px',
                    color: '#1a1525',
                    stroke: '#ffffff',
                    strokeThickness: 4,
                    fontStyle: 'italic',
                }).setOrigin(0.5).setAlpha(0).setDepth(1000).setInteractive({ useHandCursor: true });
                btn.on('pointerover', () => btn.setColor('#5A4A32'));
                btn.on('pointerout', () => btn.setColor('#1a1525'));
                btn.on('pointerdown', () => { this.audioEngine.stop();
                    restartGame(); });
                this.time.delayedCall(2000, () => { this.tweens.add({ targets: btn, alpha: 0.85, duration: 1200 }); });
            }
            update(time, delta) {
                if (this.ended) return;
                this._updatePlayer(time);
                this._updatePollen();
                this._updateButterflies();
                this._updateEmberMotes();
                this._updatePortalSparkles(time);
                if (this.trackingTexts) {
                    this.trackingTexts.forEach(t => { t.obj.x = t.target.x;
                        t.obj.y = t.target.y - 42; });
                }
                this.mentorBrain.update(time, delta);
                this._checkA1FollowTag(delta);
            }
            _checkA1FollowTag(delta) {
                if (!this._musicStarted) { this._a1TagCooldown = 0; this._a1TagArmed = false; return; }
                const phase = FLOW[this.phaseIndex];
                if (!phase || phase.mode !== 'follow' || phase.chorus !== 1) { this._a1TagCooldown = 0; this._a1TagArmed = false; return; }
                this._a1TagCooldown = Math.max(0, (this._a1TagCooldown || 0) - delta);
                const dx = this.player.x - this.mentor.x;
                const dy = this.player.y - this.mentor.y;
                const distSq = dx * dx + dy * dy;
                if (!this._a1TagArmed) {
                    // The mentor starts right next to the player at the top of this phase —
                    // require him to actually hop away past the tag radius once before the
                    // proximity tag can trigger, so it can't fire off the shared start position.
                    if (distSq > 260 * 260) this._a1TagArmed = true;
                    return;
                }
                if (this._a1TagCooldown > 0) return;
                if (distSq < 260 * 260) {
                    this._a1TagCooldown = 300;
                    this.audioEngine.playMentorMotif();
                    this.playerFrozen = true;
                    this.time.delayedCall(300, () => { this.playerFrozen = false; });
                }
            }
        }

        // UI / LIFECYCLE
        let phaserGame = null;

        // Opening chime — plays playIntroChime() once as the intro screen loads.
        // Browsers block audio until a user gesture, so this tries right away and,
        // if that's blocked, falls back to firing on the visitor's first interaction
        // with the page (still only once).
        (function() {
            let introChimePlayed = false;
            const introAudio = new AudioEngine();
            function tryPlayIntroChime() {
                if (introChimePlayed) return;
                introAudio.init();
                const fire = () => {
                    if (introChimePlayed) return;
                    introChimePlayed = true;
                    introAudio.playIntroChime();
                    setTimeout(() => { if (introAudio.ctx) introAudio.ctx.close(); }, 7500);
                };
                if (introAudio.ctx.state === 'suspended') {
                    introAudio.ctx.resume().then(() => { if (introAudio.ctx.state === 'running') fire(); });
                } else {
                    fire();
                }
            }
            tryPlayIntroChime();
            ['pointerdown', 'keydown', 'touchstart'].forEach(evt => {
                window.addEventListener(evt, tryPlayIntroChime, { once: true, passive: true });
            });
        })();

        function startGame() {
            const playerName = PLAYER_NAMES[Math.floor(Math.random() * PLAYER_NAMES.length)];
            document.getElementById('intro-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            phaserGame = new Phaser.Game({
                type: Phaser.AUTO,
                width: GAME_WIDTH,
                height: GAME_HEIGHT,
                parent: 'game-container',
                backgroundColor: '#1a1525',
                scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
                scene: [BootScene, GameScene],
            });
            phaserGame.registry.set('playerName', playerName);
            phaserGame.registry.set('meadowBgUrl',
                '/assets/images/blog/rabbit-meadow.jpg');
            phaserGame.registry.set('undergroundBgUrl',
                '/assets/images/blog/rabbit-hole.jpg');
        }

        function restartGame() {
            if (phaserGame) { phaserGame.destroy(true);
                phaserGame = null; }
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('intro-screen').style.display = 'flex';
        }
    </script>
</body>
</html>
