<script>

// ═══════════════════════════════════════════════════════════════
// CHIPTUNE AUDIO MANAGER (Web Audio API)
// ═══════════════════════════════════════════════════════════════
class ChiptuneAudio {
    constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.musicTimeout = null;
        this.isMusicPlaying = false;
        this.isEnabled = false;

        // ─────────────────────────────────────────
        // STEP SEQUENCER FORMAT
        // { f: frequency, d: duration multiplier, r: rest }
        // d: 1=8th, 2=quarter, 3=dotted quarter, 4=half
        // ─────────────────────────────────────────

        // Level 1 - A section (C major, light and bouncy)
        // Melody has syncopated entries, held notes, and deliberate rests
        this.melodyA = [
            { f: 523.25, d: 2 },              // C5 quarter
            { f: 0,      d: 1, r: true },     // rest 8th
            { f: 392.00, d: 1 },              // G4 8th
            { f: 440.00, d: 2 },              // A4 quarter
            { f: 493.88, d: 1 },              // B4 8th
            { f: 0,      d: 1, r: true },     // rest
            { f: 523.25, d: 4 },              // C5 held half
            { f: 0,      d: 2, r: true },     // rest quarter
            { f: 392.00, d: 1 },              // G4 8th
            { f: 329.63, d: 1 },              // E4 8th
            { f: 392.00, d: 2 },              // G4 quarter
            { f: 0,      d: 1, r: true },     // rest
            { f: 440.00, d: 1 },              // A4 8th
            { f: 392.00, d: 3 },              // G4 dotted
            { f: 0,      d: 1, r: true },     // rest
            { f: 329.63, d: 2 },              // E4 quarter
            { f: 293.66, d: 1 },              // D4 8th
            { f: 261.63, d: 4 },              // C4 held half
            { f: 0,      d: 2, r: true }      // rest
        ];

        // Level 1 - B section (C major, answer phrase — starts on E)
        this.melodyB = [
            { f: 329.63, d: 2 },              // E4 quarter
            { f: 392.00, d: 1 },              // G4 8th
            { f: 440.00, d: 1 },              // A4 8th
            { f: 0,      d: 2, r: true },     // rest quarter
            { f: 493.88, d: 2 },              // B4 quarter
            { f: 440.00, d: 1 },              // A4 8th
            { f: 392.00, d: 3 },              // G4 dotted
            { f: 0,      d: 1, r: true },     // rest
            { f: 349.23, d: 2 },              // F4 quarter
            { f: 329.63, d: 1 },              // E4 8th
            { f: 0,      d: 1, r: true },     // rest
            { f: 293.66, d: 3 },              // D4 dotted
            { f: 0,      d: 1, r: true },     // rest
            { f: 261.63, d: 1 },              // C4 8th
            { f: 329.63, d: 1 },              // E4 8th
            { f: 392.00, d: 2 },              // G4 quarter
            { f: 440.00, d: 1 },              // A4 8th
            { f: 523.25, d: 4 },              // C5 held half
            { f: 0,      d: 2, r: true }      // rest
        ];

        // Level 2 - A section (G major — brighter key, more movement)
        this.level2MelodyA = [
            { f: 783.99, d: 2 },              // G5 quarter
            { f: 0,      d: 1, r: true },     // rest
            { f: 659.25, d: 1 },              // E5 8th
            { f: 698.46, d: 2 },              // F#5 quarter
            { f: 0,      d: 2, r: true },     // rest quarter
            { f: 587.33, d: 1 },              // D5 8th
            { f: 659.25, d: 1 },              // E5 8th
            { f: 783.99, d: 3 },              // G5 dotted
            { f: 0,      d: 1, r: true },     // rest
            { f: 880.00, d: 2 },              // A5 quarter
            { f: 783.99, d: 1 },              // G5 8th
            { f: 698.46, d: 1 },              // F#5 8th
            { f: 0,      d: 1, r: true },     // rest
            { f: 659.25, d: 3 },              // E5 dotted
            { f: 587.33, d: 1 },              // D5 8th
            { f: 0,      d: 2, r: true },     // rest quarter
            { f: 493.88, d: 1 },              // B4 8th
            { f: 587.33, d: 1 },              // D5 8th
            { f: 659.25, d: 4 },              // E5 held half
            { f: 0,      d: 2, r: true }      // rest
        ];

        // Level 2 - B section (G major, climbing with wider leaps)
        this.level2MelodyB = [
            { f: 493.88, d: 1 },              // B4 8th
            { f: 587.33, d: 1 },              // D5 8th
            { f: 659.25, d: 2 },              // E5 quarter
            { f: 0,      d: 2, r: true },     // rest quarter
            { f: 783.99, d: 2 },              // G5 quarter
            { f: 698.46, d: 1 },              // F#5 8th
            { f: 0,      d: 1, r: true },     // rest
            { f: 659.25, d: 3 },              // E5 dotted
            { f: 0,      d: 1, r: true },     // rest
            { f: 587.33, d: 2 },              // D5 quarter
            { f: 523.25, d: 1 },              // C5 8th
            { f: 493.88, d: 1 },              // B4 8th
            { f: 0,      d: 2, r: true },     // rest quarter
            { f: 440.00, d: 2 },              // A4 quarter
            { f: 493.88, d: 1 },              // B4 8th
            { f: 587.33, d: 1 },              // D5 8th
            { f: 659.25, d: 2 },              // E5 quarter
            { f: 783.99, d: 4 },              // G5 held half
            { f: 0,      d: 2, r: true }      // rest
        ];

        // ─────────────────────────────────────────
        // BASS LINES — 16-step 8th-note grid, 0 = rest
        // ─────────────────────────────────────────

        // Level 1 C major bass (roots + fifths)
        this.bassA = [
            130.81, 0,      0,      130.81,
            164.81, 0,      164.81, 0,
            146.83, 0,      0,      146.83,
            196.00, 0,      130.81, 0
        ];
        this.bassB = [
            164.81, 0,      164.81, 0,
            174.61, 0,      0,      174.61,
            146.83, 0,      146.83, 0,
            261.63, 0,      196.00, 0
        ];

        // Level 2 G major bass
        this.bass2A = [
            196.00, 0,      0,      196.00,
            246.94, 0,      246.94, 0,
            220.00, 0,      0,      220.00,
            293.66, 0,      196.00, 0
        ];
        this.bass2B = [
            246.94, 0,      246.94, 0,
            196.00, 0,      0,      196.00,
            174.61, 0,      174.61, 0,
            220.00, 0,      293.66, 0
        ];

        // ─────────────────────────────────────────
        // LEVEL COMPLETE JINGLES
        // ─────────────────────────────────────────

        // Jingle 1 — C major ascending fanfare
        this.jingle1 = [
            { f: 392.00,  d: 1 },
            { f: 523.25,  d: 1 },
            { f: 659.25,  d: 1 },
            { f: 783.99,  d: 2 },
            { f: 0,       d: 1, r: true },
            { f: 659.25,  d: 1 },
            { f: 783.99,  d: 1 },
            { f: 1046.50, d: 4 }
        ];

        // Jingle 2 — G major brighter fanfare
        this.jingle2 = [
            { f: 493.88,  d: 1 },
            { f: 587.33,  d: 1 },
            { f: 783.99,  d: 1 },
            { f: 880.00,  d: 2 },
            { f: 0,       d: 1, r: true },
            { f: 783.99,  d: 1 },
            { f: 880.00,  d: 1 },
            { f: 1174.66, d: 4 }
        ];

        // ─────────────────────────────────────────
        // STATE
        // ─────────────────────────────────────────
        this.currentSection = 'A';
        this.loopStep = 0;
        this.currentLevel = 1;
        this.stepIndex = 0;
        this.bassIndex = 0;
        this.activeMelody = this.melodyA;
        this.activeBass   = this.bassA;

        this.bpm = 126;
        this._tickMs = this._calcTick();
    }

    _calcTick() {
        return (60 / this.bpm) * 0.5 * 1000;
    }

    init() {
        if (this.ctx) return;
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = 0.22;
            this.masterGain.connect(this.ctx.destination);
            this.isEnabled = true;
        } catch(e) {
            console.warn("Web Audio not supported");
            this.isEnabled = false;
        }
    }

    startMusic() {
        if (!this.isEnabled || !this.ctx) return;
        if (this.isMusicPlaying) return;
        if (this.ctx.state === 'suspended') {
            this.ctx.resume()
                .then(() => this._startLoop())
                .catch(e => console.warn("audio resume failed", e));
        } else {
            this._startLoop();
        }
    }

    _startLoop() {
        this.isMusicPlaying = true;
        this.stepIndex = 0;
        this.bassIndex = 0;
        this._scheduleNext();
    }

    _scheduleNext() {
        if (!this.isMusicPlaying) return;
        const step = this.activeMelody[this.stepIndex % this.activeMelody.length];
        const durMs = step.d * this._tickMs;

        this._playStep(step, durMs);

        this.stepIndex++;
        this.bassIndex++;

        // Section advance every 16 bass ticks
        if (this.bassIndex % 16 === 0) {
            this._advanceSongStructure();
        }

        this.musicTimeout = setTimeout(() => this._scheduleNext(), durMs);
    }

    _playStep(step, durMs) {
        if (!this.ctx) return;

        const bassIdx = this.bassIndex % this.activeBass.length;
        const bassFreq = this.activeBass[bassIdx];

        // Main melody — quiet, sits in background
        if (!step.r && step.f > 0) {
            this._playOsc(step.f, 'square',   0.09, durMs * 0.78);
            this._playOsc(step.f, 'sawtooth', 0.04, durMs * 0.72, 7);
        }

        // Bass — triangle, warmer and more present
        if (bassFreq > 0) {
            this._playOsc(bassFreq, 'triangle', 0.20, this._tickMs * 0.80, 0, 0.004);
        }

        // Hi-hat only — no kick
        const beat = this.bassIndex % 4;
        if (beat === 1 || beat === 3) this._playNoise(30, 0.035);
    }

    _playOsc(freq, type, gainVal, durMs, detune = 0, attack = 0.005) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g   = this.ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        if (detune) osc.detune.value = detune;
        g.gain.setValueAtTime(0, now);
        g.gain.linearRampToValueAtTime(gainVal, now + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, now + Math.max(durMs * 0.001, 0.01));
        osc.connect(g);
        g.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + Math.max(durMs * 0.001, 0.01) + 0.02);
    }

    _playNoise(durMs, gainVal = 0.035) {
        if (!this.ctx) return;
        const buf    = this.ctx.createBuffer(1, Math.ceil(this.ctx.sampleRate * 0.04), this.ctx.sampleRate);
        const data   = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        const src    = this.ctx.createBufferSource();
        const filter = this.ctx.createBiquadFilter();
        filter.type  = 'highpass';
        filter.frequency.value = 5000;
        const g = this.ctx.createGain();
        src.buffer = buf;
        const now = this.ctx.currentTime;
        g.gain.setValueAtTime(gainVal, now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + durMs * 0.001);
        src.connect(filter); filter.connect(g); g.connect(this.masterGain);
        src.start(now); src.stop(now + durMs * 0.001 + 0.01);
    }

    _advanceSongStructure() {
        this.loopStep++;
        const pattern = ['A', 'A', 'B', 'A'];
        this.currentSection = pattern[this.loopStep % pattern.length];
        this.stepIndex = 0;

        if (this.currentLevel === 2) {
            this.activeMelody = this.currentSection === 'A' ? this.level2MelodyA : this.level2MelodyB;
            this.activeBass   = this.currentSection === 'A' ? this.bass2A        : this.bass2B;
        } else {
            this.activeMelody = this.currentSection === 'A' ? this.melodyA : this.melodyB;
            this.activeBass   = this.currentSection === 'A' ? this.bassA   : this.bassB;
        }
    }

    setLevel(level) {
        this.currentLevel = level;
        this.stepIndex    = 0;
        this.bassIndex    = 0;
        this.loopStep     = 0;
        this.currentSection = 'A';

        if (level === 2) {
            this.activeMelody = this.level2MelodyA;
            this.activeBass   = this.bass2A;
        } else {
            this.activeMelody = this.melodyA;
            this.activeBass   = this.bassA;
        }
    }

    // ─────────────────────────────────────────
    // LEVEL COMPLETE JINGLE
    // Stops background music, plays fanfare, then calls onFinished
    // ─────────────────────────────────────────
    playLevelComplete(level, onFinished) {
        if (!this.isEnabled || !this.ctx) {
            if (onFinished) onFinished();
            return;
        }

        // Resume context if suspended (needed after user interaction gap)
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }

        // Stop background loop first
        this.stopMusic();

        const jingle = (level === 2) ? this.jingle2 : this.jingle1;
        const tick   = this._calcTick();

        // Capture ctx reference so closures stay valid
        const ctx         = this.ctx;
        const masterGain  = this.masterGain;

        // Helper scoped to captured references
        const playJingleOsc = (freq, type, gainVal, durMs, detune, attack) => {
            if (!ctx) return;
            detune = detune || 0;
            attack = attack || 0.005;
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const g   = ctx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            if (detune) osc.detune.value = detune;
            g.gain.setValueAtTime(0, now);
            g.gain.linearRampToValueAtTime(gainVal, now + attack);
            g.gain.exponentialRampToValueAtTime(0.0001, now + Math.max(durMs * 0.001, 0.01));
            osc.connect(g);
            g.connect(masterGain);
            osc.start(now);
            osc.stop(now + Math.max(durMs * 0.001, 0.01) + 0.05);
        };

        let delay = 0;
        jingle.forEach((step) => {
            const durMs = step.d * tick;
            if (!step.r && step.f > 0) {
                // Capture durMs in closure via IIFE
                (function(d) {
                    setTimeout(() => {
                        playJingleOsc(d.f,        'square',   0.22, durMs * 0.88);
                        playJingleOsc(d.f * 0.5,  'triangle', 0.16, durMs * 0.92, 0, 0.003);
                        playJingleOsc(d.f * 1.5,  'sawtooth', 0.05, durMs * 0.70, 5);
                    }, delay);
                })(step);
            }
            delay += durMs;
        });

        if (onFinished) {
            setTimeout(onFinished, delay + 150);
        }
    }

    playDialogueBeep() {
        if (!this.isEnabled || !this.ctx) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();
        this._playOsc(880,  'square', 0.15, 80);
        this._playOsc(1760, 'sine',   0.05, 60);
    }

    stopMusic() {
        if (this.musicTimeout) {
            clearTimeout(this.musicTimeout);
            this.musicTimeout = null;
        }
        this.isMusicPlaying = false;
    }
}

window.gameAudio = null;
// ═══════════════════════════════════════════════════════════════
// END AUDIO

// ── Headshot Portrait Factory ─────────────────────────────────
function ensureHeadshots(scene) {
 const S = 60;

 // Shared helper — draws a simple clean face on a coloured bg
 // hairCol2 = optional second hair colour for a single highlight stripe
 function drawFace(g, bgCol, skinCol, hairCol, shirtCol, opts = {}) {
 const {
 hairStyle = 'flat', // 'flat' | 'spiky' | 'long' | 'slick' | 'wave'
 hairCol2 = null,
 glasses = false,
 moustache = false,
 goatee = false,
 beard = false,
 earrings = false,
 lashes = false,
 lips = false, // pink lips for Perera
 tie = false,
 lanyard = false,
 smirk = false,
 } = opts;

 // BG
 g.fillStyle(bgCol); g.fillRoundedRect(0, 0, S, S, 8);

 // Shirt / shoulders
 g.fillStyle(shirtCol); g.fillRect(4, 44, 52, 18);

 // Neck
 g.fillStyle(skinCol); g.fillRect(22, 40, 16, 8);

 // Head — clean rectangle, centred
 g.fillStyle(skinCol); g.fillRect(13, 14, 34, 28);

 // ── Hair ──
 g.fillStyle(hairCol);
 if (hairStyle === 'flat') {
 // Simple flat cap on top, small side bits
 g.fillRect(13, 14, 34, 7);
 g.fillRect(13, 14, 4, 16);
 g.fillRect(43, 14, 4, 12);
 } else if (hairStyle === 'spiky') {
 g.fillRect(13, 14, 34, 7);
 g.fillRect(13, 14, 4, 18);
 g.fillRect(43, 14, 4, 14);
 // 3 spikes
 g.fillRect(15, 8, 6, 8);
 g.fillRect(24, 6, 8, 9);
 g.fillRect(36, 9, 6, 7);
 } else if (hairStyle === 'long') {
 // Long hair: flows down sides past shoulders
 g.fillRect(13, 14, 34, 7);
 g.fillRect(5, 14, 10, 34); // left flow
 g.fillRect(45, 14, 10, 30); // right flow
 if (hairCol2) {
 g.fillStyle(hairCol2);
 g.fillRect(7, 18, 3, 28); // highlight strand
 }
 } else if (hairStyle === 'slick') {
 // Slicked back — flat top, tight sides
 g.fillRect(13, 14, 34, 6);
 g.fillRect(13, 14, 3, 22);
 g.fillRect(44, 14, 3, 18);
 } else if (hairStyle === 'wave') {
 // Wavy — base + 3 bumps on top
 g.fillRect(10, 14, 40, 8);
 g.fillRect(10, 14, 5, 22);
 g.fillRect(45, 14, 5, 18);
 g.fillRect(14, 8, 8, 8);
 g.fillRect(26, 6, 8, 9);
 g.fillRect(38, 8, 7, 8);
 }

 // Sandy hairline stripe for McCready style (optional, via hairCol2 on flat)
 if (hairStyle === 'flat' && hairCol2) {
 g.fillStyle(hairCol2); g.fillRect(16, 18, 20, 2);
 }

 // ── Extras over hair ──
 if (earrings) {
 g.fillStyle(0xf9ca24);
 g.fillCircle(11, 30, 3); g.fillCircle(49, 30, 3);
 }

 // ── Eyes ──
 g.fillStyle(0x1a1a1a);
 if (lashes) {
 // Lash bar first
 g.fillRect(16, 28, 10, 2); g.fillRect(34, 28, 10, 2);
 }
 // Eye whites
 g.fillStyle(0xffffff); g.fillRect(16, 30, 10, 6); g.fillRect(34, 30, 10, 6);
 // Pupils
 g.fillStyle(0x1a1a1a); g.fillRect(18, 31, 5, 4); g.fillRect(36, 31, 5, 4);
 // Shine dot
 g.fillStyle(0xffffff); g.fillRect(19, 31, 2, 1); g.fillRect(37, 31, 2, 1);

 // ── Glasses (Zainuddin) ──
 if (glasses) {
 g.lineStyle(2, 0x3a2800);
 g.strokeRect(14, 28, 13, 10);
 g.strokeRect(33, 28, 13, 10);
 g.fillStyle(0x3a2800); g.fillRect(27, 32, 6, 2); // bridge
 g.fillRect(10, 31, 4, 2); g.fillRect(46, 31, 4, 2); // arms
 }

 // ── Nose — single small dot ──
 g.fillStyle(skinCol === 0xf9a825 || skinCol === 0xffd54f || skinCol === 0xffd180
 ? 0xb87820 : 0xc07050);
 g.fillRect(27, 36, 6, 3);

 // ── Mouth ──
 if (lips) {
 g.fillStyle(0xd44060); g.fillRect(19, 40, 22, 4);
 g.fillStyle(0xffc0cb, 0.4); g.fillRect(20, 40, 20, 2);
 } else if (smirk) {
 g.fillStyle(0xbf7057); g.fillRect(19, 40, 18, 2); g.fillRect(34, 39, 4, 2);
 } else {
 g.fillStyle(0xbf7057); g.fillRect(19, 40, 22, 2);
 }

 // ── Moustache (Shujahat) ──
 if (moustache) {
 g.fillStyle(0x2a0e00);
 g.fillRect(18, 38, 10, 3); g.fillRect(32, 38, 10, 3);
 }

 // ── Goatee (Jamjoom) ──
 if (goatee) {
 g.fillStyle(0x2a1000);
 g.fillRect(21, 42, 18, 4);
 g.fillRect(24, 46, 12, 3);
 }

 // ── Short beard (Zainuddin) ──
 if (beard) {
 g.fillStyle(0x2a1400);
 g.fillRect(16, 40, 28, 4);
 g.fillRect(19, 44, 22, 2);
 }

 // ── Tie (Shujahat) ──
 if (tie) {
 g.fillStyle(0xf9ca24);
 g.fillRect(27, 44, 6, 16);
 }

 // ── Lanyard (Alabdulakareem) ──
 if (lanyard) {
 g.fillStyle(0xf9ca24);
 g.fillRect(26, 44, 2, 14); g.fillRect(32, 44, 2, 14);
 g.fillStyle(0xffffff); g.fillRect(25, 54, 10, 7);
 g.fillStyle(0x0d47a1); g.fillRect(26, 55, 8, 2);
 }

 // Frame
 g.lineStyle(2, 0xffffff, 0.15); g.strokeRoundedRect(1, 1, S-2, S-2, 7);
 }

 // ── Sheeshkabob ─────────────────────────────
 if (!scene.textures.exists('head_player')) {
 const g = scene.make.graphics({ add: false });
 drawFace(g, 0x1565c0, 0xffe0b2, 0x4e342e, 0x1565c0, { hairStyle: 'flat' });
 g.generateTexture('head_player', S, S); g.destroy();
 }

 // ── Dr. McCready ─────────────────────────────
 // Sandy hair: flat top cap, NO big side locks — just a thin trim
 if (!scene.textures.exists('head_mccready')) {
 const g = scene.make.graphics({ add: false });
 // BG + shirt
 g.fillStyle(0x263238); g.fillRoundedRect(0, 0, S, S, 8);
 g.fillStyle(0x1c1c1c); g.fillRect(4, 44, 52, 18);
 // V-neck skin peek
 g.fillStyle(0xf2d6c9); g.fillTriangle(22, 44, 38, 44, 30, 52);
 // Neck
 g.fillStyle(0xf2d6c9); g.fillRect(22, 40, 16, 8);
 // Head
 g.fillStyle(0xf2d6c9); g.fillRect(13, 14, 34, 28);
 // Hair — sandy flat cap only, NO side chunks
 g.fillStyle(0xb89b7a); g.fillRect(13, 14, 34, 7);
 // Eyes
 g.fillStyle(0xffffff); g.fillRect(16, 30, 10, 6); g.fillRect(34, 30, 10, 6);
 g.fillStyle(0x2a2a2a); g.fillRect(18, 31, 5, 4); g.fillRect(36, 31, 5, 4);
 g.fillStyle(0xffffff); g.fillRect(19, 31, 2, 1); g.fillRect(37, 31, 2, 1);
 // Nose
 g.fillStyle(0xe0b9a8); g.fillRect(27, 36, 6, 3);
 // Subtle smile
 g.fillStyle(0xd79a8a); g.fillRect(19, 40, 22, 2);
 g.lineStyle(2, 0xffffff, 0.15); g.strokeRoundedRect(1, 1, S-2, S-2, 7);
 g.generateTexture('head_mccready', S, S); g.destroy();
 }

 // ── Zainuddin ─────────────────────── glasses + beard
 if (!scene.textures.exists('head_zainuddin')) {
 const g = scene.make.graphics({ add: false });
 drawFace(g, 0xb71c1c, 0xf9a825, 0x1a0a00, 0xc62828,
 { hairStyle: 'flat', glasses: true, beard: true });
 g.generateTexture('head_zainuddin', S, S); g.destroy();
 }

 // ── Chu ───────────────────────── spiky hair + smirk
 if (!scene.textures.exists('head_chu')) {
 const g = scene.make.graphics({ add: false });
 drawFace(g, 0x1b5e20, 0xffe0b2, 0x1a1008, 0x2e7d32,
 { hairStyle: 'spiky', smirk: true });
 g.generateTexture('head_chu', S, S); g.destroy();
 }

 // ── Shujahat ──────────────────────── slick hair + moustache + tie
 if (!scene.textures.exists('head_shujahat')) {
 const g = scene.make.graphics({ add: false });
 drawFace(g, 0x4a148c, 0xffd54f, 0x1c0a00, 0x6a1b9a,
 { hairStyle: 'slick', moustache: true, tie: true });
 g.generateTexture('head_shujahat', S, S); g.destroy();
 }

 // ── Perera (female) ───────────── long hair + earrings + pink lips + lashes
 if (!scene.textures.exists('head_perera')) {
 const g = scene.make.graphics({ add: false });
 drawFace(g, 0xbf360c, 0xffe0b2, 0x1a0808, 0xe65100,
 { hairStyle: 'long', hairCol2: 0x3d1010, earrings: true, lashes: true, lips: true });
 g.generateTexture('head_perera', S, S); g.destroy();
 }

 // ── Alabdulakareem ────────────── flat hair + lanyard
 if (!scene.textures.exists('head_alabd')) {
 const g = scene.make.graphics({ add: false });
 drawFace(g, 0x0a2fa6, 0xffe0b2, 0x1a1218, 0x0d47a1,
 { hairStyle: 'flat', lanyard: true });
 g.generateTexture('head_alabd', S, S); g.destroy();
 }

 // ── Jamjoom ───────────────────── wavy hair + goatee
 if (!scene.textures.exists('head_jamjoom')) {
 const g = scene.make.graphics({ add: false });
 drawFace(g, 0x004d40, 0xffd180, 0x3d2008, 0x00695c,
 { hairStyle: 'wave', goatee: true });
 g.generateTexture('head_jamjoom', S, S); g.destroy();
 }

 // ── Jamjoom, Mona (female) ─── long dark hair + earrings + lips + lashes
 if (!scene.textures.exists('head_jamjoom_f')) {
 const g = scene.make.graphics({ add: false });
 drawFace(g, 0x004d40, 0xffd180, 0x1a0808, 0x00695c,
 { hairStyle: 'long', hairCol2: 0x2a1010, earrings: true, lashes: true, lips: true });
 g.generateTexture('head_jamjoom_f', S, S); g.destroy();
 }
}

 };

 }

 _drawSilhouettes() {

 for (let i = 0; i < 5; i++) {

 g.fillRect(W - 175 + i * 30, H * 0.45, 12, H * 0.3);
 }

 }).setOrigin(0.5);

// ═══════════════════════════════════════════════════════════════
// BASE LEVEL
// ═══════════════════════════════════════════════════════════════
class BaseLevel extends Phaser.Scene {

 _initLevel(npcs) {
 this._npcs = npcs;
 this._collected = new Set();
 this._dialogActive = false;
 this._dlgData = null;
 this._dlgPage = 0;
 this._completeTriggered = false;
 this._exclaims = {};
 }

 _spawnPlayer(x, y) {
 this.player = this.physics.add.sprite(x, y, 'player');
 this.player.setCollideWorldBounds(true);
 this.player.setDepth(20);
 this.cursors = this.input.keyboard.createCursorKeys();
 this._wasd = this.input.keyboard.addKeys({ up: 'W', down: 'S', left: 'A', right: 'D' });
 }

 _spawnNPCs() {
 this._npcs.forEach(npc => {
 npc.sprite = this.physics.add.staticSprite(npc.x, npc.y, npc.tex).setScale(1.5).setDepth(15);
 this.add.text(npc.x, npc.y + 36, npc.label, {
 fontSize: '9px', fontFamily: '"Courier New", monospace',
 color: '#f9ca24', stroke: '#000', strokeThickness: 3
 }).setOrigin(0.5).setDepth(16);
 });
 }

 _buildDialogBox() {
 const bh = 172;
 const PS = 84;
 const PW = PS + 16;
 const TX = PW + 10;

 this._dlgGroup = this.add.container(0, H - bh).setDepth(80).setVisible(false);

 const bg = this.add.graphics();
 bg.fillStyle(0x03030c, 0.99); bg.fillRect(0, 0, W, bh);
 bg.lineStyle(3, 0x74b9ff); bg.strokeRect(1, 1, W - 2, bh - 2);
 bg.lineStyle(1, 0x1a1a4a); bg.strokeRect(5, 5, W - 10, bh - 10);

 bg.lineStyle(1, 0x2a4a7a, 0.8);
 bg.lineBetween(PW + 2, 8, PW + 2, bh - 8);

 const px = 8, py = (bh - PS) / 2;
 bg.fillStyle(0x0d1526, 0.9);
 bg.fillRoundedRect(px - 2, py - 2, PS + 4, PS + 4, 6);

 this._dlgPortrait = this.add.image(px + PS / 2, bh / 2, 'head_mccready');
 this._dlgPortrait.setDisplaySize(PS, PS);

 // Name — Courier kept for character identity
 this._dlgName = this.add.text(TX, 10, '', {
   fontSize: '14px', fontFamily: '"Courier New", monospace',
   color: '#f9ca24', fontStyle: 'bold', stroke: '#000', strokeThickness: 2
 });

 this._dlgNameLine = this.add.graphics();
 this._dlgNameLine.lineStyle(1, 0x2a4a7a, 0.7);
 this._dlgNameLine.lineBetween(TX, 30, W - 10, 30);

 // Body — Nunito: clean, anti-aliased, readable
 this._dlgBody = this.add.text(TX, 37, '', {
   fontSize: '14px', fontFamily: 'Nunito, Arial, sans-serif',
   color: '#ffffff', wordWrap: { width: W - TX - 18 }, lineSpacing: 5
 });

 this._dlgHint = this.add.text(W - 12, bh - 9, 'SPACEBAR to continue', {
   fontSize: '11px', fontFamily: 'Nunito, Arial, sans-serif', color: '#5a8abf'
 }).setOrigin(1, 1);

 this._dlgGroup.add([bg, this._dlgPortrait, this._dlgNameLine, this._dlgName, this._dlgBody, this._dlgHint]);
 this.input.keyboard.on('keydown-SPACE', () => { if (this._dialogActive) this._advanceDlg(); });
 this.input.keyboard.on('keydown-ENTER', () => { if (this._dialogActive) this._advanceDlg(); });
 }

 _openDialog(npc) {
   // ADDED: prevent any dialog from opening once level completion is triggered
   if (this._completeTriggered) return;
   if (this._dialogActive) return;
   // ADDED: play dialogue beep sound when starting conversation
   if (window.gameAudio) window.gameAudio.playDialogueBeep();
   this._dlgData = npc;
   this._dlgPage = 0;
   this._dialogActive = true;
   this._dlgGroup.setVisible(true);
   this._renderDlgPage();
 }

 _getPortraitKey(npc, pageText) {
 // Detect back-and-forth speaker from text prefix
 if (pageText.startsWith('Sheeshkabob:')) return 'head_player';
 if (pageText.startsWith('Dr. McCready:')) return 'head_mccready';
 // Map NPC id → headshot key
 const map = {
 'mc_intro': 'head_mccready',
 'mc_lib': 'head_mccready',
 'zainuddin': 'head_zainuddin',
 'chu': 'head_chu',
 'shujahat': 'head_shujahat',
 'perera': 'head_perera',
 'alabd_methods': 'head_alabd',
 'alabd_critique': 'head_alabd',
 'jamjoom_findings':'head_jamjoom',
 'jamjoom_design': 'head_jamjoom',
 'alabd': 'head_alabd',
 'jamjoom_f': 'head_jamjoom_f',
 };
 return map[npc.id] || 'head_mccready';
 }

 _renderDlgPage() {
 const d = this._dlgData;
 const pageText = d.pages[this._dlgPage];

 // Detect speaker for back-and-forth dialogue
 let displayName = d.name;
 if (pageText.startsWith('Sheeshkabob:')) displayName = ' Sheeshkabob';
 else if (pageText.startsWith('Dr. McCready:')) displayName = ' Dr. McCready';

 this._dlgName.setText(displayName);
 this._dlgBody.setText(pageText);

 // Swap portrait to match current speaker
 const portraitKey = this._getPortraitKey(d, pageText);
 if (this._dlgPortrait.texture.key !== portraitKey) {
 this._dlgPortrait.setTexture(portraitKey);
 }

 const last = this._dlgPage >= d.pages.length - 1;
 this._dlgHint.setText(last ? '[ SPACE / ENTER ] close ' : '[ SPACE / ENTER ] next ▶');
 }

 _advanceDlg() {
 const d = this._dlgData;
 if (this._dlgPage < d.pages.length - 1) {
 this._dlgPage++;
 this._renderDlgPage();
 } else {
 this._dialogActive = false;
 this._dlgGroup.setVisible(false);
 if (d.required !== false && !this._collected.has(d.id)) {
 this._collected.add(d.id);
 d.sprite.setTint(0x888888);
 this._sparkle(d.sprite.x, d.sprite.y);
 this._updateHUD();
 this._checkComplete();
 }
 if (this._onDialogClosed) this._onDialogClosed(d);
 }
 }

 _sparkle(x, y) {
 const symbols = ['', '', '', '', ''];
 for (let i = 0; i < 5; i++) {
 const sx = x + Phaser.Math.Between(-30, 30);
 const t = this.add.text(sx, y - 10, symbols[i % symbols.length], {
 fontSize: '16px', color: '#f9ca24'
 }).setDepth(90);
 this.tweens.add({
 targets: t, y: t.y - 50, alpha: 0, duration: 900,
 delay: i * 80, onComplete: () => t.destroy()
 });
 }
 }

 _buildHUD(levelLabel) {
 this._hudBg = this.add.graphics().setDepth(79);
 this._hudText = this.add.text(10, 8, '', {
 fontSize: '12px', fontFamily: '"Courier New", monospace',
 color: '#f9ca24', stroke: '#000', strokeThickness: 2
 }).setDepth(80);
 this.add.text(W - 10, 8, levelLabel, {
 fontSize: '10px', fontFamily: '"Courier New", monospace',
 color: '#74b9ff', stroke: '#000', strokeThickness: 2
 }).setOrigin(1, 0).setDepth(80);
 this._updateHUD();
 }

 _updateHUD() {
 const req = this._npcs.filter(n => n.required !== false);
 const done = req.filter(n => this._collected.has(n.id)).length;
 this._hudText.setText(` Insights: ${done} / ${req.length}`);
 }

 _checkComplete() {
 if (this._completeTriggered) return;
 const req = this._npcs.filter(n => n.required !== false);
 if (req.every(n => this._collected.has(n.id))) {
 this._completeTriggered = true;
 this.time.delayedCall(600, () => this._onComplete());
 }
 }

 _onComplete() { /* override */ }

 _setupOverlap() {
 this._npcs.forEach(npc => {
 this.physics.add.overlap(this.player, npc.sprite, () => {
   // ADDED: also prevent overlap dialog if level completion is already triggered
   if (!this._dialogActive && !this._collected.has(npc.id) && this._shouldAllowDialog?.(npc) !== false && !this._completeTriggered) {
     this._openDialog(npc);
   }
 });
 });
 }

 update() {
 if (this._dialogActive) { this.player.setVelocity(0, 0); return; }
 const c = this.cursors, w = this._wasd;
 let vx = 0, vy = 0;
 if (c.left.isDown || w.left.isDown) vx = -SPEED;
 else if (c.right.isDown || w.right.isDown) vx = SPEED;
 if (c.up.isDown || w.up.isDown) vy = -SPEED;
 else if (c.down.isDown || w.down.isDown) vy = SPEED;
 this.player.setVelocity(vx, vy);
 if (vx < 0) this.player.setFlipX(true);
 else if (vx > 0) this.player.setFlipX(false);
 }

 _showLevelComplete(title, summary, nextScene, promptOverride) {
  const pw = 540, ph = 320;
  const px = W / 2 - pw / 2, py = H / 2 - ph / 2;

  // Dim overlay
  const ov = this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0).setDepth(200);
  this.tweens.add({ targets: ov, fillAlpha: 0.85, duration: 400 });

  // Panel
  const panel = this.add.graphics().setDepth(201);
  panel.fillStyle(0x06060f, 0.98);
  panel.fillRoundedRect(px, py, pw, ph, 14);
  panel.lineStyle(3, 0xf9ca24);
  panel.strokeRoundedRect(px, py, pw, ph, 14);
  panel.lineStyle(1, 0x2a2a5a);
  panel.strokeRoundedRect(px + 5, py + 5, pw - 10, ph - 10, 11);

  // "— LEVEL COMPLETE —" small label at top
  this.add.text(W / 2, py + 26, '— LEVEL COMPLETE —', {
    fontSize: '10px', fontFamily: '"Courier New", monospace',
    color: '#74b9ff', letterSpacing: 3
  }).setOrigin(0.5).setDepth(202);

  // Title — smaller so it stays in its lane
  this.add.text(W / 2, py + 60, title, {
    fontSize: '22px', fontFamily: '"Courier New", monospace',
    color: '#f9ca24', stroke: '#000', strokeThickness: 4
  }).setOrigin(0.5).setDepth(202);

  // Divider under title
  const dl = this.add.graphics().setDepth(202);
  dl.lineStyle(1, 0x2a4a7a, 0.8);
  dl.lineBetween(px + 30, py + 88, px + pw - 30, py + 88);

  // Summary text — sits in the middle zone with full room
  this.add.text(W / 2, py + 88 + 8, summary, {
    fontSize: '14px', fontFamily: 'Nunito, Arial, sans-serif',
    color: '#ffffff', align: 'center',
    lineSpacing: 6, wordWrap: { width: pw - 60 }
  }).setOrigin(0.5, 0).setDepth(202);

  // Divider above prompt
  const dl2 = this.add.graphics().setDepth(202);
  dl2.lineStyle(1, 0x2a4a7a, 0.8);
  dl2.lineBetween(px + 30, py + ph - 48, px + pw - 30, py + ph - 48);

  // Blinking prompt pinned to bottom
  const promptText = promptOverride || '  PRESS SPACEBAR TO CONTINUE TO LEVEL 2  ';
  const prompt = this.add.text(W / 2, py + ph - 26, promptText, {
    fontSize: '13px', fontFamily: 'Nunito, Arial, sans-serif',
    color: '#f9ca24', fontStyle: 'bold'
  }).setOrigin(0.5).setDepth(202);
  this.tweens.add({ targets: prompt, alpha: 0.15, duration: 560, yoyo: true, repeat: -1 });

  this.input.keyboard.once('keydown-ENTER', () => {
    this.cameras.main.fade(500, 0, 0, 0, false, (c, p) => { if (p === 1) this.scene.start(nextScene); });
  });
  this.input.keyboard.once('keydown-SPACE', () => {
    this.cameras.main.fade(500, 0, 0, 0, false, (c, p) => { if (p === 1) this.scene.start(nextScene); });
  });
 }
}

// ═══════════════════════════════════════════════════════════════
// LEVEL 1: UBC SCARFE FOYER — SEQUENTIAL LEARNING PATH
// Order: McCready intro → Zainuddin → Chu → Shujahat → Perera → McCready final
// ═══════════════════════════════════════════════════════════════
class ArcadeScene extends BaseLevel {
 constructor() { super('ArcadeScene'); }

 create() {
 ensureTextures(this);
 ensureHeadshots(this);
 // Set audio to Level 1 music (active melody A/B pattern)
 if (window.gameAudio) window.gameAudio.setLevel(1);
 this._walkDir = 1;

 const npcs = [
 // Dr. McCready — at reception desk
 {
 id: 'mc_intro', required: false,
 name: ' Dr. McCready',
 label: 'Dr.McCready',
 tex: 'mccready', x: 400, y: 144,
 pages: []
 },
 // Zainuddin — at computer station (left side)
 {
 id: 'zainuddin', required: true,
 name: ' Zainuddin — Summary',
 label: 'Dr. Zainuddin',
 tex: 'npc_zainuddin', x: 148, y: 265,
 pages: [
 "Our research synthesizes studies of gamification in education published in the Web of Science database from 2016–2019. \n\n\ We identified three core positive outcomes: enhanced motivation and engagement, improved academic achievement, and stronger social connection.",
"Self-Determination Theory (SDT) was the underlying framework for most studies, linking game elements to learners’ needs for competence, autonomy, and relatedness. \n\n\ However, contradictory findings emerged: poorly designed gamification can be ineffective, with students chasing rewards rather than meaningfully engaging with content."
 ]
 },
 // Chu — beside bookshelf (right side)
 {
 id: 'chu', required: true,
 name: ' Chu — Research Methods',
 label: 'Dr. Chu',
 tex: 'npc_chu', x: 643, y: 210,
 pages: [
 "We used rigorous thematic and content analysis across all 46 studies, evaluating methodological approaches, theoretical frameworks, game mechanics, participant demographics, and learning outcomes across diverse cultural contexts.",
"Our research was a qualitative‑dominant mixed methods review, interpretive and thematic, incorporating descriptive statistics to identify trends across the literature.",
"Methodological strengths include multi‑researcher validation and clear inclusion criteria.\n\n\ A key limitation: we restricted final inclusion to articles indexed in only one database, which may have excluded relevant studies published elsewhere."
 ]
 },
 // Shujahat — walking back and forth (centre foyer)
 {
 id: 'shujahat', required: true,
 name: ' Shujahat — Key Findings',
 label: 'Dr. Shujahat',
 tex: 'npc_shujahat', x: 300, y: 370,
 isWalker: true, walkLeft: 200, walkRight: 530,
 pages: [
 "While points, badges, and leaderboards (PBLs) were the most common game mechanics, leaderboards were rated the most engaging.",
"That said, findings aren’t all positive. Some studies found gamification ineffective or counterproductive due to technical issues, poor instructional design, or external rewards undermining engagement.",
"When poorly designed, extrinsic incentives can undermine intrinsic motivation, shifting focus from learning to reward‑chasing.\n\n\ Game mechanics must align with genuine learning objectives, not just surface‑level engagement."
 ]
 },
 // Perera — near bulletin board (right side lower)
 {
 id: 'perera', required: true,
 name: ' Perera — Critical Evaluation',
 label: 'Dr. Perera',
 tex: 'npc_perera', x: 628, y: 438,
 pages: [
 "While our review included multi‑researcher validation and clear inclusion criteria, it flags theoretical gaps like an overreliance on Self‑Determination Theory and the lack of gamification design frameworks.",
"Other limitations: most studies were short‑term and lacked effect size analysis.\n\n\ One strength was its emphasis on low‑tech gamification, making findings applicable beyond high‑tech contexts."
 ]
 }
 ];

 this._initLevel(npcs);
 this._buildScarfeFoyer();
 this._spawnNPCs(); // overridden below to handle walker
 this._spawnPlayer(400, 470);
 this._buildDialogBox();
 this._setupOverlap();

 // ── Sequential logic ──────────────────────────────────────
 this._step = 0;
 this._activeNpcId = 'mc_intro';
 this._mcNpc = npcs.find(n => n.id === 'mc_intro');

 this._mcFinalPages = [
 "Dr. McCready: Good work, Sheeshkabob! On to Level 2!"
 ];

 this._currentExclaim = null;
 this._updateExclamation();
 this._buildHUD('LEVEL 1: SCARFE FOYER');
 this.cameras.main.fadeIn(600);
 }

 // ── Override _spawnNPCs to support the walking NPC ──────────
 _spawnNPCs() {
 this._npcs.forEach(npc => {
 if (npc.isWalker) {
 // Dynamic sprite so it can actually move
 npc.sprite = this.physics.add.sprite(npc.x, npc.y, npc.tex)
 .setScale(1.5).setDepth(15);
 npc.sprite.setImmovable(true);
 // Dark pill background behind label for readability
 npc._nameBg = this.add.rectangle(npc.x, npc.y + 36, 0, 14, 0x001a38, 0.82).setDepth(15).setOrigin(0.5);
 npc._nameLabel = this.add.text(npc.x, npc.y + 36, npc.label, {
 fontSize: '10px', fontFamily: '"Courier New", monospace',
 color: '#f9ca24', stroke: '#001a38', strokeThickness: 4,
 fontStyle: 'bold'
 }).setOrigin(0.5).setDepth(16);
 // Size the bg pill to match text
 npc._nameLabel.once('ready', () => {});
 this.time.delayedCall(50, () => {
 if (npc._nameBg) npc._nameBg.setSize(npc._nameLabel.width + 10, 16);
 });
 } else {
 npc.sprite = this.physics.add.staticSprite(npc.x, npc.y, npc.tex)
 .setScale(1.5).setDepth(15);
 // Dark pill background
 const lbl = this.add.text(npc.x, npc.y + 36, npc.label, {
 fontSize: '10px', fontFamily: '"Courier New", monospace',
 color: '#f9ca24', stroke: '#001a38', strokeThickness: 4,
 fontStyle: 'bold'
 }).setOrigin(0.5).setDepth(16);
 this.time.delayedCall(50, () => {
 this.add.rectangle(npc.x, npc.y + 36, lbl.width + 10, 16, 0x001a38, 0.82)
 .setDepth(15).setOrigin(0.5);
 lbl.setDepth(17); // ensure text sits above pill
 });
 }
 });
 }

 // ── Sequential dialog gating ──────────────────────────────
 _shouldAllowDialog(npc) {
 return npc.id === this._activeNpcId;
 }

 _openDialog(npc) {
 if (npc.id === 'mc_intro') {
 if (this._step === 0) {
 npc.pages = [
 "Welcome, Sheeshkabob! Today we're examining Zainuddin et al. (2020) a systematic review of gamification in education.\n\nTalk to the four researchers to collect their insights. Off you go! "
 ];
 } else if (this._step === 5) {
 npc.pages = this._mcFinalPages;
 }
 }
 super._openDialog(npc);
 }

 _onDialogClosed(npc) {
 if (npc.id === 'mc_intro') {
 if (this._step === 0) {
 this._step = 1;
 this._activeNpcId = 'zainuddin';
 } else if (this._step === 5) {
   // Immediately mark as completed to prevent any further dialogs
   this._completeTriggered = true;
   this._onComplete();
   return;
 }
 } else {
 if (this._step === 1 && npc.id === 'zainuddin') { this._step = 2; this._activeNpcId = 'chu'; }
 else if (this._step === 2 && npc.id === 'chu') { this._step = 3; this._activeNpcId = 'shujahat'; }
 else if (this._step === 3 && npc.id === 'shujahat') { this._step = 4; this._activeNpcId = 'perera'; }
 else if (this._step === 4 && npc.id === 'perera') { this._step = 5; this._activeNpcId = 'mc_intro'; }
 }
 this._updateExclamation();
 }

 // ── Exclamation — no tween for walker (we bob manually) ───
 _updateExclamation() {
 if (this._currentExclaim) {
 this.tweens.killTweensOf(this._currentExclaim);
 this._currentExclaim.destroy();
 this._currentExclaim = null;
 }
 const npc = this._npcs.find(n => n.id === this._activeNpcId);
 if (npc && npc.sprite) {
 this._currentExclaim = this.add.image(npc.sprite.x, npc.sprite.y - 50, 'exclaim')
 .setScale(2.2).setDepth(25);
 if (!npc.isWalker) {
 // Bob up and down + pulse scale for static NPCs
 this.tweens.add({
 targets: this._currentExclaim,
 y: this._currentExclaim.y - 7,
 scaleX: 2.5, scaleY: 2.5,
 duration: 420, yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
 });
 }
 }
 }

 // ── No auto-complete: only McCready's final dialogue triggers it
 _checkComplete() { /* intentionally empty */ }

 // ── Update: move walker + track label + bob exclaim ────────
 update() {
 super.update();
 const walker = this._npcs && this._npcs.find(n => n.isWalker);
 if (!walker || !walker.sprite) return;

 if (this._dialogActive || this._collected.has(walker.id)) {
 walker.sprite.setVelocityX(0);
 } else {
 const speed = 26;
 if (walker.sprite.x >= walker.walkRight) this._walkDir = -1;
 if (walker.sprite.x <= walker.walkLeft) this._walkDir = 1;
 walker.sprite.setVelocityX(speed * this._walkDir);
 walker.sprite.setFlipX(this._walkDir < 0);
 }

 // Keep name label + bg above walker
 if (walker._nameLabel) {
 walker._nameLabel.setPosition(walker.sprite.x, walker.sprite.y + 36);
 if (walker._nameBg) walker._nameBg.setPosition(walker.sprite.x, walker.sprite.y + 36);
 }

 // Manual sin-bob for exclaim when walker is the active NPC
 if (walker.id === this._activeNpcId && this._currentExclaim) {
 const bob = Math.sin(this.time.now / 280) * 5;
 const pulse = 2.2 + Math.sin(this.time.now / 420) * 0.15;
 this._currentExclaim.setPosition(walker.sprite.x, walker.sprite.y - 50 + bob);
 this._currentExclaim.setScale(pulse);
 }
 }

 // ══════════════════════════════════════════════════════════════
 // UBC SCARFE FOYER MAP
 // ══════════════════════════════════════════════════════════════
 _buildScarfeFoyer() {
 const g = this.add.graphics();

 // ── Stone tile floor ──────────────────────────────────────
 for (let row = 0; row <= Math.ceil(H / 64); row++) {
 for (let col = 0; col <= Math.ceil(W / 64); col++) {
 const alt = (row + col) % 2 === 0;
 g.fillStyle(alt ? 0xd2ccc3 : 0xc8c2b8);
 g.fillRect(col * 64, row * 64, 64, 64);
 }
 }
 // Grout lines
 g.lineStyle(1, 0xb4aea6, 0.55);
 for (let x = 0; x <= W; x += 64) g.lineBetween(x, 0, x, H);
 for (let y = 0; y <= H; y += 64) g.lineBetween(0, y, W, y);

 // ── Back wall (visible strip at top) ─────────────────────
 g.fillStyle(0xe8e3da);
 g.fillRect(0, 0, W, 110);
 // Chair rail / dado band
 g.fillStyle(0xd5cdc0);
 g.fillRect(0, 98, W, 14);
 g.fillStyle(0xbfb8ae);
 g.fillRect(0, 107, W, 4);

 // ── Side walls ────────────────────────────────────────────
 g.fillStyle(0xddd7ce);
 g.fillRect(0, 0, 57, H);

 tex: 'npc_alabd', x: 158, y: 268,
 pages: [
 "Our 2020 research examines the effectiveness of gamified interventions, with a particular focus on serious games (educational games designed for a primary purpose other than entertainment), in improving executive functions in individuals with ADHD.", 
 "We sourced studies from Google, Google Scholar, and the Saudi Digital Library using search terms combining ADHD, serious games, gamification, executive function, and computer-assisted Learning. We identified and compared 15 serious games across demographics, training duration, targeted skills, methodology, platform, and reported outcomes.",
 "Our key findings indicate that serious games are a promising non-pharmaceutical treatment for ADHD. Interventions showed positive effects on academic engagement, working memory, inhibition, and self-control, while reducing hyperactive and disruptive behaviours.\n\nNotably, even short-term interventions produced meaningful improvements, though the authors caution that unsupervised use carries a risk of game addiction."
 ]

 // ── Sequential gating ─────────────────────────────────────────
 _shouldAllowDialog(npc) {
 return npc.id === this._activeNpcId;
 }

 _openDialog(npc) {
 if (npc.id === 'mc_lib') {
 if (this._step === 0) {
 npc.pages = [
 "Welcome! We're examining Alabdulakareem & Jamjoom (2020) A clinical review of Serious Games for ADHD.\n\nTalk to both researchers to learn more then report back to me to debrief. "
 ];
 } else if (this._step === 3) {
 npc.pages = this._mcFinalPages;
 }
 }
 super._openDialog(npc);
 }

 _onDialogClosed(npc) {
 if (npc.id === 'mc_lib') {
 if (this._step === 0) {
 this._step = 1; this._activeNpcId = 'alabd';
 } else if (this._step === 3) {
   // Immediately mark as completed to prevent any further dialogs
   this._completeTriggered = true;
   this._onComplete(); return;
 }
 } else if (this._step === 1 && npc.id === 'alabd') {
 this._step = 2; this._activeNpcId = 'jamjoom_f';
 } else if (this._step === 2 && npc.id === 'jamjoom_f') {
 this._step = 3; this._activeNpcId = 'mc_lib';
 }
 this._updateExclamationLib();
 }

 _updateExclamationLib() {
 if (this._currentExclaim) {
 this.tweens.killTweensOf(this._currentExclaim);
 this._currentExclaim.destroy();
 this._currentExclaim = null;
 }
 const npc = this._npcs.find(n => n.id === this._activeNpcId);
 if (npc && npc.sprite) {
 this._currentExclaim = this.add.image(npc.sprite.x, npc.sprite.y - 50, 'exclaim')
 .setScale(2.2).setDepth(25);
 this.tweens.add({
 targets: this._currentExclaim,
 y: this._currentExclaim.y - 7,
 scaleX: 2.5, scaleY: 2.5,
 duration: 420, yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
 });
 }
 }
