<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETEC 531 — Free Play</title>
  <meta name="description" content="Praxis Free Play rhythm studio." />

  <style>
    :root {
      color-scheme: light dark;

      /*
        Match these to your existing app palette if desired.
      */
      --praxis-bg: #f6f7f9;
      --praxis-surface: #ffffff;
      --praxis-surface-2: #eef2f6;
      --praxis-ink: #111827;
      --praxis-muted: #5b6472;
      --praxis-line: #d8dee7;
      --praxis-accent: #1d4ed8;
      --praxis-accent-2: #1840a8;
      --praxis-accent-ink: #ffffff;
      --praxis-focus: rgba(29, 78, 216, 0.30);
      --praxis-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
      --praxis-topbar-height: 72px;
      --praxis-dock-min: 84px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --praxis-bg: #0b1017;
        --praxis-surface: #121924;
        --praxis-surface-2: #18212e;
        --praxis-ink: #e8edf4;
        --praxis-muted: #9aa6b5;
        --praxis-line: #2a3646;
        --praxis-accent: #60a5fa;
        --praxis-accent-2: #93c5fd;
        --praxis-accent-ink: #071018;
        --praxis-focus: rgba(96, 165, 250, 0.34);
        --praxis-shadow: 0 14px 34px rgba(0, 0, 0, 0.34);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: "Open Sans", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--praxis-bg);
      color: var(--praxis-ink);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select,
    output {
      font: inherit;
    }

    .topbar {
      min-height: var(--praxis-topbar-height);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
      background: color-mix(in srgb, var(--praxis-surface) 90%, transparent);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--praxis-line);
      box-shadow: var(--praxis-shadow);
      z-index: 30;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand__badge {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--praxis-accent), #7c3aed);
      color: white;
      font-weight: 800;
      flex: 0 0 auto;
      box-shadow: var(--praxis-shadow);
    }

    .brand__text {
      min-width: 0;
      line-height: 1.15;
    }

    .brand__title {
      font-weight: 800;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .brand__subtitle {
      color: var(--praxis-muted);
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar__nav {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-right: auto;
    }

    .topbar__nav a {
      padding: 9px 12px;
      border-radius: 999px;
      color: var(--praxis-muted);
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .topbar__nav a:hover {
      background: var(--praxis-surface-2);
      color: var(--praxis-ink);
    }

    .topbar__nav a[aria-current="page"] {
      background: color-mix(in srgb, var(--praxis-accent) 12%, transparent);
      color: var(--praxis-ink);
      border-color: color-mix(in srgb, var(--praxis-accent) 30%, transparent);
      font-weight: 700;
    }

    .topbar__nav a:focus-visible,
    .metro-toggle:focus-visible,
    .metro-select:focus-visible,
    .metro-range:focus-visible {
      outline: none;
      box-shadow: 0 0 0 4px var(--praxis-focus);
      border-radius: 10px;
    }

    .metronome {
      display: none;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 12px;
      border: 1px solid var(--praxis-line);
      border-radius: 16px;
      background: color-mix(in srgb, var(--praxis-surface-2) 88%, transparent);
      margin-left: auto;
    }

    .metronome--top {
      margin-left: auto;
    }

    .metro-toggle {
      min-width: 88px;
      min-height: 42px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: var(--praxis-accent);
      color: var(--praxis-accent-ink);
      font-weight: 800;
      cursor: pointer;
    }

    .metro-toggle.active {
      background: #dc2626;
      color: white;
    }

    .metro-field {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--praxis-muted);
      font-size: 0.94rem;
      white-space: nowrap;
    }

    .metro-range {
      width: 150px;
      accent-color: var(--praxis-accent);
      cursor: pointer;
    }

    .metro-output {
      min-width: 76px;
      text-align: center;
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--praxis-surface);
      border: 1px solid var(--praxis-line);
      font-weight: 800;
      color: var(--praxis-ink);
    }

    .metro-select {
      min-height: 40px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--praxis-line);
      background: var(--praxis-surface);
      color: var(--praxis-ink);
      cursor: pointer;
    }

    .metro-lights {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 4px;
    }

    .metro-lights i {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--praxis-muted) 35%, transparent);
      border: 1px solid color-mix(in srgb, var(--praxis-muted) 45%, transparent);
      transition: transform 80ms ease, background 80ms ease;
    }

    .metro-lights i.accent {
      border-color: color-mix(in srgb, var(--praxis-accent) 55%, transparent);
    }

    .metro-lights i.on {
      background: var(--praxis-accent);
      transform: scale(1.22);
    }

    .stage {
      position: relative;
      min-height: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), transparent),
        #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      .stage {
        background:
          linear-gradient(180deg, rgba(255,255,255,0.02), transparent),
          #0f1520;
      }
    }

    .stage iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
    }

    .dock {
      display: grid;
      gap: 10px;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      background: color-mix(in srgb, var(--praxis-surface) 94%, transparent);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--praxis-line);
      box-shadow: 0 -10px 26px rgba(15, 23, 42, 0.08);
      z-index: 30;
    }

    .dock__row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .dock__row--main {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
    }

    .dock__tempo {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .dock__range {
      width: 100%;
      min-width: 120px;
    }

    .dock__meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--praxis-muted);
      font-size: 0.9rem;
    }

    .open-original {
      color: var(--praxis-accent);
      font-weight: 700;
    }

    /* Full screens: metronome in top bar, no bottom dock */
    @media (min-width: 1024px) {
      .metronome--top {
        display: flex;
      }

      .dock {
        display: none;
      }

      .topbar {
        flex-wrap: nowrap;
      }
    }

    /* Medium and smaller: bottom metronome dock */
    @media (max-width: 1023px) {
      .metronome--top {
        display: none;
      }

      .topbar {
        align-items: flex-start;
      }

      .topbar__nav {
        width: 100%;
        margin: 0;
      }
    }

    @media (max-width: 640px) {
      .brand__subtitle {
        display: none;
      }

      .dock__row--main {
        grid-template-columns: auto 1fr;
      }

      .dock__output {
        grid-column: 1 / -1;
        justify-self: stretch;
        text-align: center;
      }
    }
  </style>

<script>Object.defineProperty(window,"tempo",{get:function(){var e=document.querySelector("[data-metro-bpm-input]")||document.querySelector("[data-metro-tempo]");return e?parseInt(e.value)||88:88;},configurable:true});</script>
  <header class="topbar">

      <main class="stage">
    <iframe id="drill-frame"
      title="Free Play rhythm exercise"
      src="about:blank"
      allow="autoplay; fullscreen"
    ></iframe>
    <canvas id="draw-canvas"></canvas>
    <script>
      (function(){
        var f=document.getElementById('drill-frame');
        if(!f)return;
        var SO='<'+'script>';
        var SC='<'+'/'+'script>';
        var host=location.hostname;
        if(host==='localhost'||host==='127.0.0.1'){f.src='http://localhost:4735/games/rhythm-app/exercise/720/';return;}
        var DRILL='/games/rhythm-app/exercise/720/';
        window.__fpDiff=window.__fpDiff||'easy';
        var TL=window.__fpDiff==='hard'?'tl=1e2e3e4e':'tl=1e2e3e4e';
        DRILL=DRILL+'?'+TL;
        window.__fpDiff=window.__fpDiff||'easy';
        var TL=window.__fpDiff==='hard'?'tl=1e2e3e4e':'tl=1e2e3e4e';
        DRILL=DRILL+'?'+TL;
        Promise.all([
          fetch(DRILL).then(function(r){return r.text();}),
          fetch('/games/rhythm-reader/embed-bridge.js?v=20260722v10').then(function(r){return r.text();}).catch(function(){return '';}),
          fetch('/games/rhythm-reader/embed-overrides.css?v=20260722v10').then(function(r){return r.text();}).catch(function(){return '';})
        ]).then(function(res){
          var h=res[0],bridge=res[1],ov=res[2];
          h=h.replace(/if\s*\(\s*top\s*==\s*self\s*\)/g,'if(true)');
          h=h.replace(/if\s*\(\s*self\s*==\s*top\s*\)/g,'if(true)');
          h=h.replace(/if\s*\(\s*top\s*!=\s*self\s*\)/g,'if(false)');
          h=h.replace(/if\s*\(\s*self\s*!=\s*top\s*\)/g,'if(false)');
          h=h.replace(/if\s*\(\s*window\.top\s*===?\s*window\.self\s*\)/g,'if(true)');
          h=h.replace(/if\s*\(\s*window\.top\s*!==?\s*window\.self\s*\)/g,'if(false)');
          h=h.replace(/top\.location\s*=\s*self\.location[^;}\n]*/g,'/*x*/');
          h=h.replace(/self\.location\s*=\s*top\.location[^;}\n]*/g,'/*x*/');
          h=h.replace(/top\.location\.href\s*=[^;}\n]*/g,'/*x*/');
          h=h.replace(/top\.location\.replace\([^)]*\)/g,'/*x*/');
          h=h.replace(/top\.location\.assign\([^)]*\)/g,'/*x*/');
          h=h.replace(/window\.top\.location\s*=[^;}\n]*/g,'/*x*/');
          h=h.replace(/window\.top\.location\.href\s*=[^;}\n]*/g,'/*x*/');
          h=h.replace(/window\.top\.location\.replace\([^)]*\)/g,'/*x*/');
          h=h.replace(/parent\.location\s*=[^;}\n]*/g,'/*x*/');
          h=h.replace(/<meta[^>]*content-security-policy[^>]*>/gi,'');
          if(ov){h=h.replace('</head>','<style>'+ov+'</style><style id="praxis-reveal">#drill-frame{opacity:0;transition:opacity .15s ease}#drill-frame.praxis-shown{opacity:1}</style></head>');}
          if(bridge){var inj=SO+bridge+SC;h=(h.indexOf('</body>')!==-1)?h.replace('</body>',inj+'</body>'):h+inj;}
          h=h.replace(/\/games\/rhythm-app\/ovelser\/js\/min\/rhythm_image-min\.js/g,'/games/rhythm-reader/rhythm_image-min.js');
          try{if(window.__fpDiff==='easy'){h=h.replace(/\bsekstendedel[0-9]*\b/g,'fjerdedel');}}catch(e){}
          f.srcdoc=h;
        }).catch(function(e){
          console.error('[praxis] drill load failed',e);
          f.srcdoc='<html><body style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui;color:#666"><p>Exercise failed to load.</p></body></html>';
        });
      })();
    </script>

  <footer class="dock" aria-label="Metronome dock">

  <label><span>Show “Counting aid” in bar</span><input type="checkbox" id="fp-set-showaid" checked></label>

<script>
(function(){
  var $=function(s){return document.querySelector(s);}, $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s));};
  var frame=$('#drill-frame'), stage=$('.stage')||($('main')||document.body);
  var _sd=true; // dots default
  var settings={showDraw:true,showAid:true,master:false,metroSound:true,cursor:true};
  var muted=false, lastEx=-1;

  /* canvas */
  var canvas=$('#draw-canvas'); if(!canvas){ canvas=document.createElement('canvas'); canvas.id='draw-canvas'; (stage||document.body).appendChild(canvas); }
  var ctx=canvas.getContext('2d'), palette=$('#draw-palette');
  var strokes=[], current=null, drawing=false, drawColor='#ef4444', eraser=false, cssW=1, cssH=1, PEN=3, ERA=18;
  function sizeCanvas(){ var r=(stage||document.body).getBoundingClientRect(); var dpr=window.devicePixelRatio||1; cssW=Math.max(1,r.width); cssH=Math.max(1,r.height); canvas.width=Math.round(cssW*dpr); canvas.height=Math.round(cssH*dpr); canvas.style.width=cssW+'px'; canvas.style.height=cssH+'px'; redraw(); }
  function redraw(){ var dpr=window.devicePixelRatio||1; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,cssW,cssH); ctx.lineCap='round'; ctx.lineJoin='round'; for(var s=0;s<strokes.length;s++){ var st=strokes[s]; ctx.globalCompositeOperation=st.eraser?'destination-out':'source-over'; ctx.strokeStyle=st.color; ctx.lineWidth=st.size; ctx.beginPath(); var p0=st.points[0]; ctx.moveTo(p0.x*cssW,p0.y*cssH); for(var i=1;i<st.points.length;i++)ctx.lineTo(st.points[i].x*cssW,st.points[i].y*cssH); if(st.points.length===1)ctx.lineTo(p0.x*cssW+0.1,p0.y*cssH+0.1); ctx.stroke(); } ctx.globalCompositeOperation='source-over'; }
  function segDraw(st,a,b){ var dpr=window.devicePixelRatio||1; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.globalCompositeOperation=st.eraser?'destination-out':'source-over'; ctx.strokeStyle=st.color; ctx.lineWidth=st.size; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(a.x*cssW,a.y*cssH); ctx.lineTo(b.x*cssW,b.y*cssH); ctx.stroke(); ctx.globalCompositeOperation='source-over'; }
  function clearDrawing(){ strokes=[]; current=null; redraw(); }
  function pt(e){ var r=canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)/cssW,y:(e.clientY-r.top)/cssH}; }
  canvas.addEventListener('pointerdown',function(e){ if(!drawing)return; e.preventDefault(); try{canvas.setPointerCapture(e.pointerId);}catch(er){} var p=pt(e); current={color:drawColor,size:eraser?ERA:PEN,eraser:eraser,points:[p]}; strokes.push(current); });
  canvas.addEventListener('pointermove',function(e){ if(!current)return; e.preventDefault(); var p=pt(e), prev=current.points[current.points.length-1]; current.points.push(p); segDraw(current,prev,p); });
  function endStroke(){ if(!current)return; if(current.points.length===1)segDraw(current,current.points[0],current.points[0]); current=null; }
  canvas.addEventListener('pointerup',endStroke); canvas.addEventListener('pointercancel',endStroke); canvas.addEventListener('pointerleave',endStroke);
  function setDrawing(on){ drawing=on; canvas.style.pointerEvents=on?'auto':'none'; canvas.style.cursor=on?'crosshair':'default'; palette.classList.toggle('show',on); $$('.js-draw-toggle').forEach(function(b){ b.classList.toggle('draw-on',on); b.textContent=on?'Drawing':'Draw'; }); }
  var rzT=null; window.addEventListener('resize',function(){ clearTimeout(rzT); rzT=setTimeout(sizeCanvas,120); });
  try{ new ResizeObserver(function(){ sizeCanvas(); }).observe(stage||document.body); }catch(e){} window.addEventListener('load',sizeCanvas);

  /* inject Draw + Aid controls into existing navbar rows */
  function mkDraw(){ var b=document.createElement('button'); b.type='button'; b.className='metro-toggle js-draw-toggle'; b.setAttribute('data-draw-toggle',''); b.textContent='Draw'; b.style.display='none'; return b; }
  function mkAid(){ var w=document.createElement('span'); w.className='metro-field js-aid-wrap'; w.style.display='none'; w.innerHTML='Aid <span class="seg" data-aid-seg><button type="button" data-aid="none" class="on">None</button><button type="button" data-aid="syllables">Ta/ti</button><button type="button" data-aid="numbers">1 +</button></span>'; return w; }
  function mkMute(){ var b=document.createElement('button'); b.type='button'; b.className='metro-mute'; b.setAttribute('data-mute',''); b.setAttribute('aria-pressed','false'); b.title='Mute / unmute'; b.textContent='🔊'; return b; }
  function setMuteUI(){ $$('[data-mute],#mute-btn').forEach(function(b){ b.classList.toggle('muted',muted); b.textContent=muted?'\u{1F507}':'\u{1F50A}'; b.setAttribute('aria-pressed',String(muted)); }); }
  function injectNavControls(){
    var oldMute=document.getElementById('mute-btn'); if(oldMute) oldMute.style.display='none';
    $$('.metronome--top, .dock').forEach(function(row){
      if(row.querySelector('.js-draw-toggle'))return;
      var gear=row.querySelector('[data-metro-gear]');
      var d=mkDraw(), a=mkAid(), m=mkMute();
      var gp=gear?gear.parentNode:row; if(gp&&gear){ gp.insertBefore(d,gear); gp.insertBefore(a,gear); gp.insertBefore(m,gear); } else if(row){ row.appendChild(d); row.appendChild(a); row.appendChild(m); }
    });
    applyShowToggles(); setMuteUI();
  }
  function applyShowToggles(){ $$('.js-draw-toggle').forEach(function(b){ b.style.display=settings.showDraw?'':'none'; }); $$('.js-aid-wrap').forEach(function(w){ w.style.display=settings.showAid?'':'none'; }); if(canvas) canvas.style.display=settings.showDraw?'':'none'; }

  /* audio */
  var __actx=null; function actx(){ try{ var AC=window.AudioContext||window.webkitAudioContext; if(!AC)return null; if(!__actx)__actx=new AC(); if(__actx.state==='suspended')__actx.resume(); return __actx; }catch(e){return null;} }
  document.addEventListener('pointerdown',function(){actx();},true); document.addEventListener('keydown',function(){actx();},true);

  function post(m){ if(frame&&frame.contentWindow)frame.contentWindow.postMessage(m,'*'); }

  /* events */
  document.addEventListener('click',function(e){
    var dt=e.target&&e.target.closest?e.target.closest('[data-draw-toggle]'):null;
    if(dt){ e.preventDefault(); e.stopImmediatePropagation(); setDrawing(!drawing); return; }
    var mu=e.target&&e.target.closest?e.target.closest('[data-mute]'):null;
    if(mu){ e.preventDefault(); muted=!muted; setMuteUI(); post({type:'praxis-mute',muted:muted}); return; }/*mub-fp*/
    var sw=e.target&&e.target.closest?e.target.closest('.sw'):null;
    if(sw){ e.preventDefault(); $$('.sw').forEach(function(x){x.classList.remove('on');}); sw.classList.add('on'); if(sw.hasAttribute('data-eraser'))eraser=true; else { eraser=false; drawColor=sw.getAttribute('data-color')||drawColor; } return; }
    var un=e.target&&e.target.closest?e.target.closest('[data-undo]'):null; if(un){ e.preventDefault(); strokes.pop(); redraw(); return; }
    var cl=e.target&&e.target.closest?e.target.closest('[data-clear]'):null; if(cl){ e.preventDefault(); clearDrawing(); return; }
    var aid=e.target&&e.target.closest?e.target.closest('[data-aid]'):null;
    if(aid){ var m=aid.getAttribute('data-aid'); $$('[data-aid-seg]').forEach(function(seg){ seg.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===aid);}); }); post({type:'praxis-aid',mode:m}); return; }
    var g=e.target&&e.target.closest?e.target.closest('[data-metro-gear]'):null;
    if(g){ e.preventDefault(); e.stopImmediatePropagation(); var pop=$('#praxis-settings-pop'); pop.hidden=!pop.hidden; return; }
    if(!$('#praxis-settings-pop').hidden && !e.target.closest('#praxis-settings-pop')) $('#praxis-settings-pop').hidden=true;
  },true);
  document.addEventListener('change',function(e){
    if(e.target.id==='fp-set-showdraw'){ settings.showDraw=e.target.checked; applyShowToggles(); if(!settings.showDraw)setDrawing(false); }
    else if(e.target.id==='fp-set-showaid'){ settings.showAid=e.target.checked; applyShowToggles(); }
    else if(e.target.id==='fp-set-master'){ settings.master=e.target.checked; if(settings.master){ $$('[data-metro-lights]').forEach(function(d){d.style.display='none';}); } else if(settings.dots){ $$('[data-metro-lights]').forEach(function(d){d.style.display='';}); } post({type:'praxis-settings',settings:settings}); }
    else if(e.target.id==='fp-set-sound'){ settings.metroSound=e.target.checked; post({type:'praxis-settings',settings:settings}); }
    else if(e.target.id==='fp-set-cursor'){ settings.dots=e.target.checked; $$('[data-metro-lights]').forEach(function(d){ d.style.display=(settings.dots&&!settings.master)?'':'none'; }); }
  },true);
  $('#mute-btn').addEventListener('click',function(){ muted=!muted; this.classList.toggle('muted',muted); this.textContent=muted?'🔇':'🔊'; this.setAttribute('aria-pressed',String(muted)); post({type:'praxis-mute',muted:muted}); });

  window.addEventListener('message',function(ev){
    var d=ev.data; if(!d)return;
    if(d.type==='drill-ready'){try{frame.classList.add('praxis-shown');}catch(e){} post({type:'praxis-settings',settings:settings}); post({type:'praxis-aid',mode:'none'}); post({type:'praxis-mute',muted:muted}); sizeCanvas(); }
    else if(d.type==='drill-state'){ if(typeof d.exercise==='number' && d.exercise!==lastEx){ lastEx=d.exercise; clearDrawing(); } }
    else if(d.type==='praxis-new-exercise'){ clearDrawing(); }/*nxm-fp*/
  });

  /* sync visual beat dots to the bridge's beat pulse (audio+visual share one clock) */
  window.addEventListener('message',function(ev){
    var d=ev.data; if(!d||d.type!=='metro-beat')return;
    if(settings.master)return;
    var lights=$$('[data-metro-lights]');
    lights.forEach(function(c){
      var dots=c.children; if(!dots.length)return;
      var idx=d.beat%dots.length;
      Array.prototype.forEach.call(dots,function(dot,i){ dot.classList.toggle('on',i===idx); });
    });
  });
  injectNavControls();
  $$('[data-metro-lights]').forEach(function(d){ d.style.display=settings.dots?'':'none'; });
  
  /* Listen handled by separate capture-phase script below */
  /* Line cursor + marks settings */
  if(settings.cursor!==undefined){settings.dots=settings.cursor;delete settings.cursor;}
  if(settings.lineCursor===undefined)settings.lineCursor=true;
  if(settings.marks===undefined)settings.marks=true;
  (function(){
    var cur=document.getElementById('fp-set-cursor2'), mk=document.getElementById('fp-set-marks');
    function sync(){ settings.lineCursor = cur ? cur.checked : true; settings.marks = mk ? mk.checked : true;
      if(settings.marks===false){ settings.lineCursor=true; if(cur){cur.checked=true; cur.disabled=true;} } else { if(cur){cur.disabled=false;} }
      post({type:'praxis-settings',settings:settings}); }
    if(cur)cur.addEventListener('change',sync);
    if(mk)mk.addEventListener('change',sync);
    sync();
  })();

  sizeCanvas();
})();
</script>

<script>
(function(){
  var listening=false,frame=document.getElementById('drill-frame');
  function post(m){if(frame&&frame.contentWindow)frame.contentWindow.postMessage(m,'*');}
  function setBtn(){document.querySelectorAll('[data-listen]').forEach(function(b){b.textContent=listening?'Stop':'Listen';b.classList.toggle('active',listening);});}
  document.addEventListener('click',function(e){var btn=e.target.closest?e.target.closest('[data-listen]'):null;if(!btn)return;e.stopImmediatePropagation();e.preventDefault();listening=!listening;setBtn();post({type:'praxis-listen'});},true);
  window.addEventListener('message',function(ev){var d=ev.data;if(!d||d.type!=='drill-state')return;if(!d.playing&&listening){listening=false;setBtn();}});
})();
</script>
