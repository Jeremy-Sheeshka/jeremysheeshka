<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETEC 531 — Co-Op · Trade Fours</title>
  <style>
    :root{color-scheme:light dark;--praxis-bg:#f6f7f9;--praxis-surface:#fff;--praxis-surface-2:#eef2f6;--praxis-ink:#111827;--praxis-muted:#5b6472;--praxis-line:#d8dee7;--praxis-accent:#1d4ed8;--praxis-accent-2:#1840a8;--praxis-accent-ink:#fff;--praxis-gold:#e8a83e;--praxis-gold-ink:#241a06;--praxis-focus:rgba(29,78,216,.30);--praxis-shadow:0 12px 30px rgba(15,23,42,.12)}
    @media (prefers-color-scheme:dark){:root{--praxis-bg:#0b1017;--praxis-surface:#121924;--praxis-surface-2:#18212e;--praxis-ink:#e8edf4;--praxis-muted:#9aa6b5;--praxis-line:#2a3646;--praxis-accent:#60a5fa;--praxis-accent-2:#93c5fd;--praxis-accent-ink:#071018;--praxis-gold:#f0b95a;--praxis-gold-ink:#241a06;--praxis-focus:rgba(96,165,250,.34);--praxis-shadow:0 14px 34px rgba(0,0,0,.34)}}
    *{box-sizing:border-box}html,body{height:100%}
    body{margin:0;font-family:"Open Sans","Segoe UI",system-ui,sans-serif;background:var(--praxis-bg);color:var(--praxis-ink);display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;overflow:hidden}
    a{color:inherit;text-decoration:none}button,input,select{font:inherit;color:inherit}
    .topbar{display:flex;align-items:center;gap:14px;padding:8px 12px;border-bottom:1px solid var(--praxis-line);background:var(--praxis-bg);flex-wrap:wrap;row-gap:6px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800}
    .brand__badge{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--praxis-accent);color:var(--praxis-accent-ink);font-size:.8rem;font-weight:800}
    .brand__title{font-size:1rem}
    .topbar__nav{display:flex;gap:4px}
    .topbar__nav a{padding:6px 10px;border-radius:8px;font-size:.9rem;font-weight:700;color:var(--praxis-muted)}
    .topbar__nav a[aria-current="page"]{color:var(--praxis-accent);background:var(--praxis-surface-2)}
    .metronome{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;margin-left:auto;max-width:100%;overflow-x:auto;scrollbar-width:none}
    .metronome::-webkit-scrollbar{display:none}
    .metronome>*{flex:0 0 auto}
    .metro-toggle{min-width:66px;min-height:38px;padding:7px 13px;border-radius:10px;border:1px solid transparent;background:var(--praxis-accent);color:var(--praxis-accent-ink);font-weight:800;cursor:pointer}
    .metro-toggle.active{background:#dc2626;color:#fff}
    .metro-toggle.draw-on{background:var(--praxis-gold);color:var(--praxis-gold-ink)}
    .metro-gear{min-width:42px;font-size:1.35rem;line-height:1;padding:5px 9px;background:var(--praxis-surface);color:var(--praxis-ink);border:1px solid var(--praxis-line)}
    .metro-field{display:flex;align-items:center;gap:7px;color:var(--praxis-muted);font-size:.88rem;white-space:nowrap}
    .metro-range{width:120px;accent-color:var(--praxis-accent)}
    .metro-output{width:4.4em;text-align:center;font-weight:800;padding:6px 7px;border:1px solid var(--praxis-line);border-radius:8px;background:var(--praxis-surface);color:var(--praxis-ink)}
    .metro-select{min-height:36px;padding:6px 9px;border-radius:9px;border:1px solid var(--praxis-line);background:var(--praxis-surface);color:var(--praxis-ink)}
    .metronome--top{display:none}.dock{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--praxis-line);background:var(--praxis-surface-2)}
    @media (min-width:1024px){.metronome--top{display:flex}.dock{display:none}}
    .seg{display:inline-flex;border:1px solid var(--praxis-line);border-radius:9px;overflow:hidden}
    .seg button{border:0;background:var(--praxis-surface);padding:6px 10px;font-size:.8rem;font-weight:700;cursor:pointer;color:var(--praxis-muted)}
    .seg button.on{background:var(--praxis-accent);color:var(--praxis-accent-ink)}
    .coop{padding:6px clamp(12px,3vw,28px);border-bottom:1px solid var(--praxis-line);background:var(--praxis-surface-2)}
    .coop-head{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
    .coop-line{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:nowrap}
    .coop-line .turn-banner{margin:0;flex:0 1 auto;white-space:nowrap}
    .coop-line .beat-dots{margin:0}
    @media (max-width:720px){ .coop-line{flex-wrap:wrap} }
    .student-card{flex:0 0 auto;min-width:0;display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:9px;border:1px solid var(--praxis-line);background:var(--praxis-surface);font-weight:800;font-size:.82rem}
    .student-card .dot{width:9px;height:9px;border-radius:50%}
    .student-card.a .dot{background:var(--praxis-accent)}.student-card.b .dot{background:var(--praxis-gold)}
    .student-card small{font-weight:600;color:var(--praxis-muted);margin-left:4px;font-size:.72rem}
    .student-card .key{margin-left:4px;font-size:.66rem;font-weight:800;border:1px solid var(--praxis-line);border-radius:5px;padding:0 5px;color:var(--praxis-muted)}
    .student-card .keyhint{margin-left:2px;font-size:.64rem;font-weight:700;color:var(--praxis-muted);opacity:.85}
    .turn-banner{margin:5px auto 4px;padding:4px 12px;border-radius:9px;font-weight:800;text-align:center;background:var(--praxis-surface);border:1px solid var(--praxis-line);font-size:.78rem;width:max-content;max-width:100%}
    .turn-banner.owner-a{border-color:var(--praxis-accent);color:var(--praxis-accent)}
    .turn-banner.owner-b{border-color:var(--praxis-gold);color:var(--praxis-gold)}
    .beat-dots{display:flex;justify-content:center;gap:8px}
    .beat-dots i{width:11px;height:11px;border-radius:50%;background:color-mix(in srgb,var(--praxis-muted) 35%,transparent);transition:transform .08s,background .08s}
    .beat-dots i.on{background:var(--praxis-accent);transform:scale(1.25)}
    .stage{position:relative;min-height:0}
    .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;z-index:1}
    #draw-canvas{position:absolute;inset:0;z-index:2;pointer-events:none;touch-action:none}
    #draw-palette{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:3;display:none;align-items:center;gap:8px;flex-wrap:wrap;background:var(--praxis-surface);border:1px solid var(--praxis-line);border-radius:12px;padding:7px 10px;box-shadow:var(--praxis-shadow)}
    #draw-palette.show{display:flex}
    .sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
    .sw.on{outline:2px solid var(--praxis-accent);outline-offset:2px}
    .sw.eraser{background:var(--praxis-surface);border:1px solid var(--praxis-line);color:var(--praxis-ink);font-size:.85rem;display:grid;place-items:center}
    .pal-btn{border:1px solid var(--praxis-line);background:var(--praxis-surface);border-radius:8px;padding:5px 9px;font-size:.78rem;font-weight:700;cursor:pointer;color:var(--praxis-ink)}
    .metro-mute{min-width:42px;min-height:38px;font-size:1.1rem;line-height:1;padding:5px 9px;border-radius:10px;border:1px solid var(--praxis-line);background:var(--praxis-surface);color:var(--praxis-ink);cursor:pointer}
    .metro-mute.muted{background:#dc2626;color:#fff;border-color:#dc2626}
    #gear-pop{position:fixed;top:58px;right:14px;z-index:99999;width:268px;background:var(--praxis-surface);color:var(--praxis-ink);border:1px solid var(--praxis-line);border-radius:14px;box-shadow:var(--praxis-shadow);padding:16px;font-size:.9rem}
    #gear-pop h4{margin:0 0 12px;font-size:13px;letter-spacing:.05em}
    #gear-pop label{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--praxis-line);cursor:pointer}
    #gear-pop label:last-child{border-bottom:0}
    #gear-pop .hint{margin-top:10px;font-size:.72rem;color:var(--praxis-muted);line-height:1.4}
    @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
  #turn-banner{display:none!important}
.coop-head{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.coop-head .beat-dots{margin:0;order:1}
.coop-head .student-card.a{order:0}
.coop-head .student-card.b{order:2}
</style>

      <button type="button" class="sw" data-color="#9333ea" style="background:#9333ea" title="Purple"></button>
      <button type="button" class="sw" data-color="#111827" style="background:#111827" title="Black"></button>

    try{ new ResizeObserver(function(){ sizeCanvas(); }).observe(stage); }catch(e){} window.addEventListener('load',sizeCanvas);

    /* ---- audio ---- */
    var __actx=null; function actx(){ try{ var AC=window.AudioContext||window.webkitAudioContext; if(!AC)return null; if(!__actx)__actx=new AC(); if(__actx.state==='suspended')__actx.resume(); return __actx; }catch(e){return null;} }
    function blip(freq,vol,dur,type){ if(muted)return; var c=actx(); if(!c)return; try{ var o=c.createOscillator(),g=c.createGain(),t=c.currentTime; o.type=type||'sine'; o.frequency.value=freq; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.005); g.gain.exponentialRampToValueAtTime(.0001,t+(dur||.09)); o.connect(g).connect(c.destination); o.start(t); o.stop(t+(dur||.09)+.02);}catch(e){} }
    document.addEventListener('pointerdown',function(){actx();},true); document.addEventListener('keydown',function(){actx();},true);

    /* ---- comms ---- */
    function post(m){ if(frame&&frame.contentWindow)frame.contentWindow.postMessage(m,'*'); }
    function postMetro(){ post({type:'praxis-metro',playing:playing,tempo:tempo}); }
    if(typeof settings.dots==='undefined')settings.dots=true;
    if(typeof settings.cursor==='undefined')settings.cursor=true;
    if(typeof settings.marks==='undefined')settings.marks=true;
    function sendSettings(){ post({type:'praxis-settings',settings:settings}); }
    if(settings.cursor!==undefined){settings.dots=settings.cursor;delete settings.cursor;}
    if(settings.lineCursor===undefined)settings.lineCursor=true;
    if(settings.marks===undefined)settings.marks=true;
    function setToggle(){ $$('[data-metro-toggle]').forEach(function(b){b.textContent=playing?'Stop':'Play';b.classList.toggle('active',playing);b.setAttribute('aria-pressed',String(playing));}); }
    function setBpm(){ $$('[data-metro-bpm-input]').forEach(function(i){i.value=tempo;}); }
    function setSliders(){ $$('[data-metro-tempo]').forEach(function(i){i.value=tempo;}); }
    function syncSplit(){ $$('[data-coop-split]').forEach(function(s){ s.value=splitMode; var o4=s.querySelector('[value="4s"]'); if(o4)o4.disabled=(numBars<=4); }); }
    function ranges(who){ var r=[],i,s=null; for(i=0;i<ownerArr.length;i++){ if(ownerArr[i]===who){ if(s===null)s=i; } else { if(s!==null){ var e=i-1; r.push(s===e?String(s+1):(s+1)+'–'+(e+1)); s=null; } } } if(s!==null){ var e2=ownerArr.length-1; r.push(s===e2?String(s+1):(s+1)+'–'+(e2+1)); } return r.join(', '); }
    function setDots(qb){ $$('#coop-dots i').forEach(function(d,i){ d.classList.toggle('on', i===qb); }); }
    function setBanner(ow,bar){ var b=$('#turn-banner'); if(ow){ b.textContent=(ow==='A'?'Student A':'Student B')+' — bar '+(bar+1); b.className='turn-banner owner-'+ow.toLowerCase(); } }
    function summaryBanner(){ var b=$('#turn-banner'); b.className='turn-banner'; b.textContent='Trade '+(splitMode==='4s'?'4s':'2s')+' · A: '+(ranges('A')||'—')+' · B: '+(ranges('B')||'—'); }
    function idleVisuals(){ setDots(-1); if(settings.master){ $('#turn-banner').className='turn-banner'; $('#turn-banner').textContent='Self-count — you are the pulse'; } else summaryBanner(); }
    function flashCard(w){ var el=w==='a'?$('#card-a'):w==='b'?$('#card-b'):null; if(!el)return; el.classList.add('flash'); setTimeout(function(){el.classList.remove('flash');},140); }

    var ciTimer=null;
    function parentCountIn(){ if(settings.master||muted)return; clearInterval(ciTimer); var i=0, step=60000/tempo; function tick(){ blip(i===0?1046:784, i===0?.16:.10, .07); i++; if(i>=4)clearInterval(ciTimer); } tick(); ciTimer=setInterval(tick,step); }
    function doToggle(){ playing=!playing; setToggle(); postMetro(); if(playing){ if(drawing)setDrawing(false); } else { clearInterval(ciTimer); idleVisuals(); } }

    /* ---- nav draw/aid visibility (gated by settings) ---- */
    function applyShowToggles(){ $$('.js-draw-toggle').forEach(function(b){ b.style.display=settings.showDraw?'':'none'; }); $$('.js-aid-wrap').forEach(function(w){ w.style.display=settings.showAid?'':'none'; }); if(canvas) canvas.style.display=settings.showDraw?'':'none'; }

    /* ---- events ---- */
    document.addEventListener('click',function(e){
      var b=e.target&&e.target.closest?e.target.closest('[data-metro-toggle]:not([data-draw-toggle])'):null;
      if(b){ e.stopImmediatePropagation(); e.preventDefault(); doToggle(); return; }
      var mu=e.target&&e.target.closest?e.target.closest('[data-mute]'):null;
      if(mu){ e.preventDefault(); muted=!muted; setMuteUI(); post({type:'praxis-mute',muted:muted}); return; }/*mub-coop*/
      var dt=e.target&&e.target.closest?e.target.closest('[data-draw-toggle]'):null;
      if(dt){ e.preventDefault(); setDrawing(!drawing); return; }
      var sw=e.target&&e.target.closest?e.target.closest('.sw'):null;
      if(sw){ e.preventDefault(); $$('.sw').forEach(function(x){x.classList.remove('on');}); sw.classList.add('on'); if(sw.hasAttribute('data-eraser'))eraser=true; else { eraser=false; drawColor=sw.getAttribute('data-color')||drawColor; } return; }
      var un=e.target&&e.target.closest?e.target.closest('[data-undo]'):null; if(un){ e.preventDefault(); strokes.pop(); redraw(); return; }
      var cl=e.target&&e.target.closest?e.target.closest('[data-clear]'):null; if(cl){ e.preventDefault(); clearDrawing(); return; }
      var aid=e.target&&e.target.closest?e.target.closest('[data-aid]'):null;
      if(aid){ var m=aid.getAttribute('data-aid'); $$('[data-aid-seg]').forEach(function(seg){ seg.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===aid);}); }); post({type:'praxis-aid',mode:m}); return; }
      var g=e.target&&e.target.closest?e.target.closest('[data-metro-gear]'):null;
      if(g){ e.preventDefault(); var p=$('#gear-pop'); p.hidden=!p.hidden; return; }
      if(!$('#gear-pop').hidden && !e.target.closest('#gear-pop')) $('#gear-pop').hidden=true;
    },true);
    document.addEventListener('input',function(e){
      if(e.target.matches&&e.target.matches('[data-metro-tempo]')){ tempo=+e.target.value||tempo; setBpm(); setSliders(); postMetro(); }
      if(e.target.matches&&e.target.matches('[data-metro-bpm-input]')){ var v=parseInt(e.target.value,10); if(v>=40&&v<=208){ tempo=v; setBpm(); setSliders(); postMetro(); } }
    },true);
    document.addEventListener('change',function(e){
      if(e.target.matches&&e.target.matches('[data-metro-bars]')){ numBars=+e.target.value||8; console.log('[co-op] bars changed to '+numBars); if(numBars<=4)splitMode='2s'; syncSplit(); post({type:'praxis-bars',bars:numBars}); }
      else if(e.target.matches&&e.target.matches('[data-coop-split]')){ splitMode=e.target.value||'2s'; syncSplit(); post({type:'praxis-split',split:splitMode}); }
      else if(e.target.matches&&e.target.matches('[data-metro-bpm-input]')){ var v=parseInt(e.target.value,10); if(v>=40&&v<=208)tempo=v; else e.target.value=tempo; setBpm(); setSliders(); postMetro(); }
      else if(e.target.id==='set-showdraw'){ settings.showDraw=e.target.checked; applyShowToggles(); if(!settings.showDraw)setDrawing(false); }
      else if(e.target.id==='set-showaid'){ settings.showAid=e.target.checked; applyShowToggles(); }
      else if(e.target.id==='set-master'){ settings.master=e.target.checked; if(settings.master){ $('#coop-dots').style.display='none'; } else if(settings.dots){ $('#coop-dots').style.display=''; } idleVisuals(); sendSettings(); }
      else if(e.target.id==='set-sound'){ settings.metroSound=e.target.checked; sendSettings(); }
      else if(e.target.id==='set-cursor'){ settings.dots=e.target.checked; $('#coop-dots').style.display=(settings.dots&&!settings.master)?'':'none'; }
      else if(e.target.id==='set-cursor2'){ settings.lineCursor=e.target.checked; if(!settings.marks){settings.lineCursor=true;e.target.checked=true;} sendSettings(); }
      else if(e.target.id==='set-marks'){ settings.marks=e.target.checked; if(!settings.marks){settings.lineCursor=true;var _c2=document.getElementById('set-cursor2');if(_c2){_c2.checked=true;}} sendSettings(); }
      else if(e.target.id==='set-ab'){ settings.ab=e.target.checked; settings.cue=e.target.checked; sendSettings(); }
      else if(e.target.id==='set-loop'){ settings.loop=e.target.checked; sendSettings(); }
    },true);
    document.addEventListener('keydown',function(e){
      if(e.repeat)return; var t=e.target, tag=t&&(t.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'||tag==='select')return;
      var k=e.key;
      if(k===' '||e.code==='Space'){ e.preventDefault(); post({type:'praxis-tap'}); return; }
      if(k==='a'||k==='A'){ e.preventDefault(); post({type:'praxis-tap'}); flashCard('a'); return; }
      if(k==='l'||k==='L'){ e.preventDefault(); post({type:'praxis-tap'}); flashCard('b'); return; }
    });
    function setMuteUI(){ $$('[data-mute]').forEach(function(b){ b.classList.toggle('muted',muted); b.textContent=muted?'🔇':''; b.setAttribute('aria-pressed',String(muted)); }); }

    window.addEventListener('message',function(ev){
      var d=ev.data; if(!d)return;
      if(d.type==='metro-beat'){
        if(!settings.master){ var dots=$$('#coop-dots i'); if(dots.length){ var idx=d.beat%dots.length; dots.forEach(function(dot,i){ dot.classList.toggle('on',i===idx); }); } }
        return;
      }
      if(d.type==='drill-state'){ playing=!!d.playing; setToggle(); if(playing)summaryBanner(); else { clearInterval(ciTimer); idleVisuals(); } }
      else if(d.type==='drill-ready'){ post({type:'praxis-bars',bars:numBars}); post({type:'praxis-split',split:splitMode}); postMetro(); sendSettings(); post({type:'praxis-aid',mode:(($('[data-aid-seg] .on')||{}).getAttribute?$('.data-aid-seg .on'):'none')||'none'}); post({type:'praxis-mute',muted:muted}); sizeCanvas(); }
      else if(d.type==='praxis-new-exercise'){ clearDrawing(); }/*nxm-coop*/
      else if(d.type==='coop-split'){ if(d.seq!==lastSeq){ lastSeq=d.seq; clearDrawing(); } ownerArr=d.owner||[]; numBars=d.numBars||numBars; $('#coop-a-bars').textContent=ranges('A'); $('#coop-b-bars').textContent=ranges('B'); idleVisuals(); }
      else if(d.type==='coop-beat'){
        if(settings.master)return; lastOwner=d.owner;
        if(settings.dots)setDots(Math.floor(d.eighthInBar/2));
        if(settings.dots)setBanner(d.owner,d.bar);
        if(d.eighthInBar===0){ if(settings.cue)blip(d.owner==='A'?659.25:392.0, .15, .12, d.owner==='A'?'sine':'triangle'); else if(settings.metroSound)blip(784,.09,.05); }
        else if(settings.metroSound && d.eighthInBar%2===0){ blip(520,.06,.04); }
      }
    });

    /* init */
    settings.showDraw=false; settings.showAid=false;
    applyShowToggles(); setToggle(); setBpm(); setSliders(); syncSplit(); setDrawing(false);
    $('#coop-dots').style.display=settings.dots?'':'none';
    sizeCanvas();
  })();
  </script>

<script>
(function(){
  var head=document.querySelector('.coop-head');
  var dots=document.getElementById('coop-dots');
  if(head&&dots&&dots.parentNode!==head){ head.appendChild(dots); }
})();
</script>
<script>
(function(){
  var listening=false,frame=document.getElementById('drill-frame');
  function post(m){if(frame&&frame.contentWindow)frame.contentWindow.postMessage(m,'*');}
  function setBtn(){document.querySelectorAll('[data-listen]').forEach(function(b){b.textContent=listening?'Stop':'Listen';b.classList.toggle('active',listening);});}
  document.addEventListener('click',function(e){var btn=e.target.closest?e.target.closest('[data-listen]'):null;if(!btn)return;e.stopImmediatePropagation();e.preventDefault();listening=!listening;setBtn();post({type:'praxis-listen'});},true);
  window.addEventListener('message',function(ev){var d=ev.data;if(!d||d.type!=='drill-state')return;if(!d.playing&&listening){listening=false;setBtn();}});
})();
</script>
