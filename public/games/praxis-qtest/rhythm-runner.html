<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETEC 531 — Rhythm Runner</title>
<style>
  :root{--ink:#1c1917;--line:#e7e5e4;--line2:#d6d3d1;--mut:#78716c;--grey:#535353;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#fff;color:var(--ink)}
  .topbar{display:flex;align-items:center;gap:14px;background:#fff;border-bottom:1px solid var(--line);padding:8px 18px;height:54px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none}
  .brand .mark{width:30px;height:30px;background:var(--ink);color:#fff;border-radius:7px;display:grid;place-items:center;font-weight:900;font-size:12px;letter-spacing:.5px}
  .brand .eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#a8a29e;font-weight:800;text-decoration:none}
  .brand .eyebrow:hover{color:var(--mut)}
  .brand .ttl{font-size:14px;font-weight:800;color:var(--ink);text-decoration:none}
  .brand .ttl:hover{color:#44403c}
  .brand .sep{color:#d6d3d1;font-weight:700}
  .topbar nav{margin-left:auto;display:flex;gap:20px;font-size:13px;font-weight:600}
  .topbar nav a{color:#57534e;text-decoration:none}
  .topbar nav a:hover,.topbar nav a.cur{color:var(--ink)}
  .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line);padding:8px 18px;position:relative}
  button.btn{font:inherit;font-weight:700;font-size:13px;border:1px solid var(--line2);background:#fff;color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer}
  button.btn:hover{background:#f5f5f4}
  button.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  #playBtn{min-width:104px}
  .ctl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#44403c}
  .ctl input[type=range]{width:148px;accent-color:var(--ink)}
  .bpm{font-variant-numeric:tabular-nums;min-width:64px;text-align:right;font-weight:800;color:var(--ink)}
  .gearwrap{margin-left:auto;position:relative}
  .panel{position:absolute;right:0;top:42px;width:240px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.14);padding:6px 4px;z-index:40;display:none}
  .panel.open{display:block}
  .panel h4{margin:7px 12px 4px;font-size:10px;letter-spacing:1.4px;color:#a8a29e}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;font-size:13px}
  .row:hover{background:#fafaf9}
  .row select{font:inherit;border:1px solid var(--line2);border-radius:6px;padding:3px 6px;background:#fff}
  .stage{position:relative;width:100%;height:calc(100vh - 110px);min-height:360px;overflow:hidden;background:#fff}
  #track{position:absolute;inset:0;width:100%;height:100%;display:block}
  .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:8;padding:18px}
  #ready{background:rgba(255,255,255,.55)}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.16);padding:22px 26px;max-width:420px;width:100%;text-align:center}
  .card .big{font-family:"Courier New",ui-monospace,monospace;font-weight:800;letter-spacing:3px;font-size:26px;color:var(--grey)}
  .card .sub{font-size:12px;letter-spacing:1.5px;color:#a8a29e;margin-top:8px;text-transform:uppercase}
  @media (max-width:680px){
    .topbar nav{gap:14px;font-size:12px}
    .brand .eyebrow{display:none}
    .brand .sep{display:none}
  }
</style>

<body>
  <div class="topbar">
    <a class="brand" href="./index.html">
      <span class="mark">PR</span>
      <span class="eyebrow">ETEC 531</span>

    </a>
    <nav>
      <a href="./index.html">Dashboard</a>

      <a href="./co-op.html">Co-Op</a>
    </nav>

  <div class="toolbar">
    <button id="playBtn" class="btn">▶ Play</button>
    <div class="ctl">Tempo <input id="tempo" type="range" min="40" max="200" step="1" value="92"><span id="bpm" class="bpm">92 BPM</span></div>
    <div class="gearwrap">
      <button id="gearBtn" class="btn">⚙ Settings</button>
      <div id="panel" class="panel">
        <h4>RHYTHM RUNNER</h4>
        <div class="row">Counting aid
          <select id="optAid"><option value="none">none</option><option value="syllables">ta / ti</option></select>
        </div>
      </div>
    </div>

  <div class="stage" id="stage">
    <canvas id="track"></canvas>

      <div class="card">
        <div class="big">RHYTHM&nbsp;RUNNER</div>
        <div class="sub">press play · or hit space</div>
      </div>
    </div>
  </div>

<script>
var settings = { aid:'none' };
var SHOW_DINO=true, METRO=true, PULSE=true, MARKS=true;
var LEAD = 4, bpm = 92;
var HI_KEY = 'rr_hi_v1';
var INK = '#1a1a1a', BODY = '#535353', EYE = '#ffffff', HURT_RED = '#dc2626';
var TAP_EARLY = 0.20, TAP_LATE = 0.18, DEADLINE = 0.22;
var MAX_LEVEL = 5;

var stage=document.getElementById('stage'), canvas=document.getElementById('track'), ctx=canvas.getContext('2d');
var playBtn=document.getElementById('playBtn'), tempoEl=document.getElementById('tempo'), bpmEl=document.getElementById('bpm');
var gearBtn=document.getElementById('gearBtn'), panel=document.getElementById('panel');
var readyEl=document.getElementById('ready');

var W=0,H=0,dpr=1, M={};
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function resize(){
  var r=stage.getBoundingClientRect();
  W=Math.max(320,r.width); H=Math.max(320,r.height);
  dpr=window.devicePixelRatio||1;
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var s=clamp(Math.min(W/900, H/520), 0.72, 1.9);
  var ps=Math.round(4*s);
  var maxH=Math.floor((0.40*H)/23);
  var maxW=Math.floor((0.46*W)/22);
  ps=clamp(ps, 3, Math.min(maxH, maxW));
  var groundY=Math.round(H*0.74);
  var dinoH=23*ps;
  var stemH=48*s;
  var headR=9*s;
  var jumpJ=stemH + headR + 22*s;
  if(jumpJ > groundY - dinoH - 10) jumpJ=Math.max(48, groundY - dinoH - 10);
  M={ scale:s, ps:ps, headR:headR, stemH:stemH, beamTh:6*s, pxPerBeat:124*s, groundY:groundY, centerX:Math.round(W/2), dinoW:22*ps, dinoH:dinoH, jumpJ:jumpJ };
}
window.addEventListener('resize', resize);

var STAND=[
"............XXXXXXXXXX",
"............XXXOXXXXXX",
"............XXXXXXXXXX",
"............XXXXXXXXXX",
"............XXXXXX....",
"............XXXXXX....",
"............XXXXXXXX..",
"........XXXXXXXXXXX...",
"........XXXXXXXXXXX...",
"......XXXXXXXXXXXXXXX.",
"......XXXXXXXXXXXXXXX.",
"........XXXXXXXXXXX...",
"........XXXXXXXXXXX...",
"........XXXXXXXXXXX...",
"........XXXXXXXXXXX...",
"........XXXXXXXXXXX...",
"........XX....XX......",
"........XX....XX......",
"........XX....XX......",
"........XX....XX......",
"........XX....XX......",
"........XX....XX......",
"........XXXX.XXXX....."
];
var RUNA=STAND.slice(0,16).concat([
"........XX....XX......",
"........XX....XX......",
"........XXXX.XX.......",
".............XX.......",
".............XX.......",
".............XX.......",
".............XXXX....."
]);
var RUNB=STAND.slice(0,16).concat([
"........XX....XX......",
"........XX....XX......",
"........XX...XXXX.....",
"........XX............",
"........XX............",
"........XX............",
"........XXXX.........."
]);
function makeHurt(rows){
  return rows.map(function(row,r){
    if(r<1||r>3) return row;
    var a=row.split('');
    if(r===1){a[14]='.';a[15]='X';a[16]='.';}
    if(r===2){a[15]='.';}
    if(r===3){a[14]='.';a[16]='.';}
    return a.join('');
  });
}
var HURT=makeHurt(STAND);
var SW=22, SH=23;
var CLOUD=[
"..........XXX..........",
"........XX...XX........",
"......XX.......XX......",
"...XXX...........XXX...",
"..X...............X....",
".X.................X...",
"X...................X..",
".XXXXXXXXXXXXXXXXXXXXX."
];
var CW=23, CH=8;

function drawMatrix(m, left, top, psx, psy, color, eye){
  for(var r=0;r<m.length;r++){
    var row=m[r];
    for(var c=0;c<row.length;c++){
      var ch=row[c]; if(ch==='.') continue;
      ctx.fillStyle = (ch==='O') ? eye : color;
      ctx.fillRect(Math.round(left+c*psx), Math.round(top+r*psy), Math.ceil(psx)+1, Math.ceil(psy)+1);
    }
  }
}

function diffParams(){
  var t=clamp(Math.floor(streak/6)/MAX_LEVEL,0,1);
  return { eighth:lerp(0.00,0.55,t), half:lerp(0.45,0.12,t), whole:lerp(0.18,0.03,t), restP:lerp(0.50,0.12,t) };
}

var notes=[], genBeat=LEAD;
function randBar(){
  var dp=diffParams(), beats=[],i;
  for(i=0;i<4;i++){ if(Math.random()<dp.eighth) beats.push([{length:72,rest:false},{length:72,rest:false}]); else beats.push([{length:144,rest:false}]); }
  var comps=[],idx=0;
  while(idx<4){
    var rem=4-idx, r=Math.random(), g=1;
    if(rem>=4 && r<dp.whole) g=4; else if(rem>=2 && r<dp.half) g=2;
    if(g===4) comps.push({length:576,rest:false});
    else if(g===2) comps.push({length:288,rest:false});
    else comps=comps.concat(beats[idx]);
    idx+=g;
  }
  for(var c=0;c<comps.length;c++){ if(comps[c].length===144 && !comps[c].rest && Math.random()<dp.restP) comps[c].rest=true; }
  return comps;
}
function buildBars(count){
  for(var b=0;b<count;b++){
    var comps=randBar(), barStart=genBeat, slice=[];
    for(var c=0;c<comps.length;c++){
      var co=comps[c], n={beat:genBeat, len:co.length, rest:co.rest, beatInBar:genBeat-barStart, beam:null, judged:null, resolved:false, air:false, _x:0};
      notes.push(n); slice.push(n); genBeat += co.length/144;
    }
    var k=0;
    while(k<slice.length){
      if(slice[k].len===72 && !slice[k].rest){
        var run=[slice[k]], j=k+1;
        while(j<slice.length && slice[j].len===72 && !slice[j].rest){ run.push(slice[j]); j++; }
        for(var m=0;m<run.length;m++) run[m].beam = run.length>=2 ? 'beam' : 'flag';
        k=j;
      } else k++;
    }
  }
}
function pruneRegen(cb){
  var horizon=cb+2, kept=[], maxEnd=horizon;
  for(var i=0;i<notes.length;i++){
    var n=notes[i];
    if(n.beat<=horizon && n.beat>cb-8){
      kept.push(n);
      var e=n.beat + n.len/144;
      if(e>maxEnd) maxEnd=e;
    }
  }
  notes=kept; genBeat=maxEnd; buildBars(4);
}

var actx=null, masterGain=null, t0=0, secPerBeat=60/bpm, nextClickBeat=0, schedId=null;
function ensureAudio(){
  if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); masterGain=actx.createGain(); masterGain.connect(actx.destination); }
  if(actx.state==='suspended') actx.resume();
  masterGain.gain.value = METRO?1:0;
}
function blip(time, accent){
  var o=actx.createOscillator(), g=actx.createGain();
  o.type='triangle'; o.frequency.value = accent?1500:1000;
  g.gain.setValueAtTime(0.0001,time);
  g.gain.exponentialRampToValueAtTime(accent?0.5:0.32, time+0.001);
  g.gain.exponentialRampToValueAtTime(0.0001, time+0.09);
  o.connect(g); g.connect(masterGain); o.start(time); o.stop(time+0.1);
}
function sfx(kind){
  if(!actx) return;
  var t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
  o.connect(g); g.connect(actx.destination);
  if(kind==='jump'){ o.type='square'; o.frequency.setValueAtTime(520,t); o.frequency.exponentialRampToValueAtTime(760,t+0.05); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.10,t+0.004); g.gain.exponentialRampToValueAtTime(0.0001,t+0.07); o.start(t); o.stop(t+0.08); }
  else if(kind==='hit'){ o.type='sawtooth'; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(70,t+0.18); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.30,t+0.004); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22); o.start(t); o.stop(t+0.24); }
  else if(kind==='ding'){ o.type='triangle'; o.frequency.setValueAtTime(1200,t); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.22,t+0.004); g.gain.exponentialRampToValueAtTime(0.0001,t+0.16); o.start(t); o.stop(t+0.18); }
}
function schedule(){
  if(!playing) return;
  masterGain.gain.value = METRO?1:0;
  var ahead=0.12;
  while(t0 + nextClickBeat*secPerBeat < actx.currentTime + ahead){
    var tt=t0 + nextClickBeat*secPerBeat;
    if(tt >= actx.currentTime - 0.02) blip(tt, nextClickBeat%4===0);
    nextClickBeat++;
  }
}
function curBeatNow(){ return playing ? (actx.currentTime - t0)/secPerBeat : pausedBeat; }

var playing=false, pausedBeat=LEAD+0.5, lastBeatInt=-1, pulseT=0;
var streak=0, milestoneT=-1;
var hiScore=(function(){try{var v=parseInt(localStorage.getItem(HI_KEY),10); return isFinite(v)?v:0;}catch(e){return 0;}})();
function bumpHi(v){ if(v>hiScore){ hiScore=v; try{localStorage.setItem(HI_KEY,String(hiScore));}catch(e){} } }
var jumping=false, jumpStart=0, yOff=0, runFrame=0, lastLegPhase=-1;
var sqX=1, sqY=1;
var dropY=-260, hurtUntil=-1;
var clouds=[], lastT=performance.now();

function initClouds(){ clouds=[]; for(var i=0;i<4;i++) clouds.push({ x:Math.random()*W, y:30+Math.random()*(H*0.32), s:0.7+Math.random()*0.7 }); }

function updatePlayBtn(){
  if(playing){ playBtn.textContent='■ Stop'; playBtn.classList.add('on'); }
  else { playBtn.textContent='▶ Play'; playBtn.classList.remove('on'); }
}
function setBpm(v){
  bpm=v; bpmEl.textContent=v+' BPM';
  if(playing){ var cb=curBeatNow(); secPerBeat=60/bpm; t0=actx.currentTime - cb*secPerBeat; }
}
function start(){
  ensureAudio();
  secPerBeat=60/bpm; t0=actx.currentTime; nextClickBeat=0; pausedBeat=0;
  notes.length=0; genBeat=LEAD; buildBars(8);
  playing=true; lastBeatInt=-1; pulseT=performance.now();
  streak=0; milestoneT=-1; jumping=false; yOff=0; hurtUntil=-1; lastLegPhase=-1;
  readyEl.style.display='none';
  updatePlayBtn();
  if(!schedId) schedId=setInterval(schedule,25);
}
function stop(){
  var ended=streak; streak=0; bumpHi(ended);
  playing=false;
  if(schedId){ clearInterval(schedId); schedId=null; }
  jumping=false; yOff=0;
  readyEl.style.display='flex';
  updatePlayBtn();
}
function registerMiss(n, now, cb){
  n.resolved=true; n.judged='miss';
  hurtUntil=now+380;
  sfx('hit');
  var ended=streak; streak=0; bumpHi(ended);
  pruneRegen(cb);
}
function registerClear(n, now){
  n.resolved=true; n.judged='hit'; streak++; bumpHi(streak);
  if(streak%10===0){ milestoneT=now; sfx('ding'); }
}
function judgeTap(){
  var cb=curBeatNow(), best=null, bestD=1e9;
  for(var i=0;i<notes.length;i++){
    var n=notes[i]; if(n.resolved||n.rest) continue;
    var d=cb - n.beat;
    if(d>=-TAP_EARLY && d<=TAP_LATE){ var ad=Math.abs(d); if(ad<bestD){ bestD=ad; best=n; } }
  }
  if(best) registerClear(best, performance.now());
}
function doJump(){
  if(!playing||jumping) return;
  jumping=true; jumpStart=performance.now();
  sqX=0.96; sqY=1.05;
  sfx('jump');
}
function actionPrimary(){
  if(!playing){ start(); return; }
  judgeTap();
  doJump();
}

function updateNotes(cb, now){
  var cx=M.centerX, ps=M.ps, bodyL=cx-2*ps, bodyR=cx+7*ps, hr=M.headR, sc=M.scale, grace=hr*0.8;
  for(var i=0;i<notes.length;i++){
    var n=notes[i]; if(n.resolved||n.rest) continue;
    var nx=cx + (n.beat-cb)*M.pxPerBeat;
    var noteL=nx-hr, noteR=nx+hr*0.8+4*sc;
    var obsH=(n.len>=576)?(hr*1.6):M.stemH;
    if(noteL<=bodyR && noteR>=bodyL){
      if((M.groundY+yOff) <= (M.groundY - obsH + grace)) n.air=true;
    }
    if(cb >= n.beat + DEADLINE){
      if(n.air) registerClear(n, now);
      else registerMiss(n, now, cb);
    }
  }
}

function drawRest(x){
  var s=M.scale, cy=M.groundY;
  ctx.strokeStyle='#9a948b'; ctx.fillStyle='#9a948b'; ctx.lineWidth=2.2*s; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x-4*s,cy-9*s); ctx.lineTo(x+4*s,cy-3*s); ctx.lineTo(x-4*s,cy+3*s);
  ctx.lineTo(x+4*s,cy+9*s); ctx.lineTo(x-2*s,cy+13*s); ctx.stroke();
}
function drawNote(x,n){
  var s=M.scale, hr=M.headR, cy=M.groundY, open=n.len>=288;
  var stemW=Math.max(1.6,2*s);
  if(n.len<576){
    var sx=x+hr*0.8, top=M.groundY-M.stemH;
    ctx.strokeStyle=INK; ctx.lineWidth=stemW; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(sx, M.groundY); ctx.lineTo(sx, top); ctx.stroke();
    if(n.beam==='flag'){ ctx.beginPath(); ctx.moveTo(sx,top); ctx.quadraticCurveTo(sx+10*s,top+8*s,sx+6*s,top+18*s); ctx.stroke(); }
  }
  ctx.save(); ctx.translate(x,cy); ctx.rotate(-0.34);
  ctx.beginPath(); ctx.ellipse(0,0,hr,hr*0.62,0,0,7);
  if(open){ ctx.lineWidth=Math.max(1.8,2.2*s); ctx.strokeStyle=INK; ctx.fillStyle='#fff'; ctx.fill(); ctx.stroke(); }
  else { ctx.fillStyle=INK; ctx.fill(); }
  ctx.restore();
  if(MARKS && n.judged){
    var my=M.groundY+19*s; ctx.lineWidth=2.4*s; ctx.lineCap='round';
    ctx.strokeStyle = (n.judged==='hit') ? INK : HURT_RED;
    if(n.judged==='hit'){ ctx.beginPath(); ctx.moveTo(x-5*s,my); ctx.lineTo(x-1*s,my+5*s); ctx.lineTo(x+6*s,my-5*s); ctx.stroke(); }
    else { ctx.beginPath(); ctx.moveTo(x-4*s,my-4*s); ctx.lineTo(x+4*s,my+4*s); ctx.moveTo(x+4*s,my-4*s); ctx.lineTo(x-4*s,my+4*s); ctx.stroke(); }
  }
  if(settings.aid!=='none' && !n.rest){
    var bib=((n.beatInBar%4)+4)%4, num=Math.floor(bib)+1, plus=(bib%1)>=0.5;
    var lab = plus ? 'ti' : 'ta';
    ctx.fillStyle='#9a948b'; ctx.font='700 '+Math.round(11*s)+'px system-ui,sans-serif'; ctx.textAlign='center';
    ctx.fillText(lab, x, M.groundY+35*s);
  }
}
function pad(n,w){ w=w||5; n=String(n|0); while(n.length<w) n='0'+n; return n; }

function draw(now, dt, cb){
  var s=M.scale, gY=M.groundY, cx=M.centerX, ppb=M.pxPerBeat;
  var speed = ppb/secPerBeat;
  var lineW=Math.max(1.4,1.8*s);
  ctx.clearRect(0,0,W,H);

  var cps=Math.max(2,Math.round(2*s));
  for(var ci=0;ci<clouds.length;ci++){
    var cl=clouds[ci];
    if(playing) cl.x -= speed*0.12*cl.s*dt;
    if(cl.x < -CW*cps-10){ cl.x = W + Math.random()*120; cl.y = 24+Math.random()*(H*0.3); cl.s=0.7+Math.random()*0.7; }
    drawMatrix(CLOUD, cl.x, cl.y, cps*cl.s, cps*cl.s, '#e6e6e6', '#e6e6e6');
  }

  ctx.strokeStyle=INK; ctx.lineWidth=lineW; ctx.beginPath(); ctx.moveTo(0,gY); ctx.lineTo(W,gY); ctx.stroke();

  for(var i=0;i<notes.length;i++) notes[i]._x = cx + (notes[i].beat - cb)*ppb;

  var run=[];
  function flushBeam(){
    if(run.length>=2){
      var xs=[]; for(var a=0;a<run.length;a++){ var xx=run[a]._x; if(xx>=-120&&xx<=W+120) xs.push(xx + M.headR*0.8); }
      if(xs.length>=2){
        var minx=Math.min.apply(null,xs), maxx=Math.max.apply(null,xs);
        ctx.fillStyle=INK;
        ctx.fillRect(Math.round(minx-1), Math.round(gY-M.stemH), Math.ceil(maxx-minx+2.4*s+2), Math.ceil(M.beamTh));
      }
    }
    run=[];
  }
  for(var e=0;e<notes.length;e++){
    var ne=notes[e];
    if(!ne.rest && ne.len===72 && ne.beam==='beam' && ne._x>=-120 && ne._x<=W+120) run.push(ne); else flushBeam();
  }
  flushBeam();

  for(var n2=0;n2<notes.length;n2++){
    var n=notes[n2], x=n._x; if(x<-70||x>W+70) continue;
    if(n.rest) drawRest(x); else drawNote(x,n);
  }

  dropY += ((SHOW_DINO?0:(H+260)) - dropY)*0.12;
  var onView = SHOW_DINO && dropY > -SH*M.ps && dropY < H;
  var hurtActive = onView && now < hurtUntil;
  var running = playing && cb>=LEAD && !jumping;
  if(onView){
    var psx=M.ps*sqX, psy=M.ps*sqY, dinoH=SH*psy;
    var left=cx-11*psx, top=gY+yOff+dropY-dinoH;
    var air=clamp((-yOff)/M.jumpJ,0,1);
    if(dropY<40){
      ctx.fillStyle='rgba(0,0,0,'+(0.13*(1-air*0.7))+')';
      ctx.beginPath(); ctx.ellipse(cx, gY+5, (M.dinoW*0.42)*(1-air*0.4), 5*(1-air*0.4), 0,0,7); ctx.fill();
    }
    var pose = jumping ? STAND : (hurtActive ? HURT : (running ? (runFrame?RUNB:RUNA) : STAND));
    var dinoColor = hurtActive ? ((Math.floor(now/80)%2===0) ? HURT_RED : BODY) : BODY;
    drawMatrix(pose, left, top, psx, psy, dinoColor, EYE);
  }

  if(PULSE && playing){
    var pp=clamp(1-(now-pulseT)/240,0,1);
    if(pp>0){ ctx.strokeStyle='rgba(83,83,83,'+(0.25*pp)+')'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.ellipse(cx, gY+5, 18+22*(1-pp), 6+5*(1-pp), 0,0,7); ctx.stroke(); }
  }

  if(playing && cb<LEAD){
    var cn=Math.ceil(LEAD-cb), frac=1-(cb-Math.floor(cb));
    ctx.save();
    ctx.translate(cx, gY-M.stemH-72*s);
    var pop=1+0.28*frac; ctx.scale(pop,pop);
    ctx.fillStyle='rgba(83,83,83,'+(0.35+0.55*frac)+')';
    ctx.font='900 '+Math.round(124*s)+'px "Courier New",ui-monospace,monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(String(cn>0?cn:1), 0, 0);
    ctx.restore();
    ctx.fillStyle='#a8a29e'; ctx.font='700 '+Math.round(12*s)+'px system-ui,sans-serif'; ctx.textAlign='center';
    ctx.fillText('GET  READY', cx, gY-M.stemH-156*s);
    for(var di=0;di<4;di++){
      var done = cb >= (LEAD-4+di);
      ctx.fillStyle = done ? BODY : '#e2e2e2';
      ctx.beginPath(); ctx.arc(cx + (di-1.5)*16*s, gY-M.stemH-18*s, 4*s, 0, 7); ctx.fill();
    }
  }

  if(playing){
    var flashOn = !(milestoneT>0 && (now-milestoneT)<260 && Math.floor((now-milestoneT)/45)%2===0);
    if(flashOn){
      var fs=Math.round(15*clamp(s,0.8,1.4));
      ctx.fillStyle=BODY; ctx.font='700 '+fs+'px "Courier New",ui-monospace,monospace';
      ctx.textAlign='right'; ctx.textBaseline='top';
      ctx.fillText('HI '+pad(hiScore)+' '+pad(streak), W-18, 16);
    }
  }
}

function frame(now){
  var dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  var cb=curBeatNow();
  if(playing){
    var bi=Math.floor(cb+1e-6);
    if(bi!==lastBeatInt){ lastBeatInt=bi; pulseT=now; }
    if(jumping){
      var D=clamp(0.45*secPerBeat + 0.32, 0.46, 0.70);
      var p=(now-jumpStart)/D;
      if(p>=1){ jumping=false; yOff=0; sqX=1.06; sqY=0.94; }
      else { yOff = -M.jumpJ*Math.sin(Math.PI*p); if(p<0.10){ sqX=0.96; sqY=1.05; } }
    }
    var runningNow = cb>=LEAD && !jumping;
    if(runningNow){
      var legPhase=Math.floor(cb*2);
      if(legPhase!==lastLegPhase){ lastLegPhase=legPhase; runFrame=runFrame?0:1; }
    } else {
      lastLegPhase=Math.floor(cb*2);
    }
    updateNotes(cb, now);
    if(genBeat < cb + 24) buildBars(4);
  }
  draw(now, dt, cb);
  requestAnimationFrame(frame);
}

playBtn.addEventListener('click', function(){ if(playing) stop(); else start(); playBtn.blur(); });
tempoEl.addEventListener('input', function(){ setBpm(parseInt(tempoEl.value,10)); });
gearBtn.addEventListener('click', function(e){ e.stopPropagation(); panel.classList.toggle('open'); });
document.addEventListener('pointerdown', function(e){ if(!panel.contains(e.target) && e.target!==gearBtn) panel.classList.remove('open'); });

stage.addEventListener('pointerdown', function(e){ e.preventDefault(); actionPrimary(); });

window.addEventListener('keydown', function(e){
  if(e.repeat) return;
  if(e.code==='Space'||e.key==='ArrowUp'||e.key==='w'||e.key==='W'){ e.preventDefault(); actionPrimary(); }
  else if(e.key==='Escape'){ panel.classList.remove('open'); }
}, true);

document.getElementById('optAid').addEventListener('change', function(){ settings.aid=this.value; });

resize(); initClouds(); buildBars(8); updatePlayBtn();
requestAnimationFrame(frame);
</script>
</body>
