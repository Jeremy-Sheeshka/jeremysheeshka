  .topbar nav a.cur{color:#5b9dff;background:#232733}
  .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line);padding:8px 18px;position:relative}

  .row select{font:inherit;border:1px solid var(--line2);border-radius:6px;padding:3px 6px;background:#fff}

  .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:8;padding:18px}
  #ready{background:rgba(255,255,255,.55);align-items:flex-start;padding-top:clamp(18px,7vh,64px)}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.16);padding:22px 26px;max-width:420px;width:100%;text-align:center}

  .card .sub{font-size:12px;letter-spacing:.5px;color:#a8a29e;margin-top:10px}
  .card .sub2{font-size:13px;letter-spacing:1px;color:#57534e;margin-top:8px;font-weight:600}

  if (streak < 4) return 0;

function weightsFor(level) {
  if (level <= 0) return { whole: 0.36, half: 0.49, quarter: 0.15, eighth: 0, halfRest: 0, quarterRest: 0 };
  if (level === 1) return { whole: 0.16, half: 0.34, quarter: 0.26, eighth: 0, halfRest: 0.24, quarterRest: 0 };

var notes = [];
var genBeat = MUSIC0;
function randBar(level) {
  var w = weightsFor(level);
  var comps = [];
  var rem = 4;
  var guard = 0;
  while (rem > 0.001 && guard++ < 16) {
    var cands = [];
    var total = 0;
    var add = function (len, wt, kind) {
      if (len <= rem + 0.001 && wt > 0) {
        cands.push({ len: len, wt: wt, kind: kind });
        total += wt;
      }
    };
    add(4, w.whole, 'W');
    add(2, w.half, 'H');
    add(2, w.halfRest, 'HR');
    add(1, w.quarter, 'Q');
    add(1, w.quarterRest, 'QR');
    add(1, w.eighth, 'E');
    if (cands.length === 0) {
      comps.push({ length: 144, rest: false, beam: null, gid: 0 });
      rem -= 1;
      continue;
    }
    var r = Math.random() * total;
    var acc = 0;
    var chosen = cands[cands.length - 1];
    for (var ci = 0; ci < cands.length; ci++) {
      acc += cands[ci].wt;
      if (r < acc) { chosen = cands[ci]; break; }
    }
    if (chosen.kind === 'W') comps.push({ length: 576, rest: false, beam: null, gid: 0 });
    else if (chosen.kind === 'H') comps.push({ length: 288, rest: false, beam: null, gid: 0 });
    else if (chosen.kind === 'HR') comps.push({ length: 288, rest: true, beam: null, gid: 0 });

function buildBars(count) {
  var lvl = levelFromStreak();
  for (var b = 0; b < count; b++) {
    var comps = randBar(lvl);

    for (var c = 0; c < comps.length; c++) {
      var co = comps[c];
      var n = {
        beat: genBeat,
        len: co.length,
        rest: co.rest,
        bib: genBeat - barStart,
        beam: co.beam || null,
        gid: co.gid || 0,
        gbb: 0,
        gend: 0,
        judged: null,
        resolved: false,
        air: false,
        tapped: false,
        _x: 0,
        _dx: 0

      notes.push(n);
      slice.push(n);
      genBeat += co.length / 144;
    }
    var k = 0;
    while (k < slice.length) {
      if (slice[k].len === 72 && !slice[k].rest) {
        var j = k;
        while (j < slice.length && slice[j].len === 72 && !slice[j].rest) {
          j++;

        var runLen = j - k;
        for (var m = k; m < j; m++) {
          slice[m].beam = (runLen >= 2) ? 'beam' : 'flag';

        k = j;
      } else {

    var gi = 0;
    while (gi < slice.length) {
      var gg = slice[gi].gid;

var jumpStart = 0;
var jumpFromY = 0;
var jumpH = 0;
var jumpD = 300;
var yOff = 0;
var runFrame = 0;
var lastLegPhase = -1;
var sqX = 1, sqY = 1;
var dropY = -260;
var hurtUntil = -1;
var lastT = performance.now();
var clouds = [];
var skyClef = null;
function updatePlayBtn() {
  if (playing) {
    playBtn.textContent = '■ Stop';
    playBtn.classList.add('on');
  } else {
    playBtn.textContent = '▶ Play';
    playBtn.classList.remove('on');
  }
}
function setBpm(v) {
  bpm = v;
  bpmEl.textContent = v + ' BPM';
  if (playing) {
    var cb = curBeat(performance.now());
    secPerBeat = 60 / bpm;
    t0 = performance.now() - cb * secPerBeat * 1000;
  }
}
function start() {
  ensureAudio();
  secPerBeat = 60 / bpm;
  t0 = performance.now();
  nextClick = 0;
  pausedBeat = 0;
  notes.length = 0;
  genBeat = MUSIC0;
  buildBars(4);
  streak = 0;
  milestoneT = -1;
  jumping = false;
  bouncing = false;
  yOff = 0;
  hurtUntil = -1;
  lastLegPhase = -1;
  runFrame = 0;
  hideErr();
  readyEl.style.display = 'none';
  playing = true;
  updatePlayBtn();
}
function stop() {
  var ended = streak;
  streak = 0;
  bumpHi(ended);
  playing = false;
  if (schedId) { clearInterval(schedId); schedId = null; }
  jumping = false;
  bouncing = false;
  yOff = 0;
  hideErr();
  readyEl.style.display = 'flex';
  updatePlayBtn();
}
function registerMiss(n, now, cb) {
  n.resolved = true;
  n.judged = 'miss';
  hurtUntil = now + 380;
  sfx('hit');
  var ended = streak;
  streak = 0;
  bumpHi(ended);
  pruneRegen(cb);
}
function registerClear(n, now) {
  n.resolved = true;
  n.judged = 'hit';
  streak++;
  bumpHi(streak);
  if (streak % 10 === 0) {
    milestoneT = now;
    sfx('ding');
  }
}
function doJump() {
  if (!playing) return;
  var cb = curBeat(performance.now());
  if (cb < RUN_START) return;
  var D = clamp(0.40 * secPerBeat, 0.16, 0.34) * 1000;
  if (!(D > 0)) D = 300;
  if (!jumping) {
    jumping = true;
    bouncing = false;
    jumpStart = performance.now();
    jumpFromY = 0;
    jumpH = M.jJ;
    jumpD = D;
    sqX = 0.96; sqY = 1.05;
    sfx('jump');
  } else if (!bouncing) {
    bouncing = true;
    jumpStart = performance.now();
    jumpFromY = yOff;
    jumpH = M.jJ * 0.6;
    jumpD = D * 0.6;
    sqX = 0.97; sqY = 1.04;
    sfx('jump');
  }
}
function markBeamSiblingsTapped(n) {
  if (!n.gid) return;
  var idx = notes.indexOf(n);
  if (idx < 0) return;
  var f;
  for (f = idx + 1; f < notes.length && notes[f].gid === n.gid; f++) {
    if (!notes[f].resolved) notes[f].tapped = true;
  }
  var bwd;
  for (bwd = idx - 1; bwd >= 0 && notes[bwd].gid === n.gid; bwd--) {
    if (!notes[bwd].resolved) notes[bwd].tapped = true;
  }
}
function judgeTap() {
  if (!playing) return;
  var cb = curBeat(performance.now());
  if (cb < RUN_START) return;
  var best = null;
  var bestD = 1e9;
  for (var i = 0; i < notes.length; i++) {
    var n = notes[i];
    if (n.resolved || n.rest || n.tapped) continue;
    var d = cb - n.beat;
    if (d >= -TAP_EARLY && d <= TAP_LATE) {
      var ad = Math.abs(d);
      if (ad < bestD) { bestD = ad; best = n; }
    }
  }
  if (best) {
    best.tapped = true;
    markBeamSiblingsTapped(best);
  }
}
function actionPrimary() {
  if (!playing) {
    try { start(); } catch (e) { showErr('start: ' + (e && e.message ? e.message : e)); }
    return;
  }
  judgeTap();
  doJump();
}
function updateNotes(cb, now) {
  if (cb < RUN_START) return;
  for (var i = 0; i < notes.length; i++) {
    var n = notes[i];
    if (n.resolved || n.rest) continue;
    if (cb >= n.beat + MISS_AT) {
      if (n.tapped) registerClear(n, now);
      else registerMiss(n, now, cb);
    }
  }
}
function initClouds() {
  clouds = [];
  for (var i = 0; i < 4; i++) {
    clouds.push({
      x: Math.random() * W,
      y: 30 + Math.random() * (H * 0.32),
      s: 0.7 + Math.random() * 0.7
    });
  }
}
function initSky() {
  skyClef = {
    x: Math.random() * W,
    y: 24 + Math.random() * (H * 0.30),
    s: 1.2 + Math.random() * 0.6,
    g: Math.floor(Math.random() * TREBLES.length)
  };
}
function drawClouds(dt) {
  var s = M.s;
  var ppb = M.ppb;
  var speed = ppb / secPerBeat;
  var cps = Math.max(2, Math.round(2 * s));
  for (var ci = 0; ci < clouds.length; ci++) {
    var cl = clouds[ci];
    cl.x -= speed * 0.12 * cl.s * dt;
    if (cl.x < -CW * cps - 10) {
      cl.x = W + Math.random() * 120;
      cl.y = 24 + Math.random() * (H * 0.3);
      cl.s = 0.7 + Math.random() * 0.7;
    }
    drawMatrix(CLOUD, cl.x, cl.y, cps * cl.s, cps * cl.s, CLOUDCOL, CLOUDCOL);
  }
}
function drawSky(dt) {
  var s = M.s;
  var ppb = M.ppb;
  var speed = ppb / secPerBeat;
  var cpx = Math.max(2, Math.round(2 * s));
  var cl = skyClef;
  var pxs = cpx * cl.s;
  var glyph = TREBLES[cl.g];
  var rows = glyph.length;
  var cols = 0;
  for (var r = 0; r < rows; r++) { if (glyph[r].length > cols) cols = glyph[r].length; }
  var clefW = cols * pxs;
  var clefH = rows * pxs;
  cl.x -= speed * 0.08 * cl.s * dt;
  if (cl.x < -clefW - 20) {
    cl.x = W + 40 + Math.random() * 160;
    cl.y = 24 + Math.random() * (H * 0.30);
    cl.s = 1.2 + Math.random() * 0.6;
    cl.g = (cl.g + 1) % TREBLES.length;
    pxs = cpx * cl.s;
    glyph = TREBLES[cl.g];
    rows = glyph.length;
    cols = 0;
    for (var r2 = 0; r2 < rows; r2++) { if (glyph[r2].length > cols) cols = glyph[r2].length; }
    clefW = cols * pxs;
    clefH = rows * pxs;
  }
  var maxTop = M.gy - 24 - clefH;
  var drawY = cl.y;
  if (drawY > maxTop) drawY = maxTop;
  if (drawY < 8) drawY = 8;
  drawMatrix(glyph, cl.x, drawY, pxs, pxs, SKY_CLEF, SKY_CLEF);
}
function drawLine() {
  var lw = Math.max(1.4, 1.8 * M.s);
  ctx.strokeStyle = INK;
  ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.moveTo(0, M.gy);
  ctx.lineTo(W, M.gy);
  ctx.stroke();
}
function drawClef(gx) {
  var s = M.s;
  var gy = M.gy;
  var barH = 26 * s;
  var barW = 3.6 * s;
  var gap = 3.2 * s;
  var top = gy - barH / 2;
  ctx.fillStyle = INK;
  ctx.fillRect(Math.round(gx), Math.round(top), Math.ceil(barW), Math.ceil(barH));
  ctx.fillRect(Math.round(gx + barW + gap), Math.round(top), Math.ceil(barW), Math.ceil(barH));
  try {
    var tx = gx + barW * 2 + gap + 9 * s;
    ctx.font = '800 ' + Math.round(24 * s) + 'px "Courier New",monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('4', tx, gy - 2 * s);
    ctx.textBaseline = 'top';
    ctx.fillText('4', tx, gy + 2 * s);
  } catch (e) {}
}
function drawRest(x) {
  var s = M.s;
  var cy = M.gy;
  ctx.strokeStyle = INK;
  ctx.lineWidth = Math.max(1.6, 2 * s);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(x + 2 * s, cy - 13 * s);
  ctx.quadraticCurveTo(x - 4 * s, cy - 9 * s, x + 1 * s, cy - 4 * s);
  ctx.quadraticCurveTo(x + 5 * s, cy, x - 1 * s, cy + 5 * s);
  ctx.quadraticCurveTo(x - 4 * s, cy + 9 * s, x + 1 * s, cy + 12 * s);
  ctx.stroke();
}
function drawNote(x, n) {
  var s = M.s;
  var hr = M.hr;
  var gy = M.gy;
  var open = n.len >= 288;
  if (n.len < 576) {
    var sx = x + hr * 0.7;
    var tp = gy - M.stem;
    var sw = Math.max(2, 2.4 * s);
    ctx.fillStyle = INK;
    ctx.fillRect(Math.round(sx - sw / 2), Math.round(tp), Math.ceil(sw), Math.round(gy - tp));
    if (n.beam === 'flag') {
      ctx.fillRect(Math.round(sx), Math.round(tp), Math.ceil(8 * s), Math.ceil(sw));
      ctx.fillRect(Math.round(sx + 6 * s), Math.round(tp), Math.ceil(sw), Math.ceil(12 * s));
    }
  }
  ctx.beginPath();
  ctx.ellipse(x, gy, hr * 0.95, hr * 0.66, 0, 0, 7);
  if (open) {
    ctx.fillStyle = WHITE;
    ctx.fill();
    ctx.lineWidth = Math.max(2, 2.4 * s);
    ctx.strokeStyle = INK;
    ctx.stroke();
  } else {
    ctx.fillStyle = INK;
    ctx.fill();
  }
  if (MARKS && n.judged) {
    var my = gy + 19 * s;
    ctx.lineWidth = 2.4 * s;
    ctx.lineCap = 'round';
    ctx.strokeStyle = (n.judged === 'hit') ? INK : RED;
    if (n.judged === 'hit') {
      ctx.beginPath();
      ctx.moveTo(x - 5 * s, my);
      ctx.lineTo(x - 1 * s, my + 5 * s);
      ctx.lineTo(x + 6 * s, my - 5 * s);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(x - 4 * s, my - 4 * s);
      ctx.lineTo(x + 4 * s, my + 4 * s);
      ctx.moveTo(x + 4 * s, my - 4 * s);
      ctx.lineTo(x - 4 * s, my + 4 * s);
      ctx.stroke();
    }
  }
  if (settings.aid !== 'none' && !n.rest) {
    try {
      var bib = ((n.bib % 4) + 4) % 4;
      var plus = (bib % 1) >= 0.5;
      var lab;
      if (settings.aid === 'numbers') {
        lab = plus ? '+' : String(Math.floor(bib) + 1);
      } else {
        lab = plus ? 'ti' : 'ta';
      }
      ctx.fillStyle = GREY;
      ctx.font = '700 ' + Math.round(11 * s) + 'px system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(lab, x, gy + 35 * s);
    } catch (e) {}
  }
}
function drawWorld(cb) {
  var s = M.s;
  var gy = M.gy;
  var cx = M.cx;
  var ppb = M.ppb;
  var clefX = cx + (CLEF_BEAT - cb) * ppb;
  if (clefX > -70 && clefX < W + 70) drawClef(clefX);
  var i;
  for (i = 0; i < notes.length; i++) {
    var lin = cx + (notes[i].beat - cb) * ppb;
    notes[i]._x = lin;
    notes[i]._dx = lin;
  }
  var bth = Math.max(4, Math.round(6 * s));
  var bi = 0;
  while (bi < notes.length) {
    var g = notes[bi].gid;
    if (g > 0 && notes[bi].beam === 'beam') {
      var bj = bi;
      while (bj < notes.length && notes[bj].gid === g) bj++;
      var x0 = notes[bi]._dx + M.hr * 0.7;
      var x1 = notes[bj - 1]._dx + M.hr * 0.7;
      var bw3 = Math.ceil(x1 - x0) + Math.max(2, Math.round(2.4 * s));
      if (bw3 > 0 && x1 > -120 && x0 < W + 120) {
        ctx.fillStyle = INK;
        ctx.fillRect(Math.round(x0), Math.round(gy - M.stem), bw3, bth);
      }
      bi = bj;
    } else {
      bi++;
    }
  }
  var lo = cb - cx / ppb;
  var hi = cb + (W - cx) / ppb;
  var kStart = Math.floor((lo - MUSIC0) / 4);
  var kEnd = Math.ceil((hi - MUSIC0) / 4);
  var tickHalf = Math.round(14 * s);
  var bbw = Math.max(2, Math.round(2.2 * s));
  ctx.fillStyle = INK;
  for (var kk = kStart; kk <= kEnd; kk++) {
    if (kk < 1) continue;
    var B = MUSIC0 + 4 * kk;
    var bx = cx + (B - BAR_NUDGE - cb) * ppb;
    if (bx < -4 || bx > W + 4) continue;
    ctx.fillRect(Math.round(bx - bbw / 2), gy - tickHalf, bbw, tickHalf * 2);
  }
  for (var n2 = 0; n2 < notes.length; n2++) {
    var n = notes[n2];
    var dx = n._dx;
    if (dx < -70 || dx > W + 70) continue;
    if (n.rest) drawRest(dx);
    else drawNote(dx, n);
  }
}
function drawDino(now, cb) {
  var s = M.s;
  var gy = M.gy;
  var cx = M.cx;
  var ps = (isFinite(M.ps) && M.ps > 0) ? M.ps : 4;
  dropY += (0 - dropY) * 0.12;
  if (!isFinite(dropY)) dropY = 0;
  if (dropY < -260) dropY = -260;
  if (dropY > H) dropY = 0;
  var sqx = (isFinite(sqX) && sqX > 0) ? sqX : 1;
  var sqy = (isFinite(sqY) && sqY > 0) ? sqY : 1;
  var px = ps * sqx;
  var py = ps * sqy;
  if (!(px > 0)) px = ps;
  if (!(py > 0)) py = ps;
  var dH = SH * py;
  var dW = SW * px;
  var left = cx - 16 * px;
  var top = gy + yOff + dropY - dH;
  if (!isFinite(left)) left = cx - 80;
  if (!isFinite(top)) top = gy - 160;
  var jJ = (isFinite(M.jJ) && M.jJ > 0) ? M.jJ : 1;
  var air = clamp((-yOff) / jJ, 0, 1);
  if (dropY < 40) {
    ctx.fillStyle = rgba(0, 0, 0, 0.13 * (1 - air * 0.7));
    ctx.beginPath();
    ctx.ellipse(cx - 4 * px, gy + 5, Math.max(2, dW * 0.42 * (1 - air * 0.4)), Math.max(2, 5 * (1 - air * 0.4)), 0, 0, 7);
    ctx.fill();
  }
  var hurt = now < hurtUntil;
  var live = playing && cb >= RUN_START;
  var running = live && !jumping;
  var pose;
  if (jumping) pose = STAND;
  else if (hurt) pose = HURT;
  else if (running) pose = (runFrame ? RUNB : RUNA);
  else pose = STAND;
  var col;
  if (hurt) col = (Math.floor(now / 80) % 2 === 0) ? RED : BODY;
  else col = BODY;
  drawMatrix(pose, left, top, px, py, col, EYE);
}
function drawCountdown(cb) {
  var s = M.s;
  var gy = M.gy;
  var cx = M.cx;
  var dTop = gy - M.dH;
  var numY = dTop - 16 * s - 18 * s - 62 * s;
  try {
    if (cb < COUNT_START) {
      ctx.fillStyle = GREY;
      ctx.font = '800 ' + Math.round(20 * s) + 'px system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('GET  READY', cx, numY);
    } else if (cb < MUSIC0) {
      var cu = Math.floor(cb - COUNT_START) + 1;
      if (cu < 1) cu = 1;
      if (cu > 4) cu = 4;
      var frac = 1 - (cb - Math.floor(cb));
      ctx.save();
      ctx.translate(cx, numY);
      var pop = 1 + 0.28 * frac;
      ctx.scale(pop, pop);
      ctx.fillStyle = rgba(83, 83, 83, 0.35 + 0.55 * frac);
      ctx.font = '900 ' + Math.round(124 * s) + 'px "Courier New",monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(cu), 0, 0);
      ctx.restore();
    }
  } catch (e) {}
}
function drawHUD(now) {
  var s = M.s;
  var flashOn = !(milestoneT > 0 && (now - milestoneT) < 260 && Math.floor((now - milestoneT) / 45) % 2 === 0);
  if (!flashOn) return;
  try {
    var fs = Math.round(15 * clamp(s, 0.8, 1.4));
    ctx.fillStyle = BODY;
    ctx.font = '700 ' + fs + 'px "Courier New",monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.fillText('HI ' + pad(hiScore) + ' ' + pad(streak), W - 18, 16);
  } catch (e) {}
}
function pad(n, w) {
  w = w || 5;
  n = String(n | 0);
  while (n.length < w) n = '0' + n;
  return n;
}
function draw(now, dt, cb) {
  ctx.clearRect(0, 0, W, H);
  drawClouds(dt);
  drawSky(dt);
  drawLine();
  if (playing) drawWorld(cb);
  drawDino(now, cb);
  if (playing && cb < MUSIC0) drawCountdown(cb);
  if (playing && cb >= RUN_START) drawHUD(now);
}
var schedId = null;
function frame(now) {
  try {
    var dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    var cb = curBeat(now);
    if (playing) {
      scheduleClicks(now);
      if (jumping) {
        var D = jumpD;
        if (!(D > 0)) {
          jumping = false;
          yOff = 0;
        } else {
          var p = (now - jumpStart) / D;
          if (p >= 1) {
            jumping = false;
            bouncing = false;
            yOff = 0;
            sqX = 1.06;
            sqY = 0.94;
          } else {
            var shape;
            if (p < 0.30) shape = Math.sin((Math.PI / 2) * (p / 0.30));
            else shape = Math.cos((Math.PI / 2) * ((p - 0.30) / 0.70));
            yOff = jumpFromY * (1 - p) - jumpH * shape;
            if (p < 0.08) { sqX = 0.97; sqY = 1.04; }
          }
        }
      }
      var live = cb >= RUN_START;
      if (live && !jumping) {
        var lp = Math.floor(cb * 2);
        if (lp !== lastLegPhase) {
          lastLegPhase = lp;
          runFrame = runFrame ? 0 : 1;
        }
      } else {
        lastLegPhase = Math.floor(cb * 2);
      }
      updateNotes(cb, now);
      if (genBeat < cb + 16) buildBars(4);
    }
    draw(now, dt, cb);
  } catch (e) {
    showErr('GAME ERROR\n' + (e && e.message ? e.message : e));
  }
  if (errBox && errBox.style.display === 'block' && (now - errShownAt) > 4000) {
    hideErr();
  }
  requestAnimationFrame(frame);
}
playBtn.addEventListener('click', function () {
  if (playing) stop(); else start();
  playBtn.blur();
});
tempoEl.addEventListener('input', function () {
  setBpm(parseInt(tempoEl.value, 10));
});
gearBtn.addEventListener('click', function (e) {
  e.stopPropagation();
  panel.classList.toggle('open');
});
document.addEventListener('pointerdown', function (e) {
  if (!panel.contains(e.target) && e.target !== gearBtn) {
    panel.classList.remove('open');
  }
});
stage.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  actionPrimary();
});
jumpBtn.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  e.stopPropagation();
  actionPrimary();
  jumpBtn.blur();
});
errBox.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  e.stopPropagation();
  hideErr();
});
window.addEventListener('keydown', function (e) {
  if (e.repeat) return;
  if (e.code === 'Space' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
    e.preventDefault();
    actionPrimary();
  } else if (e.key === 'Escape') {
    panel.classList.remove('open');
  }
}, true);
document.getElementById('optAid').addEventListener('change', function () {
  settings.aid = this.value;
});
resize();
initClouds();
initSky();
buildBars(4);
updatePlayBtn();
requestAnimationFrame(frame);
</script>
