<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Stylized container ship at the Prince Rupert harbour">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2faf9d"/>
      <stop offset="1" stop-color="#0f5f73"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7442f"/>
      <stop offset="1" stop-color="#8e2f1f"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a4a"/>
      <stop offset="1" stop-color="#1a2530"/>
    </linearGradient>
    <linearGradient id="stack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8edf0"/>
      <stop offset="1" stop-color="#c3ced4"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="#dfeef0"/>

  <!-- Distant hills -->
  <path d="M0 300 L120 210 L240 270 L380 180 L520 260 L660 190 L800 250 L800 600 L0 600 Z" fill="#a8c8c9" opacity="0.6"/>

  <!-- Sea -->
  <rect y="330" width="800" height="270" fill="url(#sea)"/>
  <path d="M0 352 C 100 342, 200 362, 300 352 C 400 342, 500 362, 600 352 C 700 342, 760 358, 800 350 L800 380 L0 380 Z" fill="#9fe3cd" opacity="0.4"/>
  <path d="M0 410 C 120 398, 260 420, 400 408 C 540 396, 660 420, 800 408" fill="none" stroke="#9fe3cd" stroke-width="4" opacity="0.35"/>
  <path d="M0 470 C 140 460, 280 480, 420 468 C 560 456, 680 478, 800 468" fill="none" stroke="#9fe3cd" stroke-width="3" opacity="0.3"/>

  <!-- Hull -->
  <path d="M140 470 L180 540 L640 540 L680 470 Z" fill="url(#hull)"/>
  <rect x="140" y="440" width="540" height="32" rx="4" fill="url(#deck)"/>
  <path d="M180 540 L200 560 L610 560 L640 540 Z" fill="#6e2418" opacity="0.7"/>
  <!-- Waterline -->
  <path d="M140 470 L680 470" stroke="#083f52" stroke-width="5" opacity="0.5"/>

  <!-- Containers row 1 -->
  <g>
    <rect x="180" y="380" width="58" height="60" fill="#d9534f" stroke="#b3403c" stroke-width="2"/>
    <rect x="242" y="380" width="58" height="60" fill="#f0ad4e" stroke="#d0943f" stroke-width="2"/>
    <rect x="304" y="380" width="58" height="60" fill="#5cb85c" stroke="#4a9e4a" stroke-width="2"/>
    <rect x="366" y="380" width="58" height="60" fill="#337ab7" stroke="#28669a" stroke-width="2"/>
    <rect x="428" y="380" width="58" height="60" fill="#f5f5f5" stroke="#d0d0d0" stroke-width="2"/>
    <rect x="490" y="380" width="58" height="60" fill="#f0ad4e" stroke="#d0943f" stroke-width="2"/>
    <rect x="552" y="380" width="58" height="60" fill="#d9534f" stroke="#b3403c" stroke-width="2"/>
    <rect x="614" y="380" width="48" height="60" fill="#337ab7" stroke="#28669a" stroke-width="2"/>
  </g>
  <!-- Containers row 2 -->
  <g>
    <rect x="180" y="316" width="58" height="60" fill="#5cb85c" stroke="#4a9e4a" stroke-width="2"/>
    <rect x="242" y="316" width="58" height="60" fill="#d9534f" stroke="#b3403c" stroke-width="2"/>
    <rect x="304" y="316" width="58" height="60" fill="#f5f5f5" stroke="#d0d0d0" stroke-width="2"/>
    <rect x="366" y="316" width="58" height="60" fill="#f0ad4e" stroke="#d0943f" stroke-width="2"/>
    <rect x="428" y="316" width="58" height="60" fill="#337ab7" stroke="#28669a" stroke-width="2"/>
    <rect x="490" y="316" width="58" height="60" fill="#d9534f" stroke="#b3403c" stroke-width="2"/>
    <rect x="552" y="316" width="58" height="60" fill="#5cb85c" stroke="#4a9e4a" stroke-width="2"/>
    <rect x="614" y="316" width="48" height="60" fill="#f0ad4e" stroke="#d0943f" stroke-width="2"/>
  </g>
  <!-- Containers row 3 (partial) -->
  <g>
    <rect x="242" y="252" width="58" height="60" fill="#337ab7" stroke="#28669a" stroke-width="2"/>
    <rect x="304" y="252" width="58" height="60" fill="#f5f5f5" stroke="#d0d0d0" stroke-width="2"/>
    <rect x="366" y="252" width="58" height="60" fill="#d9534f" stroke="#b3403c" stroke-width="2"/>
    <rect x="428" y="252" width="58" height="60" fill="#5cb85c" stroke="#4a9e4a" stroke-width="2"/>
    <rect x="490" y="252" width="58" height="60" fill="#f0ad4e" stroke="#d0943f" stroke-width="2"/>
  </g>

  <!-- Bridge -->
  <rect x="150" y="250" width="110" height="120" rx="6" fill="url(#stack)"/>
  <rect x="160" y="262" width="36" height="30" rx="3" fill="#2faf9d"/>
  <rect x="204" y="262" width="36" height="30" rx="3" fill="#2faf9d"/>
  <rect x="160" y="300" width="36" height="30" rx="3" fill="#2faf9d"/>
  <rect x="204" y="300" width="36" height="30" rx="3" fill="#2faf9d"/>
  <rect x="150" y="238" width="110" height="16" rx="3" fill="#e76f51"/>

  <!-- Funnel -->
  <rect x="620" y="230" width="42" height="130" rx="5" fill="#e76f51"/>
  <rect x="620" y="230" width="42" height="26" rx="5" fill="#1a2530"/>
  <path d="M622 236 L660 236" stroke="#f5f5f5" stroke-width="3"/>

  <!-- Smoke puffs -->
  <circle cx="642" cy="196" r="16" fill="#dbe4e8" opacity="0.7"/>
  <circle cx="668" cy="176" r="20" fill="#cbd8de" opacity="0.55"/>
  <circle cx="700" cy="152" r="24" fill="#bcccd4" opacity="0.4"/>

  <!-- Port crane silhouettes -->
  <g stroke="#2b3a4a" stroke-width="6" fill="none" opacity="0.8">
    <path d="M40 330 L40 140 L120 140"/>
    <path d="M120 140 L120 150"/>
    <path d="M40 330 L40 320"/>
    <path d="M720 330 L720 160 L790 160"/>
    <path d="M790 160 L790 170"/>
    <path d="M720 330 L720 320"/>
  </g>
  <g stroke="#2b3a4a" stroke-width="4" fill="none" opacity="0.6">
    <path d="M40 180 L120 180"/>
    <path d="M720 200 L790 200"/>
  </g>

  <!-- Gulls -->
  <g stroke="#33404d" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M300 120 Q310 108 320 120 Q330 108 340 120"/>
    <path d="M480 90 Q488 80 496 90 Q504 80 512 90"/>
    <path d="M560 140 Q566 132 572 140 Q578 132 584 140"/>
  </g>
</svg>
