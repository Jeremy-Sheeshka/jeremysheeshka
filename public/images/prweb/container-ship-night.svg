<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Container ship at night, harbour lights glowing">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3d4d"/>
      <stop offset="1" stop-color="#06222e"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e2f1f"/>
      <stop offset="1" stop-color="#571c12"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16202b"/>
      <stop offset="1" stop-color="#0c131b"/>
    </linearGradient>
    <radialGradient id="light" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8f0f2" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#e8f0f2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="#0a1a24"/>
  <circle cx="640" cy="90" r="34" fill="#e8f0f2"/>
  <circle cx="640" cy="90" r="90" fill="url(#moonGlow)"/>
  <circle cx="630" cy="84" r="34" fill="#0a1a24" opacity="0.25"/>

  <!-- Stars -->
  <g fill="#dfeef0" opacity="0.7">
    <circle cx="120" cy="60" r="1.8"/><circle cx="250" cy="110" r="1.2"/><circle cx="380" cy="40" r="1.6"/>
    <circle cx="500" cy="130" r="1.3"/><circle cx="60" cy="150" r="1.4"/><circle cx="300" cy="180" r="1.1"/>
    <circle cx="720" cy="200" r="1.5"/><circle cx="450" cy="80" r="1.2"/><circle cx="170" cy="200" r="1.4"/>
  </g>

  <!-- Distant hills -->
  <path d="M0 300 L120 210 L240 270 L380 180 L520 260 L660 190 L800 250 L800 600 L0 600 Z" fill="#0e2836" opacity="0.9"/>

  <!-- Sea -->
  <rect y="330" width="800" height="270" fill="url(#sea)"/>
  <path d="M0 400 C 120 388, 260 410, 400 398 C 540 386, 660 410, 800 398" fill="none" stroke="#1f5c6b" stroke-width="4" opacity="0.6"/>
  <path d="M0 460 C 140 450, 280 470, 420 458 C 560 446, 680 468, 800 458" fill="none" stroke="#1f5c6b" stroke-width="3" opacity="0.5"/>
  <path d="M0 520 C 150 510, 300 530, 450 518 C 600 506, 700 528, 800 518" fill="none" stroke="#174a58" stroke-width="3" opacity="0.5"/>

  <!-- Hull -->
  <path d="M140 470 L180 540 L640 540 L680 470 Z" fill="url(#hull)"/>
  <rect x="140" y="440" width="540" height="32" rx="4" fill="url(#deck)"/>
  <path d="M180 540 L200 560 L610 560 L640 540 Z" fill="#3d120a" opacity="0.8"/>
  <path d="M140 470 L680 470" stroke="#06222e" stroke-width="5" opacity="0.8"/>

  <!-- Containers row 1 (muted night colors) -->
  <g>
    <rect x="180" y="380" width="58" height="60" fill="#7a2f2b" stroke="#5c231f" stroke-width="2"/>
    <rect x="242" y="380" width="58" height="60" fill="#8a6628" stroke="#684d1e" stroke-width="2"/>
    <rect x="304" y="380" width="58" height="60" fill="#3f6b3f" stroke="#2e4f2e" stroke-width="2"/>
    <rect x="366" y="380" width="58" height="60" fill="#28546f" stroke="#1d3f54" stroke-width="2"/>
    <rect x="428" y="380" width="58" height="60" fill="#8d9194" stroke="#6b6f72" stroke-width="2"/>
    <rect x="490" y="380" width="58" height="60" fill="#8a6628" stroke="#684d1e" stroke-width="2"/>
    <rect x="552" y="380" width="58" height="60" fill="#7a2f2b" stroke="#5c231f" stroke-width="2"/>
    <rect x="614" y="380" width="48" height="60" fill="#28546f" stroke="#1d3f54" stroke-width="2"/>
  </g>
  <!-- Containers row 2 -->
  <g>
    <rect x="180" y="316" width="58" height="60" fill="#3f6b3f" stroke="#2e4f2e" stroke-width="2"/>
    <rect x="242" y="316" width="58" height="60" fill="#7a2f2b" stroke="#5c231f" stroke-width="2"/>
    <rect x="304" y="316" width="58" height="60" fill="#8d9194" stroke="#6b6f72" stroke-width="2"/>
    <rect x="366" y="316" width="58" height="60" fill="#8a6628" stroke="#684d1e" stroke-width="2"/>
    <rect x="428" y="316" width="58" height="60" fill="#28546f" stroke="#1d3f54" stroke-width="2"/>
    <rect x="490" y="316" width="58" height="60" fill="#7a2f2b" stroke="#5c231f" stroke-width="2"/>
    <rect x="552" y="316" width="58" height="60" fill="#3f6b3f" stroke="#2e4f2e" stroke-width="2"/>
    <rect x="614" y="316" width="48" height="60" fill="#8a6628" stroke="#684d1e" stroke-width="2"/>
  </g>
  <!-- Containers row 3 (partial) -->
  <g>
    <rect x="242" y="252" width="58" height="60" fill="#28546f" stroke="#1d3f54" stroke-width="2"/>
    <rect x="304" y="252" width="58" height="60" fill="#8d9194" stroke="#6b6f72" stroke-width="2"/>
    <rect x="366" y="252" width="58" height="60" fill="#7a2f2b" stroke="#5c231f" stroke-width="2"/>
    <rect x="428" y="252" width="58" height="60" fill="#3f6b3f" stroke="#2e4f2e" stroke-width="2"/>
    <rect x="490" y="252" width="58" height="60" fill="#8a6628" stroke="#684d1e" stroke-width="2"/>
  </g>

  <!-- Bridge -->
  <rect x="150" y="250" width="110" height="120" rx="6" fill="#5c6a73"/>
  <rect x="160" y="262" width="36" height="30" rx="3" fill="#1b2f3a"/>
  <rect x="204" y="262" width="36" height="30" rx="3" fill="#1b2f3a"/>
  <rect x="160" y="300" width="36" height="30" rx="3" fill="#1b2f3a"/>
  <rect x="204" y="300" width="36" height="30" rx="3" fill="#1b2f3a"/>
  <!-- Lit windows -->
  <rect x="163" y="265" width="12" height="10" fill="#ffd98a"/>
  <rect x="207" y="265" width="12" height="10" fill="#ffd98a"/>
  <rect x="163" y="303" width="12" height="10" fill="#ffd98a"/>
  <rect x="207" y="303" width="12" height="10" fill="#ffd98a"/>

  <!-- Funnel -->
  <rect x="620" y="230" width="42" height="130" rx="5" fill="#8e3a24"/>
  <rect x="620" y="230" width="42" height="26" rx="5" fill="#0c131b"/>

  <!-- Glow from bridge & funnel -->
  <ellipse cx="205" cy="300" rx="160" ry="110" fill="url(#light)" opacity="0.25"/>
  <circle cx="641" cy="240" r="70" fill="url(#light)" opacity="0.2"/>

  <!-- Harbour lights -->
  <circle cx="40" cy="330" r="6" fill="#ffd98a"/><circle cx="40" cy="330" r="26" fill="url(#light)" opacity="0.5"/>
  <circle cx="720" cy="330" r="6" fill="#ffd98a"/><circle cx="720" cy="330" r="26" fill="url(#light)" opacity="0.5"/>
  <circle cx="40" cy="180" r="4" fill="#ff9d5c"/><circle cx="40" cy="180" r="18" fill="url(#light)" opacity="0.4"/>
  <circle cx="720" cy="200" r="4" fill="#ff9d5c"/><circle cx="720" cy="200" r="18" fill="url(#light)" opacity="0.4"/>

  <!-- Water reflections of lights -->
  <g fill="#ffd98a" opacity="0.35">
    <rect x="190" y="480" width="4" height="34"/>
    <rect x="212" y="500" width="4" height="24"/>
    <rect x="198" y="520" width="4" height="18"/>
    <rect x="620" y="486" width="4" height="30"/>
    <rect x="642" y="506" width="4" height="20"/>
  </g>
  <g fill="#ff9d5c" opacity="0.3">
    <rect x="34" y="350" width="4" height="40"/>
    <rect x="720" y="350" width="4" height="40"/>
  </g>

  <!-- Gulls -->
  <g stroke="#aebfc7" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M300 120 Q310 108 320 120 Q330 108 340 120"/>
    <path d="M480 90 Q488 80 496 90 Q504 80 512 90"/>
  </g>
</svg>
