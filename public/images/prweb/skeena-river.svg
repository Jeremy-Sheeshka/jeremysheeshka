<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Abstracted Skeena River flowing through the North Coast">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2a3d"/>
      <stop offset="0.55" stop-color="#123c56"/>
      <stop offset="1" stop-color="#1d5a6e"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f5f73"/>
      <stop offset="0.4" stop-color="#1d8a94"/>
      <stop offset="0.7" stop-color="#2faf9d"/>
      <stop offset="1" stop-color="#6fd0b2"/>
    </linearGradient>
    <linearGradient id="riverDeep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#083f52"/>
      <stop offset="0.5" stop-color="#0f6f80"/>
      <stop offset="1" stop-color="#27a295"/>
    </linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16384d"/>
      <stop offset="1" stop-color="#0d2435"/>
    </linearGradient>
    <linearGradient id="mtn2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4a5e"/>
      <stop offset="1" stop-color="#102c3f"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfeef0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#dfeef0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#dfeef0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#7fd8c4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7fd8c4" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blurSm"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Distant mountains -->
  <path d="M0 560 L140 400 L260 470 L400 330 L520 440 L680 300 L820 430 L980 340 L1140 450 L1280 360 L1440 440 L1600 380 L1600 900 L0 900 Z" fill="url(#mtn2)" opacity="0.85"/>
  <path d="M0 610 L180 480 L340 560 L500 430 L660 545 L820 420 L980 540 L1140 460 L1300 555 L1460 470 L1600 540 L1600 900 L0 900 Z" fill="url(#mtn)" opacity="0.95"/>

  <!-- Fog band -->
  <rect x="0" y="470" width="1600" height="180" fill="url(#fog)"/>

  <!-- River surface -->
  <path d="M0 640 C 220 600, 420 690, 660 660 C 900 630, 1120 700, 1360 665 C 1460 650, 1530 655, 1600 640 L1600 900 L0 900 Z" fill="url(#riverDeep)"/>
  <path d="M0 680 C 240 645, 460 720, 700 695 C 950 668, 1180 730, 1420 700 C 1500 692, 1560 698, 1600 690 L1600 900 L0 900 Z" fill="url(#river)"/>

  <!-- Abstract river current ribbons -->
  <path d="M0 720 C 260 690, 520 760, 780 730 C 1020 702, 1260 760, 1600 730" fill="none" stroke="url(#river)" stroke-width="26" stroke-linecap="round" opacity="0.8" filter="url(#blurSm)"/>
  <path d="M0 770 C 300 745, 560 810, 820 785 C 1080 760, 1320 810, 1600 785" fill="none" stroke="#9fe3cd" stroke-width="12" stroke-linecap="round" opacity="0.55" filter="url(#blurSm)"/>
  <path d="M0 820 C 340 800, 600 858, 860 838 C 1120 818, 1360 860, 1600 840" fill="none" stroke="#cdf2e4" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
  <path d="M80 745 C 300 720, 480 775, 700 750" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M900 800 C 1100 780, 1280 828, 1500 810" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

  <!-- Soft bottom vignette -->
  <rect x="0" y="640" width="1600" height="260" fill="url(#sky)" opacity="0.0"/>
  <rect x="0" y="0" width="1600" height="900" fill="#04121c" opacity="0.12"/>
</svg>
