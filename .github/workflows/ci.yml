name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure pnpm build permissions
        run: echo '{"onlyBuiltDependencies":["esbuild","sharp"]}' > pnpm.json

      - name: Install dependencies
        run: |
          rm -f pnpm-lock.yaml
          pnpm install
        env:
          WEBMENTION_API_KEY: ${{ secrets.WEBMENTION_API_KEY }}
          WEBMENTION_URL: ${{ secrets.WEBMENTION_URL }}
          WEBMENTION_PINGBACK: ${{ secrets.WEBMENTION_PINGBACK }}

      - name: Build site
        run: pnpm run build
        env:
          WEBMENTION_API_KEY: ${{ secrets.WEBMENTION_API_KEY }}
          WEBMENTION_URL: ${{ secrets.WEBMENTION_URL }}
          WEBMENTION_PINGBACK: ${{ secrets.WEBMENTION_PINGBACK }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4